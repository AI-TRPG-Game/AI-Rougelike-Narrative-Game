  .esigil.tB{border-color:var(--accent-deep);background:color-mix(in srgb,var(--accent) 8%,var(--raise))}
  .esigil.tC{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--raise))}
  .esigil.tA .epat{color:var(--danger)}
  .esigil.tB .epat{color:var(--accent)}
  .esigil.tC .epat{color:var(--blue)}
  .esigs{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
  /* 一枚属性符号 ＝ 一层"薄牌"：底下一张小圆片，浮在纹章上 */
  .esig{display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:10px;
    background:color-mix(in srgb,var(--raise) 88%,transparent);
    border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .esig .sigil{color:var(--accent)}
  .esigil.tA .esig .sigil{color:var(--danger)}
  .esigil.tC .esig .sigil{color:var(--blue)}
  /* 一枚属性（不指定时）⇒ 符号区缩小，别撑出一个空盒 */
  .esigil .esigs:has(> .esig:only-child) .esig{width:48px;height:48px}
  .esigx{position:absolute;bottom:8px;left:0;right:0;text-align:center;
    font-size:10px;color:var(--faint);letter-spacing:.1em}
  /* 进场：属性符号逐枚浮现（与手牌带的 stagger 同一套语言）*/
  .esig{animation:fadeUp var(--t-slow) var(--ease) both;
    animation-delay:calc(.1s + var(--i,0) * 90ms)}

  /* ── 就地引导（2026-10-05）──────────────────────────────────────────
     刻意做得很轻：淡底 ＋ 一条彩色左边 ＋ 13px —— **不该被当成一个"东西"**。
     它出现时玩家该注意的是它**说的那件事**，不是这条提示本身。
     ⚠️ 绝不用 `position:fixed` 中央浮层 —— 那是"教程"的形状，而教程会被跳过。
     ⚠️ 绝不给它加"我知道了"按钮：它一出现就说明"你正需要它"，
        而玩家**做成那件事之后它自己就没了**（`markHint`），加按钮是多余的第二次点击。 */
  .hint{margin:7px 0 1px;padding:7px 11px;border-left:2px solid var(--gold-line);
    border-radius:0 7px 7px 0;background:color-mix(in srgb,var(--accent) 6%,transparent);
    color:var(--ink-soft);font-size:13px;line-height:1.6;
    animation:fadeUp var(--t-slow) var(--ease) both}
  .hint b{color:var(--accent);font-weight:600}
  /* 画布内那一条（教拖拽）—— 贴着画布底边，像"从这儿往上拖"的注解 */
  .hint.inCanvas{position:absolute;left:14px;right:14px;bottom:12px;z-index:5;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}

  /* ── 可访问性与交互细节 ──────────────────────────────────────────
     焦点环必须**存在**（键盘用户原先完全看不见自己停在哪）。暗底上用亮金。
     ⚠️ 旧浏览器不认识 :focus-visible ⇒ 整条规则被忽略，其余样式不受影响。 */
  button,input,select,textarea,.optchip,.who label{
    transition:background var(--t) var(--ease),border-color var(--t) var(--ease),
               color var(--t) var(--ease),box-shadow var(--t) var(--ease),
               transform var(--t) var(--ease);
  }
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
  .optchip:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .who label:focus-within{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
  .who input{accent-color:var(--accent)}
  .optchip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--raise))}
  .slot{transition:border-color var(--t) var(--ease)}

  /* ═══════════════════════════════════════════════════════════════════
     动效语言（2026-10-05 新增）
     ─────────────────────────────────────────────────────────────────
     业界共识（bestgaming.space「定义一套动效语言并贯彻全屏」＋
     Hogwarts Legacy 的菜单微动效）：**动效要短、要有方向、要能被关掉**。

     三条纪律：
       ① **只动 `transform` / `opacity`** —— 不动 `width` / `top` / `box-shadow`，
          那是逐帧重排。唯一例外是 `backdrop-filter`（遮罩进场），它不引发布局。
       ② **方向有含义**：进场 = 上移（"从下面递上来"），退场 = 缩小淡出
          （"被收走"）。上下都一样就成了"闪一下"，读不出发生了什么。
       ③ **时长有上限**：微交互 ≤180ms、进场 ≤420ms、大件 ≤720ms。
          超过这个量级玩家会觉得"卡"。

     ⚠️ 全部在 `prefers-reduced-motion` 下关掉（前庭障碍与注意力障碍的用户：
        大量位移会引发不适，这是可访问性的硬要求，不是加分项）。
     ⚠️ **零依赖**：没有 GSAP / anime.js，全是 CSS 关键帧 —— 离线也能跑。
     ═══════════════════════════════════════════════════════════════════ */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes msgIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  /* 卡片进场：上移 ＋ 淡入。`both` 保证动画延迟期间元素是透明的，
     否则会出现"一堆卡先出现在原位、再一起跳上来"的穿帮。 */
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes chipIn{from{opacity:0;transform:translate(-50%,calc(-50% + 10px)) scale(.96)}
                     to{opacity:1;transform:translate(-50%,-50%)}}
  /* 封面：字距从很宽收到正常 —— 这是"标题落定"最经典的一笔（字要"聚拢"才算写完）*/
  @keyframes titleSettle{from{opacity:0;letter-spacing:.62em;filter:blur(6px)}
                         to{opacity:1;letter-spacing:.24em;filter:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  /* 王徽：极慢自转（36s 一圈）。慢到"你不刻意看就察觉不到"—— 那是"活着"的量级；
     再快就变成"转圈 loading"，把封面的静谧感毁掉。 */
  @keyframes sigilSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  /* 鎏金扫光：一条斜向的高光缓缓掠过标题，制造"金属在反光"的错觉 */
  @keyframes sheen{0%{background-position:-160% 0}55%,100%{background-position:260% 0}}
  @keyframes dotBreathe{0%,100%{opacity:.3;transform:scale(.86)}50%{opacity:1;transform:scale(1)}}

  /* 逐条错开进场：`.col` 里的卡与画布块按 DOM 序依次浮现 */
  .col > .card{animation:cardIn var(--t-slow) var(--ease) both;
    animation-delay:calc(var(--i,0) * var(--stagger))}
  #colMid > .card{animation:cardIn var(--t-slow) var(--ease) both;
    animation-delay:calc(var(--i,0) * var(--stagger))}
  /* 提示条 */
  #busy .dot{animation:dotBreathe 1.4s var(--ease) infinite}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
  }
  /* ⚠️ `prefers-reduced-motion` 之外的动效**也**要求 `no-preference`：
     上面把 animation 关掉了，但 `animation-delay` 会让元素**停在 from 状态**
     （`both` 的 fill-mode）—— 对 `opacity:0` 的元素来说就是永久不可见。
     ⇒ 这条把延迟也一起清掉。 */
  @media (prefers-reduced-motion:reduce){
    *{animation-delay:0s !important;animation-duration:1ms !important}
  }

  /* ── 响应式（原先三栏固定 250/1fr/300 ⇒ 窄屏直接挤爆）──────────── */
  @media (max-width:1280px){
    main{grid-template-columns:280px minmax(0,1fr)}
    #godpanel{grid-template-columns:200px minmax(0,1fr)}
  }
  @media (max-width:900px){
    main{grid-template-columns:minmax(0,1fr);padding:12px}
    #colLeft{grid-column:auto}
    #godpanel{grid-template-columns:minmax(0,1fr);padding-bottom:8px}
    .lanes{grid-template-columns:1fr}
    /* 顶栏三区在窄屏**退成两行**：中区的资源条独占一行，不再挤成一条缝 */
    #topbar{grid-template-columns:1fr auto;gap:6px 12px;padding:8px 12px}
    #topbar .tb-c{grid-column:1 / -1;grid-row:2;justify-content:flex-start;
      border-left:0;border-right:0;padding:2px 0 0}
  }

  /* ── 第二轮优化（2026-09-20）──────────────────────────────────── */

  /* ② 事件卡 tag 分三组：原先 10 个 tag 平铺成一坨 */
  /* ⚠️ 2026-10-07：.tags 的 gap / align-items **已并回上面那一处定义**
     （这里原来又写了一遍、靠"后者覆盖前者"生效）—— 同一个选择器只留一处。 */
  .taggroup{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center}
  .taggroup + .taggroup{border-left:1px solid var(--line);padding-left:10px}
  .tglabel{font-size:11px;color:var(--muted);letter-spacing:.04em}

  /* ③ 忙碌态 —— **真模型下的必需品**，见脚本区 `setBusy` 上方那段说明：
        LLM 超时 120 秒 × 最多 2 次 ⇒ 单个动作最长阻塞 4 分钟；此前页面
        **零反馈**且按钮照旧可点 ⇒ 玩家必然当成卡死并重复点击，而 `Session`
        没有互斥 ⇒ 重复扣行动点 / 丢更新 / 白烧额度。
     ⚠️ 2026-10-05 暗色：底色从 `--accent`（亮金）改成**近黑** ＋ 金边 ——
        亮金底 ＋ 白字在暗色界面里是一块刺眼的白斑，而它要挂 4 分钟。
        改成"暗底金边"后它仍在最上层，但读起来是"系统的低语"而不是"警报"。 */
  #busy{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;
    display:none;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;
    background:var(--sunken);border:1px solid var(--gold-line);color:var(--accent-2);
    font-size:13px;white-space:nowrap;
    box-shadow:var(--sh-3);
    animation:fadeIn 220ms var(--ease) both}
  #busy.on{display:inline-flex}
  #busy .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);flex:0 0 auto;
    animation:dotBreathe 1.4s var(--ease) infinite}
  /* ⚠️ 2026-10-07（用户裁定）：忙碌期间**不再锁操作** —— 客户端已把动作排队
     （见 `api()` 的队列注释），点 ✔ 之后玩家立刻能去处理下一个事件；
     这颗小签只负责"后台在跑什么、排了几件"，不负责禁点。
     ⚠️ 重复点击同一颗按钮仍是安全的：同 path ＋ 同 body 的动作在排队判据里被去重。 */
  body.busy #banner{margin-top:58px}

  /* ═══════════════════════════════════════════════════════════════════
     标题屏 → 封面（2026-10-05 · 用户裁定"压深成夜色鎏金"后的第一层改造）
     ─────────────────────────────────────────────────────────────────
     病根：打开游戏看到的是**一张存档表格**。业界做法（Domer 的 Start Screens
     指南 / Island Class「Title screen 要有游戏名 · 一个主导按钮 · 少量次要信息」）
     是把它做成**封面** —— 玩家需要有一个"进入游戏"的瞬间，而那瞬间需要留白。

     做法（全部纯 CSS / 内联 SVG，零外部资源）：
       ① 满屏暗场 ＋ 中心一枚**极缓自转**的王徽（36s/圈）—— 静，但"活着"；
       ② 标题**字距从很宽收拢**（`titleSettle`）—— 经典的"落定"一笔；
       ③ 标题上叠一条**鎏金扫光**（`sheen`）—— 金属反光的错觉，纯渐变实现；
       ④ 存档槽**从下方浮现**（`fadeUp` ＋ 逐条 delay），与标题的入场错开；
       ⑤ 底下三句说明**降到最弱**（`--faint`）—— 那是给排错的人看的，
          不该和标题抢注意力（原来它跟标题一样醒目）。

     ⚠️ 结构纪律：靠 `body.mode-title` 藏起游戏那三块，**不动 `renderTop` 等
        函数的结构** —— `ui.test.ts·bodyOf` 直接读那些函数的源码做断言。
     ⚠️ 四张卡的 `data-act`（`newGame` / `loadGame` / `askDelete`）与种子
        输入框**一个不少** —— 这里只改**怎么摆**，不改**摆什么**。
     ═══════════════════════════════════════════════════════════════════ */
  #titlescreen{display:none}
  body.mode-title #titlescreen{
    display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 24px 44px;overflow:auto;
    /* 封面底：中心一圈暖光 ＋ 四周**向边缘压深** —— 让王徽那块"被照亮"。
       ⚠️ `--vignette` 是变量而不是写死 `rgba(0,0,0,.5)`：**亮色主题下四周压的是暖褐**，
          用纯黑会在白底上晕出一圈脏边（第一版没分主题时就是这个毛病）。 */
    background:
      radial-gradient(ellipse 60% 46% at 50% 40%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 46%, transparent 30%, var(--vignette) 100%),
      var(--bg);
  }
  body.mode-title #topbar,body.mode-title main,body.mode-title footer,body.mode-title #godpanel{display:none}
  .ts-wrap{max-width:960px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center}

  /* 王徽：自转 ＋ 极轻的呼吸（亮度），底下留一圈静态的地面阴影 */
  .ts-sigil{position:relative;text-align:center;line-height:0;
    animation:sigilSpin 36s linear infinite;opacity:.95}
  .ts-sigil svg{display:block;filter:drop-shadow(0 0 26px color-mix(in srgb,var(--accent) 22%,transparent))}

  /* 标题：衬线 ＋ 鎏金渐变 ＋ 落定动画。字距 `.24em` 是"读得出来但不散"的值。
     ⚠️ `color:transparent` ＋ `background-clip:text` 有个真实的降级风险：
     **不支持 `background-clip:text` 的浏览器上，这行字会完全透明、彻底看不见。**
     ⇒ 下面紧跟一条 `@supports` 兜底：不支持时改回实心金。 */
  .ts-title{
    position:relative;font-family:var(--font-display);font-size:clamp(34px,5.4vw,52px);
    font-weight:600;letter-spacing:.24em;text-align:center;margin:22px 0 0;
    color:var(--accent-2);
    /* 鎏金渐变 ＋ 下方那道"压暗"形成金属厚度 */
    background:linear-gradient(178deg,var(--sheen-1) 0%,var(--accent-2) 42%,var(--sheen-3) 72%,var(--sheen-4) 100%);
    -webkit-background-clip:text;background-clip:text;
    animation:titleSettle var(--t-slower) var(--ease) both;
    text-shadow:none;
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .ts-title{color:transparent}
  }
  /* 扫光：一条与文字同形的窄高光斜掠过（`sheen` 挪的是 background-position）
     ⚠️ 整段**只加**在支持 `background-clip:text` 的时候 —— 否则这个 `::after`
     会变成一块盖在标题上的**亮色矩形**（它自己也是 `background-clip:text`，
     那个属性不生效时就是一块实底）。⇒ 宁可不扫光，不要糊一块。 */
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .ts-title::after{
      content:attr(data-t);position:absolute;inset:0;
      background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
      background-size:220% 100%;background-repeat:no-repeat;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:sheen 4.5s var(--ease) 1.1s both;
    }
  }
  /* 副标题：金色细线 ＋ 小字（原来跟标题只差 3px，等于没有层级） */
  .ts-rule{width:190px;height:1px;margin:20px auto 14px;
    background:linear-gradient(90deg,transparent,var(--gold-line),transparent);
    animation:fadeUp var(--t-slow) var(--ease) .5s both}

  /* 存档槽：从下方浮现，逐条错开（每条 90ms，比标题慢半拍 —— 层次要分出来）*/
  .ts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:38px}
  .ts-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    display:flex;flex-direction:column;gap:8px;min-height:168px;text-align:left;
    box-shadow:var(--sh-2);
    transition:border-color var(--t) var(--ease),background var(--t) var(--ease),
               transform var(--t) var(--ease),box-shadow var(--t) var(--ease);
    animation:fadeUp var(--t-slow) var(--ease) both;
    animation-delay:calc(.75s + var(--i,0) * 90ms)}
  .ts-card:hover{border-color:var(--gold-line);background:var(--raise);
    transform:translateY(-3px);box-shadow:var(--sh-3)}
  /* 有档的槽：左边一条金边 —— 一眼分出"这里有东西" */
  .ts-card.filled{border-left:2px solid var(--accent-deep)}
  /* 已结束的槽：金底 ＋ "已结束"感 */
  .ts-card.over{border-color:var(--gold-line);background:var(--gold-soft)}
  /* 空槽：虚线 ＋ 弱化（它不该和有档的槽一样重）*/
  .ts-card.blank{border-style:dashed;background:transparent;box-shadow:none;align-items:center;
    justify-content:center;text-align:center;color:var(--muted)}
  .ts-card.blank:hover{background:var(--panel);border-color:var(--gold-line);transform:translateY(-2px)}
  /* ⚠️ 空槽卡里那颗按钮要跟"空着"待在一起。不覆盖 `margin-top:auto` 的话，
     它会被推到卡片**右下角**，跟上面那两行字离得老远（看着像掉了）。 */
  .ts-card.blank .ts-ops{margin-top:0;justify-content:center}
  /* 槽号：罗马数字用衬线 ＋ 宽字距（那是"编号"，不是内容）*/
  .ts-no{font-family:var(--font-display);font-size:12px;color:var(--faint);letter-spacing:.3em}
  /* 档名：这一屏里最重要的信息 —— 衬线 ＋ 亮金（原来是无衬线 15px 灰黑）*/
  .ts-name{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);
    letter-spacing:.03em}
  .ts-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px;align-items:center}
  .ts-meta b{color:var(--ink-soft);font-weight:600}
  .ts-ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
  /* 底部说明：压到 `--faint`（排错信息不该和标题抢注意力）*/
  .ts-foot{margin-top:30px;color:var(--faint);font-size:12px;text-align:center;line-height:2;
    animation:fadeUp var(--t-slow) var(--ease) 1.15s both}
  .ts-seed{margin-top:10px}
  .ts-seed span{margin-left:8px}
  .ts-seed input{background:var(--raise)}
  @media (max-width:820px){
    .ts-grid{grid-template-columns:1fr}
    body.mode-title #titlescreen{padding:24px 14px 34px}
    .ts-card{min-height:0}
  }
  /* 「保存并退出」是常规操作 ⇒ 确认框不该长着一张危险的脸（档 A / 删档才用红的） */
  #modal.plain{border-color:var(--gold-line);border-left-color:var(--accent)}
  #modal.plain h2{color:var(--accent)}
  /* 破坏性动作（「直接结算」）—— 平时安静，靠近才亮出红边，免得它被当成普通按钮 */
  button.q-danger{border-color:var(--warn-line);color:var(--danger);background:transparent}
  button.q-danger:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger)}


  /* ── 第三轮优化（2026-09-20 · 信息排布）───────────────────────────
     病灶用**探针量出来的**（`.workbuddy/_probe-layout.py`，不是眼看）：第 28 天中栏 **4450px** 高，
     其中「已了结（50）」1517 ＋「回望（49）」1510 ＝ **3027px（占 68%）**；右栏「播报」1924px／20 条
     （≈96px 一条）；左栏「人手（10）」584px。⇒ 玩家当天真正要操作的三块（放格子 ＋ 今天可做的 ＋
     我想做点什么 ＝ 1374px）被 3000px 的**历史**夹在中间，"今天"要往下翻很久才看得见。
     ⚠️ 三栏都是**本来就装得下、只是太长**，不是溢出（探针：横向溢出 0 处）。 */

  /* ① 折叠栏（已了结 / 回望 / 播报 / 人手 共用）—— 默认只给最近几条，其余点开 */
  .foldbar{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);display:flex;justify-content:center}
  .foldbar button{font-size:12.5px;padding:2px 12px;color:var(--muted);background:transparent}
  .foldbar button:hover:not(:disabled){color:var(--accent);background:var(--gold-soft)}

  /* ② 「回望」的病灶只有一处：叙述是 `flex:1;text-align:right` ⇒
       短句被推到最右、跟左边的日期之间空出一大段，读不出它属于哪一天。
       ⚠️ 试过改成**上下堆叠**，但那样每行从 30px 涨到 68px（2.2×，实测）—— 用高度换了一个
          本来不用换的东西。⇒ 保持一行，只把 `space-between` 换成"紧跟着日期左对齐"。 */
  .prow.recall{justify-content:flex-start;align-items:baseline;gap:8px}
  .prow.recall .daylbl{flex:0 0 auto;font-size:12px;color:var(--muted)}

  /* ⚠️ 试过给顶栏的「欲望命题」加 `max-width` ＋ 省略号（它最长 29 个字，`margin-left:auto`
     会把它推到最右，放不下就独占一行）—— **实测顶栏行数一行都没少**（1680 → 1 行 / 1280 → 2 行，
     改前改后完全一样），却把"这一局要记住的目标"截断了。⇒ **撤掉**：拿可读性换高度、又没换到。 */
  /* ── 第四轮（2026-09-20 · 向《苏丹的游戏》借**结构**）───────────────
     借的是三条结构，不是皮肤：① 能被操作的东西做成"卡"；② 操作区折叠在卡面之下、
     点开才展开；③ 时间做成常驻读数。
     ⚠️ 皮肤仍是本页原有的「纸与墨」（暖纸质 ＋ 棕金）—— 那是有意的产品决策
        （见 `memory/MEMORY.md·已裁定（2026-09-20 · 前端页面）`），不许按通用模板改掉。 */

  /* ① 事件卡：卡面 ＝ "这是什么"；展开区 ＝ "怎么去做" */
  .ev .evhead{cursor:pointer;user-select:none}
  .ev .evhead:hover .title{color:var(--accent)}
  .ev .caret{margin-left:auto;color:var(--muted);font-size:12px;flex:0 0 auto}
  .ev .pickline{font-size:12px;color:var(--accent);margin-top:3px}
  /* ═══════════════════════════════════════════════════════════════
     事件处理台 · 横向一屏（2026-10-06 清单第 5 条 · 用户裁定）
     左 2/3 = 卡槽（菱形）｜右 1/3 = 长方格（标题 ＋ 描述 ＋ ×/✔）
     ⚠️ **为什么不再"点开才展开"**（5.1）：用户原话「不需要再点开一次才能展开详情，
        **去掉这个折叠**」⇒ 卡槽与处理方式**一进来就全在**，一屏横向装完。
     ⚠️ **手牌区可拖**（第 4 条）靠"浮层只占上 2/3"解决，**不动 `#hand` 的 z-index**
        （抬高它会让浮层半透明处误点到底下的事件块）。
     ═══════════════════════════════════════════════════════════════ */
  /* ⚠️⚠️ 2026-10-07 用户第 5 条把这一屏定成「**上 3/4 卡槽 ＋ 下 1/4 按钮**」
     ＋「右 1/3 是一个**长方格**，下框固定 x/对勾」⇒ 两栏都要**吃满浮层高度**，
     否则那块"长方格"会随着文字多少忽长忽短（截图里它就缩成了一条）。
     ⇒ `align-items:stretch` ＋ 外层 flex 列（见下方 #overlay.top 那两条）。 */
  .evdesk{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:stretch}
  /* 左 2/3：上 3/4 菱形卡槽（弹性）＋ 下 1/4 两个处理方式按钮。⚠️ `min-width:0` 是
     grid 的必需项 —— 否则里面的长内容会把整列撑破，横向布局当场失效。 */
  .evdesk-l{min-width:0;display:flex;flex-direction:column;min-height:0}
  /* 右 1/3：那个长方格。⚠️ **描述可滑动**（5.4「事件描述可以滑动」）——
     正文那一行 `flex:1;overflow-y:auto`；下框 x/对勾 `margin-top:auto` 钉在框底。 */
  .evdesk-r{min-width:0;display:flex;flex-direction:column;min-height:0;
    border-left:1px dashed var(--line);padding-left:12px}
  /* 窄屏（平板 / 竖屏手机）：两栏会挤扁 ⇒ 退回上下，仍是**一屏装完**，不滚动 */
  @media (max-width:900px){
    .evdesk{grid-template-columns:1fr}
    .evdesk-r{max-height:none;border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:10px}
  }
  /* 右 1/3 那个标题区：标题 + 头顶的小钟（处理所需时间）+ 左侧的属性实时读数 */
  .evd-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .evd-title .nm{font-family:var(--font-display);font-size:16px;color:var(--ink)}
  /* ⚠️ 2026-10-07（用户）：事件正文放大之后，标题要**更明显** ——
     大一号的**楷体加粗**（楷体栈：Windows=KaiTi/楷体，macOS=Kaiti SC/STKaiti，兜底衬线）。
     只作用于事件台（`.evdesk`），欲望宣言那几块 `.evd-title` 不受影响。 */
  .evdesk .evd-title .nm{font-family:"KaiTi","楷体","STKaiti","Kaiti SC","Songti SC",serif;
    font-size:21px;font-weight:700;color:var(--ink)}
  .evd-title .cost{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
  /* 属性实时读数（5.4）：**一开始是 0，随放上去的人实时变**。
     ⚠️ 数字单独一个 `<b>`，用金 —— 它是"你还能不能办成这件事"的唯一读数。
     ⚠️⚠️ 2026-10-07 补核：它现在**长在 `.evd-title` 里、标题左侧**（用户原话
     「事件标题左侧显示处理事件所需要的属性」）⇒ 必须 `inline-flex` ＋ 去掉
     `margin-top`，否则它会把标题挤到下一行（那又变回了"属性在标题下方"）。 */
  .evd-attrs{display:inline-flex;gap:6px;flex-wrap:wrap;margin:0;align-self:center}
  .evd-attr{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);
    border:1px solid var(--line);border-radius:7px;padding:2px 7px}
  .evd-attr b{color:var(--accent);font-weight:600;font-size:13px}
  .evd-attr.zero b{color:var(--faint)}          /* 一个人都还没放 ⇒ 那 0 是真的 0 */
  .evd-attr.ok b{color:var(--ok)}                /* 有 ⇒ 亮绿（与 `gates` 同向） */
  /* 下框那两个键（×/✔）—— 固定在右 1/3 那格的**底部**，不随内容滚动走 */
  .evd-ops{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);
    background:var(--panel)}
  /* 事件正文：**能滑动查阅**（用户第 5 条「事件描述可以滑动」）—— 右栏那半里的
     弹性块，长了它自己滚，不把 x/对勾顶下去。 */
  .evdesk-r > .prose{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding-right:4px}
  /* ⚠️ 2026-10-07（用户第 4 条）：「事件具体描述的字体应当**更大更显眼**」——
     基础 `.prose` 是 13.5px 的次要文本灰；事件正文是玩家要读的**主内容**，
     给它一档自己的字号（15.5px ＋ 正墨色 ＋ 更松的行距），不再蹭次要文本的样式。 */
  .evdesk-r > .prose{font-size:15.5px;line-height:1.75;color:var(--ink)}
  /* 属性读数下那句「暗示」（用户第 4 条原话）—— 教的是规则：
     有趣的处理方式可能换属性、甚至免骰，也可能翻车。
     ⚠️ 样式与 `.eqhint` 同族：淡色斜体小字，**暗示**不是告示。 */
  .attrhint{font-size:11px;font-style:italic;color:var(--muted);letter-spacing:.02em;
    text-align:center;margin:6px 0 0}
  /* ⚠️ 2026-10-07（用户）：✔ 上方那行操作提醒 —— 放人 ＋ 选方式是提交的硬前置，
     写成常驻小字（与 `.attrhint` 同族），玩家不用猜✔为什么灰着。 */
  .opshint{font-size:11px;font-style:italic;color:var(--muted);letter-spacing:.02em;
    text-align:center;margin:8px 0 0}
  .evd-ops button{flex:1 1 0}
  .evd-ops button[disabled]{opacity:.42;cursor:not-allowed}

  /* ── 菱形复合槽（5.5）：4 个人物槽 ＋ **中间那个金币槽** ──
     ⚠️ 用 `transform:rotate(45deg)` 的**菱形轮廓**做外框，里面内容反向转回来。
     为什么不用 `clip-path`：那样连**边框**都画不出来（`clip-path` 裁的是盒子），
     而这里要的是"四个角是人物、中心是钱"那种**有设计感**的复合形状。 */
  /* ⚠️⚠️ 2026-10-07：菱形**旋转 45 度后有 1.414 倍的视觉外扩**（四个角上的槽还要
     再往外伸半个对角线）⇒ 真机实测它的实际占位是 212*1.414 + 96*1.414 ≈ 436px，
     而 `.diawrap` 只按 212 算高度 ⇒ 上半截被浮层顶边切掉、下半截压在那句提示上。
     ⇒ 两件事：① 菱形与槽**都缩一档**（180 / 80 ⇒ 视觉占位 ≈ 368px）；
                ② `.diawrap` 改成**弹性居中**（吃满左栏的上 3/4），不再靠 padding 撑。 */
  /* ⚠️⚠️ 2026-10-07：min-height 由 **368px 改成 0**。
     368 是按"180px 的菱形 ＋ 80px 的角槽"算的**下界**，可它同时把整个左栏
     钉在 368 ＋ 提示句 ＋ 两行按钮 = 481px 以上 ⇒ **矮屏必然溢出**
     （实测 1080x700：浮层底 461，而「亲自去且仔细处理」的底边在 529）。
     ⇒ 让它**只吃剩下的空间**（flex:1 1 auto），菱形靠下面那组
       scale() 档位等比缩。 */
  .diawrap{position:relative;flex:1 1 auto;min-height:0;display:grid;place-items:center}
  /* 菱形本体：2026-10-07 用户裁定「菱形**拉宽**一点，格子就放得下了」。
     ⚠️ 为什么**弃掉 rotate(45deg)**：旋转正方形出来的菱形两条对角线**只能等长**
        （旋转长方形则四个尖端不在轴上、整体是歪的）——"拉宽"在旋转方案里做不出来。
     ⇒ 改为**不旋转的容器 ＋ 一张 SVG 宽菱形描边**：
        横对角线 300 ／ 纵对角线 200（纵向比旧方案矮 54px，横向宽 46px），
        四个槽钉在四个尖端上、**天生就是正的**（不再需要 rotate(-45) 转回来），
        底尖的槽不再压到下面那句提示。 */
  .dia{position:relative;width:380px;height:280px}
  .dia > svg.diaborder{position:absolute;inset:0;width:100%;height:100%;
    display:block;pointer-events:none}   /* 描边只是画，别挡拖拽命中 */
  .diaborder polygon{fill:color-mix(in srgb,var(--raise) 55%,transparent);
    stroke:var(--hint-line-2);stroke-width:1.2;stroke-linejoin:round}
  /* 四个尖端：每个尖端一个槽。⚠️ 逆时针 ①上 ②左 ③下 ④右（用户裁定）。
     编号用 `data-si` 写进 DOM ⇒ 渲染侧与判据侧读**同一个数**。
     ⚠️ 坐标按 380×280 容器写死：菱形尖端在 (190,40)(40,140)(190,240)(340,140)，
        槽（80×80）的中心对准尖端 ⇒ left/top = 尖端 − 40。 */
  .dia > .pslot{position:absolute;width:80px;height:80px}
  .dia > .pslot[data-si="0"]{top:0;left:150px}     /* ① 上（尖端 190,40） */
  .dia > .pslot[data-si="1"]{top:100px;left:0}     /* ② 左（尖端 40,140） */
  .dia > .pslot[data-si="2"]{top:200px;left:150px} /* ③ 下（尖端 190,240） */
  .dia > .pslot[data-si="3"]{top:100px;left:300px} /* ④ 右（尖端 340,140） */
  /* 中心：金币槽（四个尖端围出来的那个"眼"＝容器正中 (190,140)） */
  .dia .gold{position:absolute;top:calc(50% - 38px);left:calc(50% - 38px);
    width:76px;height:76px;z-index:2}
  /* 角上的序号（① ② ③ ④）—— 极淡，只是"顺序感"的一个锚，不抢卡面 */
  .dia .pslot .ord{position:absolute;left:6px;top:4px;font-size:10px;color:var(--faint);
    opacity:.7;line-height:1}
  /* ⚠️ 必放那位：红卡槽 ＋ **中间写他的名字**（5.5「在一个红卡槽中间写上红色的人物名字」） */
  .dia .pslot.must{border:2px solid var(--danger);background:var(--danger-soft)}
  .dia .pslot.must .ord{color:var(--danger);opacity:1}
  .dia .gold.req{border:2px solid var(--danger)}
  .dia .gold .reqnum{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;font-size:15px;color:var(--danger);font-weight:600}
  /* ═══════════════════════════════════════════════════════════════
     「你的欲望」面板（2026-10-06 清单第 4B 条 · 用户裁定第 22 条）
     ⚠️ **与常规事件同构**（同 `.evdesk` 那套骨架）—— 不另做一套，
        免得"两处骨架"必然漂（阶段二刚把事件台做完，直接复用它的 class）。
     ═══════════════════════════════════════════════════════════════ */
  /* 四行卡槽（成果 3 / 手段 3 / 共鸣 3 / 如一的初衷 1）——
     ⚠️ **不是菱形**：四行是"四个并列的清单行"，菱形那套是"围着中心排四个人"，
        形状语义不同（这里每行内部是**并排的三个位置**）。 */
  .vrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .vrow .vlbl{flex:0 0 92px;font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
  .vrow .vlbl b{display:block;color:var(--ink);font-size:13px;font-weight:600}
  /* 那一行的小字引导（2026-10-07 用户原话：「直接在对应的框旁边用小字告诉玩家」）
     ⚠️ 样式**照抄第 23 条那句地图提示**（淡黄 · 斜体 · 小号）⇒ 两处是同一套"提示性小字"，
        玩家的眼睛只需要学一次"这种字体＝这是提示，不是内容"。 */
  .vrow .vlbl .vhint{display:block;margin-top:3px;font-size:11.5px;font-style:italic;
    color:var(--gold);opacity:.58;letter-spacing:.02em;line-height:1.35}
  .vslots{display:flex;gap:7px;flex-wrap:wrap}
  /* 单个卡位：92×128 竖卡（与事件台那批同尺寸 ⇒ 眼睛不用换焦距） */
  .vslot{width:92px;height:128px;border:1px dashed var(--hint-line-2);border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    position:relative;background:var(--sunken);transition:border-color .14s var(--ease)}
  .vslot.filled{border-style:solid;border-color:var(--gold-line);background:var(--raise)}
  .vslot .vtitle{font-size:12px;color:var(--ink);text-align:center;line-height:1.3;
    padding:0 5px;max-height:2.6em;overflow:hidden}
  .vslot .vdesc{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.25;
    padding:0 5px;max-height:2.5em;overflow:hidden}
  .vslot .px{position:absolute;right:4px;top:3px;font-size:12px;color:var(--muted);cursor:pointer}
  .vslot .ord{position:absolute;left:5px;top:3px;font-size:10px;color:var(--faint);opacity:.75}
  .vslot .pdash{font-size:17px;color:var(--faint)}
  /* 第四行「如一的初衷」：**没有凭证**，只有一个实时欲念值读数 */
  .vslot.init{width:auto;min-width:150px;height:auto;min-height:52px;padding:7px 14px;
    border-style:solid;border-color:var(--gold-line);flex-direction:row;gap:9px;background:transparent}
  .vslot.init .vtitle{font-size:12.5px;max-height:none;padding:0}
  .vslot.init .vnum{font-family:var(--font-display);font-size:22px;color:var(--accent);line-height:1}
  /* 凭证卡牌（手牌区里那一张）——
     ⚠️ **只在「你的欲望」浮层打开时可拖**：`.voucher` 卡默认 `data-kind` 不给，
        由 `maybeEnableVoucherDrag()` 在浮层打开那一刻补上。 */
  /* ⚠️ 卡面**只有类型 ＋ 标题两行**（2026-10-07 用户裁定第 22 条：描述点开才看）
     ⇒ 高度与同批的人物卡一致，横向扫起来不跳。 */
  .voucher{width:104px;min-height:104px;border:1px solid var(--line);border-radius:10px;
    padding:8px 9px;display:flex;flex-direction:column;gap:5px;background:var(--raise);
    justify-content:flex-start}
  .voucher .vh{font-size:10px;color:var(--faint);letter-spacing:.04em;line-height:1.2}
  .voucher .vt{font-size:13px;color:var(--ink);line-height:1.35;flex:1;overflow:hidden;
    word-break:break-word}
  /* 基本性质一行（2026-10-07 用户裁定：像人卡显示 identity 那样，报"这是哪类凭证"） */
  .voucher .vi{font-size:10.5px;color:var(--muted);line-height:1.2}
  /* 已在槽里的凭证 ⇒ 半透明，**并且拖不动**（不许同一张在两处同时算） */
  .voucher.placed{opacity:.42}
  /* ⚠️ 2026-10-07（用户裁定）：场景交互 = 常规对话窗 —— 左气泡＝LLM、右气泡＝玩家，
     整体可滚动（`.chatbox` 定高滚动，`renderOverlay` 里每次滚到最底）。
     ⚠️ 2026-10-07（用户复裁）：**字号大一些** —— 13.5px 读起来太吃力 ⇒ 15px，
        输入框（#sayText）与气泡同档。 */
  .chatbox{display:flex;flex-direction:column;gap:10px;max-height:min(430px,52vh);
    overflow-y:auto;padding:6px 4px;margin-top:10px}
  .bub{max-width:78%;padding:9px 13px;border-radius:12px;font-size:15px;
    line-height:1.75;white-space:pre-wrap;word-break:break-word}
  /* ⚠️ 2026-10-07（用户裁定）：LLM 气泡改**淡黄**（比消息区背景深一些）——
     与玩家的 `--scene-soft` 区分之外，还要一眼认出"这是它在说话"。
     用 `--gold` 往 `--panel` 里混：主题变量换皮时它跟着走，不写死色值。
     ⚠️ 2026-10-07（用户复裁）：**蓝框去掉**（`--scene-line` 蓝灰压在淡黄上配色太怪）
     —— 淡黄底自身已经足够把气泡从消息区托出来，不再描边。 */
  .bub.llm{align-self:flex-start;background:color-mix(in srgb, var(--gold) 16%, var(--panel));
    border-bottom-left-radius:4px}
  .bub.me{align-self:flex-end;background:var(--scene-soft);
    border:1px solid var(--scene-line);border-bottom-right-radius:4px}
  #sayText{font-size:15px;line-height:1.6}
  .voucher[data-kind]{cursor:grab;border-color:var(--gold-line)}
  /* 「你的欲望」浮层那一行的标题（外面的 deadline）*/
  .vdesk-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .vdesk-top .dl{font-size:12px;color:var(--muted)}
  .vdesk-top .dl b{color:var(--danger);font-size:14px}
  /* 进度条：第 28 天之前一律禁用「确定」 */
  .vdesk-top .daybar{flex:1 1 160px;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;
    border:1px solid var(--line)}
  .vdesk-top .daybar i{display:block;height:100%;background:var(--accent);opacity:.75}

  /* ⚠️ 队列徽标（.cvqueue）已撤（清单第 4 条）—— 状态改由每个事件块头上的
     `.cvstat` 状态行自己说（见 .cvchip 那一组），角落不再集中报数。 */

  /* 物品位：菱形右下角外侧（它**至多 1 件**，不进菱形） */
  .dia-item{margin:8px auto 0;max-width:212px}
  /* ⚠️⚠️ 2026-10-07 第 5 条：物品位从事件台撤了 ⇒ 换成**用户点名的那句提示**。
     样式同别处的"提示性小字"（淡黄 · 斜体 · 小号）—— 玩家的眼睛只需要学一次
     "这种字体＝这是提示，不是内容"。 */
  .eqhint{margin:0 auto 8px;max-width:300px;text-align:center;
    font-size:11.5px;font-style:italic;letter-spacing:.02em;line-height:1.5;
    color:color-mix(in srgb,var(--gold) 58%,transparent)}
  /* 「你的叮嘱与期望」＋ 输入框：贴在「简略处理」右边（用户第 5 条：
     "简略处理按钮在偏上侧，旁边是『你的叮嘱与期望』+一个可打字的文本框（可空）"） */
  .ops.modes .notefield{flex:1 1 auto;display:inline-flex;align-items:center;gap:6px;
    min-width:0;font-size:12px;color:var(--muted);white-space:nowrap}
  .ops.modes .notefield input{flex:1 1 auto;min-width:90px}

  /* 下 1/4：两个处理方式按钮（**互斥单选**）。⚠️ `.on` = 当前选中的那个。 */
  .ops.modes{gap:10px;margin-top:10px}
  .ops.modes button{flex:1 1 0;min-height:34px}
  /* ⚠️⚠️ 2026-10-07（用户复验第 5 条）：「**亲自处理的按键也显示不出来**」。
     实测（1080x700）那颗按钮的 computed：
       opacity:0.4 ／ background:rgb(39,32,25) ／ border:rgb(58,50,41)
     —— 三个都是**深底上的深色** ⇒ 屏幕上只剩一行灰字，玩家认不出"这里有一颗按钮"。
     ⇒ 未满足条件时用**颜色弱化**（透明度＋灰字），**边框保持实线** ——
       2026-10-07 用户裁定：「边框也是和『简略处理』一样的实线」
       （虚线是另一套形状语言，读起来像两种按钮，不要）。 */
  .ops.modes button[disabled]{opacity:.55;
    color:var(--muted);background:transparent}
  /* ⚠️⚠️ 2026-10-07（用户复验第 5 条 · 第 5.6 条）：「**两个按钮必须点且只能点一个**」——
     选中态此前**读反了**：`简略处理` 无条件带 `button.primary`（实心金），
     而 `.on` 只是 14% 的暗金底 ⇒ 实测（1080x700）刚打开、`handling` 还是空的时候，
     「简略处理」就已经是**最抢眼的实心金**、「亲自去」反是虚线灰框
     —— 玩家看到的是"简略处理已经选中了"，可紧接着 `✔` 又是灰的（`howOk` 为假），
     两块自相矛盾；而真正选中「亲自去」时，**未选中**的那颗反倒更亮。
     ⇒ 修法：**"实心金"这一格只留给"我选的"**。
        ①`简略处理` 不再无条件 `primary`（未选中 ⇒ 就是一颗普通按钮）；
        ②`.on` 直接用实心金 ＋ `--on-accent` 字色（与 `✔` 同一套"可点的实心"语言）。 */
  .ops.modes button.on:not([disabled]){background:var(--accent);border-color:var(--accent);
    color:var(--on-accent);font-weight:600}
  /* ⚠️ 清单第 1 条（持久化）：回看态那行**只读摘要**（处理方式 ＋ 叮嘱）——
     代替那两颗按钮与输入框，读起来是"当时的决定"，不是一套还能点的控件。 */
  .rohow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;
    margin-top:10px;padding:8px 12px;border:1px dashed var(--line);
    border-radius:9px;font-size:12.5px;color:var(--muted)}
  .rohow b{color:var(--ink);font-weight:600}
  .rohow .ronote{flex:1 1 100%;font-size:12px;color:var(--ink-soft);line-height:1.55}
  /* 必放那位还没放进来时，槽中间**写他的名字**（5.5） */
  .dia .pslot .reqname{font-size:11px;color:var(--danger);font-weight:600;text-align:center;
    padding:0 4px;line-height:1.25}
  /* ⚠️⚠️ 2026-10-07（用户裁定）：LLM 指定「非他不可」⇒ 红槽**旁边**明确写一句
     「xx必须要去」—— 槽里的名字只回答"这个位放谁"，旁边这句回答"为什么必须放他"。
     ⚠️ `isReq` 只在 k===0（①号槽＝上尖端）出现 ⇒ 挂槽**右侧**是安全的
     （右侧是菱形内部的空地，压不到中心钱槽与 ④ 号槽）。 */
  .dia .pslot .reqtag{position:absolute;left:calc(100% + 12px);top:26px;white-space:nowrap;
    font-size:11.5px;font-weight:600;color:var(--danger);
    background:color-mix(in srgb,var(--danger) 7%,var(--raise));
    border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);
    border-radius:7px;padding:3px 9px;line-height:1.3;pointer-events:none;z-index:3}
  /* 钱槽：它在菱形**中心**（5.5「槽中间是金币槽」） */
  /* ⚠️⚠️ 2026-10-07（用户实测"× 看起来是个 ＋"）：这里**不许再转 -45 度** ——
     菱形早已改成 SVG 描边方案（容器天生是正的，见 .dia 那条注释），这个 rotate
     是旧旋转方案的遗物：没人先转 +45，它就把整个钱槽连同槽里的"×"一起转成了
     菱形 —— "×" 转 45° 看起来正是一个"＋"。转正之后 × 与数字天生是正的。 */
  .dia > .goldreq{position:absolute;top:calc(50% - 40px);left:calc(50% - 40px);
    width:80px;height:80px;z-index:2}
  .dia > .goldreq .pslot{position:relative;width:80px;height:80px;flex:0 0 auto;transform:none}
  .dia > .goldreq.req .pslot{border:2px solid var(--danger)}
  /* ⚠️⚠️ 2026-10-07：**那个数字输入框整块删掉**（用户原话：「金币的数值是**显示在卡槽中央**，
     而不是**冒出来一个批注**」）⇒ 钱只有一条进法：把金币卡拖进这一格
     （`goldDropAmount`），中央那个大数字就是"已经垫了多少"／"最少要垫多少"。 */
  .dia > .goldreq .hg.small{font-size:24px}
  /* 菱形那半在窄屏上要能缩：整株等比缩到 .78（容器 380×280 ⇒ 约 296×218） */
  @media (max-width:560px){
    .dia{transform:scale(.78)}
  }
  /* ⚠️⚠️ 2026-10-07（用户复验第 5 条）：**菱形按屏高等比缩放**。
     用户原话：「**亲自处理的按键也显示不出来**」。实测（1080x700）：
       浮层底 = 461px，「简略处理」底边 485、「亲自去且仔细处理」底边 529
       ⇒ **两颗都在浮层外**，被 #overlay.top #modal 的 overflow:hidden 裁掉。
     病灶是死的：#overlay.top 只给 67vh，而 180px 的菱形（＋4 个 80px 的角槽）
     纵向要 335px，加上提示句与两行按钮 = 448px。
     ⇒ 把**整株菱形**（4 槽 ＋ 中心钱槽）用 scale() 等比缩下去：字号、圆角、
       边框**一起缩**（改宽高的话只有盒子缩、字还那么大，比例就散了）。
     ⚠️ 为什么用 media query 而不是 calc((100vh - 240px)/480px)：
       后者若浏览器不认，自定义属性就是无效值 ⇒ scale(…) 会把**整条 transform
       判废** ⇒ 菱形连 45 度都不转了（改法必须"坏也坏得看得见"）。
     ⚠️ 档位按 desk 高 = 0.67vh - 50、菱形纵向 = 335 x s、另需 113px
       （提示句 ＋ 两行按钮）反推 —— 验证脚本 probe/verify-desk-fit.mjs。 */
  @media (max-height:740px){ .dia{transform:scale(.93)} }
  @media (max-height:700px){ .dia{transform:scale(.86)} }
  @media (max-height:660px){ .dia{transform:scale(.78)} }
  @media (max-height:620px){ .dia{transform:scale(.70)} }
  @media (max-height:560px){ .dia{transform:scale(.60)} }
  /* reduced-motion：结局层之外，这一块的动画也该能被关掉 */
  @media (prefers-reduced-motion:reduce){
    .ops.modes button,.dia .pslot{transition:none!important}
  }

  .evbox{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .evbox .slotrow{display:flex;flex-wrap:wrap;gap:7px}
  /* 卡槽：虚线 ＝ 可空；红边 ＝ **必填**（借用《苏丹》那套"红色指这个位置一定要放东西"） */
  .slotbox{border:1px dashed var(--hint-line-2);border-radius:8px;padding:7px 10px;min-width:122px;
    flex:1 1 auto;background:var(--raise);transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
  /* ⚠️ 2026-09-20 用户裁定「**可以改的更明显**」⇒ 由红虚线改成**红实线 ＋ 深红**：
     与可空的 `.slotbox` 在**两个维度**上同时分得开 —— 线型（实 / 虚）＋ 颜色（深红 / 素色）。
     ⚠️ 2026-10-05 暗色：`rgba(166,58,46,.16)` 那个内发光是**按暖白底**调的
     （半透明红叠在白底上 = 淡粉），暗底上叠出来几乎看不见 ⇒ 改成不透明度更高的红。 */
  .slotbox.must{border-style:solid;border-color:var(--danger);background:var(--danger-soft);
                box-shadow:inset 0 0 22px color-mix(in srgb,var(--danger) 12%,transparent)}
  .slotbox .sh{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .slotbox.must .sh{color:var(--danger);font-weight:600;letter-spacing:.06em}
  .slotbox .sv{font-size:12.5px;color:var(--ink-soft);margin:2px 0 3px}
  .slotbox .pick{display:flex;flex-wrap:wrap;gap:3px 10px}
  .slotbox .pick label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;font-size:12.5px}
  .slotbox select,.slotbox input[type=text]{font-size:12.5px;padding:1px 4px;max-width:156px}
  .slotbox input[type=number]{width:56px;font-size:12.5px}
  /* ①′ 派遣窗口的「调不动」那组（2026-10-05）—— **不给复选框**，只报一句为什么。
     措辞与左栏人手卡的「尚未入队」统一（同一个事实只许有一个名字，见 `personCard`）。 */
  .slotbox .blocked{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  /* ①″「非他不可」那行 —— 他调不动时转成死局提示（红），否则只是一句提醒（灰）。 */
  .slotbox .reqline{font-size:11.5px;color:var(--muted);margin:1px 0 3px}
  .slotbox .reqline.dead{color:var(--danger)}

  /* ①′ 三格作为**拖拽落点**（C 轮）—— 高亮只回答一件事："松手会怎样"。
     绿不绿不看"东西好不好"，只看**这一格收不收这一类**（`canDropOn`）。 */
  .slotbox.dropok{border-color:var(--accent-2);background:var(--gold-soft);
                  box-shadow:inset 0 0 0 1px var(--gold-line)}
  .slotbox.dropok .sh{color:var(--accent)}
  .slotbox.dropno{border-color:var(--danger);background:var(--warn-soft)}
  .slotbox.dropno .sh{color:var(--danger)}

  /* ①″ 拖拽本身：源卡可抓、跟随的那张卡不吃指针事件（否则 `elementFromPoint` 只会命中它自己） */
  .pcard[data-kind],.icard[data-kind],.hcard[data-kind]{cursor:grab}
  /* ⚠️ 卡上的文字**不许被选中**（2026-09-23 用户：「会和电脑的文字抓取功能冲突，部分卡牌上的文字变蓝」）。
     这三类卡本来就没有"复制文本"这个用途 —— 点一下是开详情、按下去是起拖 ⇒ 关掉选中没有代价。
     它同时**顺手堵掉原生 HTML5 拖拽**：浏览器只在"可选中的文本 / 图片 / 链接"上起 drag，
     于是不会再冒出第二套（浏览器的）拖拽特效与光标。
     ⚠️ `.hcard` 是 2026-10-05 布局重构新增的那一类（底部手牌），同样要禁选。 */
  .pcard,.icard,.hcard{user-select:none;-webkit-user-select:none}
  /* ═══════════════════════════════════════════════════════════════════
     欲望宣言那一步（2026-10-06 用户裁定 · 问题 5/6/7）
     ─────────────────────────────────────────────────────────────────
     四宣言**平铺并排**（`grid` 固定列宽，不摊开）—— 用户原话「宣言这么显示：
     4个框里的文字主体分别是…」⇒ 要看得出是**四选一**的一组，不是一列说明。
     ⚠️ 窄屏降成两列（`@media`）：四个并排在 640px 的弹窗里会挤到读不了字。
     ═══════════════════════════════════════════════════════════════════ */
  .kitstage{margin-top:12px}
  .ktitle{font-weight:650;margin-bottom:8px}
  .kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kitcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    width:100%;text-align:left;padding:12px 13px;border-radius:11px;
    border:1px solid var(--line);background:var(--raise);
    transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
  .kitcard:hover{border-color:var(--gold-line)}
  .kitcard.on{border-color:var(--gold);background:var(--gold-soft)}
  /* 大字主体 ＝ 手段＋目的（玩家真正要承诺的那两样）*/
  .kitcard .kc-body{font-family:var(--font-display);font-size:14.5px;line-height:1.6;
    color:var(--ink)}
  .kitcard.on .kc-body{color:var(--gold)}
  /* 小字修饰 ＝ 宣言原话（只上卡面与终局、不进判定那一句）*/
  .kitcard .kc-tag{font-size:11.5px;line-height:1.5;color:var(--muted);
    padding-top:6px;border-top:1px dashed var(--line-soft);width:100%}
  @media (max-width:640px){.kgrid{grid-template-columns:minmax(0,1fr)}}

  /* 第二步顶部那条**已选宣言的提醒**（用户裁定：宣言要保留到这一屏作为提醒）*/
  .pickedline{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;
    padding:9px 11px;border-radius:9px;
    background:color-mix(in srgb,var(--gold) 7%,transparent);
    border:1px solid var(--gold-line)}
  .pickedline .pl-t{font-size:10.5px;letter-spacing:.14em;color:var(--gold);opacity:.85}
  .pickedline .pl-b{font-size:13.5px;line-height:1.55;color:var(--ink)}
  .pickedline .pl-tag{font-size:11px;color:var(--muted)}

  /* ⚠️⚠️ 2026-10-06 用户裁定（问题 13）：「**拖动地图时会把图层外的文字也选中**」
     —— 拖画布是 `pointerdown + pointermove`，浏览器把它当成**拖选文本**，
     于是松手时整页文字被蓝底选满，极影响观感。
     ⚠️ **三条一起上**才干净：
       ① 交互层（`body`）默认**禁选**—— 拖拽、点按都不该选字；
       ② 真要**可复制**的地方（正文散文）**显式放开** —— 玩家想复制那段话时照样能选；
       ③ `::selection` 保留（放开区域内选中仍有样式，不至于看不出选到哪）。
     ⚠️ **不整页一刀切禁选**：那是把"能复制文字"这个基本能力也砍了。 */
  body{-webkit-user-select:none;user-select:none}
  .prose,.sub,.hq-p,.hq-m,.body,.content,input,textarea,.copyable{
    -webkit-user-select:text;user-select:text}
  body.dragging{cursor:grabbing}
  body.dragging .pcard[data-kind],body.dragging .icard[data-kind],
  body.dragging .hcard[data-kind]{cursor:grabbing}
  /* ①‴ 跟随指针的那张**卡** —— 直接把源卡**克隆**过来当幽灵（见 JS `makeGhost`）。
     ⚠️ 类名叫 `dragghost` 而**不是** `ghost`：`.ghost` 这个类名早被页脚/标题屏那排
        "幽灵按钮"占着了（`button.ghost`）⇒ 借它的名字早晚要串味。
     ⚠️ `width` 必须给：克隆体从网格里搬到了 `<body>` 下，没有网格替它定宽。
     ⚠️ `.hcard` 的原宽是 112px（`.hcard.item` 96px）—— 克隆体要照抄，
        否则从卡带里拖出来会"缩水"（`.dragghost` 没有 `:root` 里的网格约束）。 */
  /* ⚠️ 清单第 1 条：拖拽中源卡从手牌区隐没（卡只有一份 —— 要么在手上，要么在指针上）。
     `visibility`（不用 display）＝ 布局不跳，松手/落空时由 dragEnd 摘掉、原样回来。 */
  .hcard.dragsrc,.pcard.dragsrc,.icard.dragsrc{visibility:hidden}
  .dragghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;
    box-shadow:var(--sh-float);transform:rotate(-1.2deg)}
  .dragghost.pcard,.dragghost.icard{width:196px;max-width:196px;margin:0}
  .dragghost.hcard{width:112px;margin:0;animation:none}
  .dragghost.hcard.item{width:104px}

  /* ② 人手 / 身外之物：小卡（它那套罗马数字分区是为几百张卡准备的，我们用不上） */
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pgrid .foldbar{grid-column:1 / -1}
  /* ②′ 人手分两组：**已入队 / 尚未入队**（2026-09-20）。
     组标题要小到不抢戏，但能一眼分界 —— 用一条虚线 ＋ 极小字，与卡里那 3 颗 tag 不同层。 */
  .grphead{font-size:11.5px;color:var(--muted);letter-spacing:.06em;
    margin:9px 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
  .grphead:first-child{margin-top:0}
  .pcard{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--panel);min-width:0}
  .pcard.off{opacity:.5}
  .pcard .pc1{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .pcard .nm{font-weight:650;font-size:13px}
  .pcard .pc2{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-word}
  .icard{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;border:1px solid var(--line);
    border-radius:8px;padding:4px 7px;background:var(--panel);margin-bottom:5px}
  .icard .nm{font-weight:650;font-size:12.5px}
  .icard .sub{font-size:11.5px;color:var(--muted)}

  /* ③ 时间：常驻读数（今天还剩几点，一眼看得出 —— 时间是本作的核心压力） */
  .apdots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
  .apdots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--accent-2);display:block}
  .apdots i.on{background:var(--accent-2)}

  /* ④ 页脚：「进下一天」是**当天唯一那个大按钮**（其余都是随手的次要动作） */
  /* ── 页脚三档权重（2026-10-05）────────────────────────────────────
     原来「进下一天」只是 `font-size:15px`，与旁边几颗普通按钮差别很小
     ⇒ 它作为"当天唯一的推进阀"的分量立不住。
     现在：它是**唯一**发鎏光的按钮（暗底上光晕比尺寸更能读出"主"），
     拨钟次之，出口那组最弱。 */
  footer button.big{font-family:var(--font-display);font-size:17px;padding:9px 30px;font-weight:600;
    letter-spacing:.08em;border-radius:8px;
    box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),
               0 6px 20px color-mix(in srgb,var(--accent) 18%,transparent)}
  footer button.big:hover:not(:disabled){box-shadow:0 0 0 1px var(--accent-2),
               0 8px 26px color-mix(in srgb,var(--accent) 30%,transparent)}
  /* 「我想做点什么」＝ 玩家的主动性出口，值得比"拨钟"醒目一档（它不是一个机械操作）*/
  footer button.q-ask{border-color:var(--gold-line);color:var(--accent-2);background:var(--gold-soft);
    font-weight:500}
  footer button.q-ask:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--raise))}
  /* 拨钟是**重复性**操作 ⇒ 不该长得像决定；压成小一号的次要键 */
  footer button[data-act="dial"]{font-size:13px;padding:4px 12px;color:var(--ink-soft)}
  /* 「N 件事在外面办着……」——机制提示（2026-10-07 用户裁定：
     用简短文字告诉玩家"拨时针才看得到结算"）。只在有处理中事件时出现。
     ⚠️ 同日再裁定：**字号加大 ＋ 呼吸动效**（用户原话「这行字需要更大明显一点，
     同时给它加上一个动效」）—— 11px 的灰字没人读；14px ＋ 缓慢呼吸才像"在等你"。 */
  footer .fhint{font-size:14px;color:var(--ink);letter-spacing:.02em;
    animation:fhintPulse 2.4s ease-in-out infinite}
  @keyframes fhintPulse{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){footer .fhint{animation:none;opacity:.85}}
  /* 「招募人手 → 多线并行」那条出路提示（2026-10-07 用户裁定）——
     钉在地图区**底部居中**（窗坐标，不随台面平移/缩放；`.canvas` 本就 position:relative）；
     斜体小字，别抢事件的戏。 */
  .cvrecruit{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    font-size:12.5px;font-style:italic;color:var(--muted);white-space:nowrap;
    pointer-events:none;opacity:.85}
  /* 昼夜切换（2026-10-05）：它是**偏好**不是**决策** ⇒ 放在出口组里、最不显眼的位置。
     图标是纯 CSS 画的：日＝一个实心圆；夜＝一个圆 ＋ 右侧被底色挖掉一块（月相）。 */
  footer button[data-act="theme"]{display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;padding:4px 11px;color:var(--muted)}
  .tsw{width:13px;height:13px;border-radius:50%;flex:0 0 auto;position:relative;
    background:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
  /* 夜间档的图标：把圆的一角用底色盖掉 ⇒ 读作"月牙" */
  .tsw.dark::after{content:'';position:absolute;inset:-2px -2px -2px 3px;border-radius:50%;
    background:var(--panel)}
  /* 昼间档的图标：外圈加几根"光芒"短线的暗示（用 box-shadow 的多值描边画） */
  .tsw.light{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent),
                         0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}


  /* ── B 轮（2026-09-20 · 「总览 → 点开细化」）──────────────────────────
     用户口径：「主体部分**没有多少文字**，事件 / 人物 / 物品的具体内容都要**一个个点开**
     才看得到 —— 一开始是总览，然后点开是细化，**而不是一次性把所有信息都堆到 UI 上**。」
     ⚠️ 全是呈现：没有新增任何字段（`v.people` 本来就带 basic / identity / attrs / items /
        recognized）· 没有新读数 · 没有改一句话的内容。 */

  /* ① 能点开的东西：整张卡可点 ＋ 一条「点开看…」提示 */
  .tap{cursor:pointer;transition:border-color var(--t),background var(--t)}
  .tap:hover{border-color:var(--accent-2);background:var(--gold-soft)}
  .peek{display:inline-flex;align-items:center;font-size:11.5px;color:var(--muted);
        border:1px dashed var(--line);border-radius:999px;padding:1px 8px}
  .tap:hover .peek{border-color:var(--accent-2);color:var(--accent)}
  .peek.row{margin-top:6px}

  /* ② 「这一局」入口卡 —— 它就是《苏丹》左上角那颗核心机制入口的位置 */
  .questcard{border-color:var(--hint-line);background:var(--gold-soft)}
  .questcard .lead{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
  .questcard .tarot{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .plmin{display:flex;flex-wrap:wrap;gap:5px}

  /* ③ 详情浮层：`#modal` 里那张大卡（阅览层 ⇒ 边框比档 A 弹窗柔） */
  #modal.sheetmode{border-width:1px;border-color:var(--hint-line);max-width:720px}
  #modal.sheetmode h2{color:var(--accent)}
  /* ⚠️⚠️ 2026-10-07 用户第 3 条：「尚未入队」那块弹窗是**左右两栏**（左竖列 ＋ 右详情），
     720px 会把右栏挤扁 ⇒ 单独放宽。⚠️ 只放宽这一类，不影响其余 `.sheetmode` 屏。 */
  #modal.sheetmode.outmodal{max-width:920px;width:min(920px,94vw)}
  /* 「尚未入队」弹窗：左窄右宽。⚠️ 左列**自己滚**（人可能很多），右栏跟着页面滚。 */
