<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王国三王子</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════
     【目录】—— 这一整块 CSS 约 2200 行。**按下面的分区跳，不要通读。**
     ⚠️ 本文件是**单文件**（ui/index.html 里既有骨架、又有 CSS、又有 JS）。
        这是刻意的：零构建、node 直接起服务，且**探针 / 截图基线都读它**。
        ⇒ 不要把它拆成 .css / .js —— 那会同时打破 1600 行源码断言与"玩家面同源"那条纪律。
     ⚠️ 找东西的姿势：grep -n "关键字" ui/index.html ，不要滚。

       1.  皮肤：昼夜双主题       —— :root（夜）/[data-theme=light]（昼）/ 两个 @media 镜像
       2.  基础元素               —— html,body / button / input / 滚动条
       3.  三段式布局             —— #colLeft / #colMid
       4.  事件块 ＋ 状态标记       —— .cvchip / .cvmeta / .cvstat / .cvw
       5.  地图台面               —— .canvas / .canvas-pan / .mapcorner
       6.  底部手牌区（牌桌）     —— #hand / .hcard（人卡 / 物卡 / 金币卡）/ .hand-fold
       7.  事件处理台（浮层 · 横向一屏）—— .evdesk / .evdesk-l / .evdesk-r / .dia / .pslot
       8.  「你的欲望」面板       —— .kitcard / .pickedline（复用事件台骨架）
       9.  标题屏 / 封面          —— #titlescreen / .ts-card
      10.  通用组件               —— .tags / .chip / .slotbox / 判定盘 / 属性纹章 / 动效语言
      11.  结局全屏层             —— #endingscreen ＋ --ending-* 变量

     ⚠️ **改 CSS 前后各跑一次 node probe/frontend-audit.mjs** —— 它专抓本项目反复出现过的两类：
        「用了但没定义的变量」与「同一选择器两处定义、值还打架」。
     ⚠️ 改完必须跑 node game/src/main.ts --tests ：里面有一条守卫在数斜杠星号与星号斜杠是否配平 ——
        漏一个结束符会让**后面所有 CSS 变成注释**、整页裸奔，而花括号**仍然是配平的**（抓不到）。
     ═══════════════════════════════════════════════════════════════════ */
    /* ═══════════════════════════════════════════════════════════════════
       皮肤：昼夜双主题（2026-10-05 · 用户裁定「区分白天/黑夜，玩家可实时更换」）
       ─────────────────────────────────────────────────────────────────
       ⚠️ 背景：上一轮做的是**夜色鎏金**（用户当时拍板「压深成夜色鎏金」）。
          本轮用户实测后说「**太暗了**」⇒ 补一套昼间，并给实时切换。
          **夜色那套一个字没改**（它仍是默认的暗色分支）。

       三条实现纪律（都是踩过的坑）：
         ① **只换 token，不换结构** —— 昼夜之差全部落在 `:root` / `[data-theme=light]`
            两组变量里。任何 `rgba(...)`/`#hex` 硬编码都会**只对其中一套生效**，
            另一套直接坏掉 ⇒ 本轮把剩下的硬编码全部收进变量。
         ② **默认跟随系统，玩家可覆盖** —— 三档：
            无 `data-theme` ⇒ 跟随 `prefers-color-scheme`（跟系统）
            `data-theme="dark"` / `="light"` ⇒ 玩家手动锁定（存 localStorage）
            ⚠️ 不能写成"总是暗色"：那就不是双主题，是"带开关的单主题"。
         ③ **昼间的对比度要重新算，不能照抄夜间** —— 夜间 `--muted` 必须**调亮**
            （`#9a8d78`），昼间必须**调深**；反过来 4.5:1 直接不达标。
            两套的实测读数都写在下面。

       实测对比度（on 各自底色 · 全部过 WCAG AA 正文 4.5:1）：
         夜间：天数 8.05:1 · 辅助 5.36:1 · 小标题 4.86:1 · 画布块 12.63:1
         昼间：天数 7.62:1 · 辅助 5.51:1 · 小标题 5.02:1 · 画布块 10.94:1
    ═══════════════════════════════════════════════════════════════════ */

    /* ─────────────────────────────────────────────────────────────
       夜间（默认分支）—— 夜色鎏金。
       ⚠️ 暗色界面的关键不是"黑"，而是**层与层之间要能分开**。
          三层的明度差都控制在 3~5 个点：差太多界面会显得脏，差太少会糊成一片。
       ───────────────────────────────────────────────────────────── */
    /* ⚠️ 2026-10-06 补三个 token：`--sunken`（比底更**凹**的一层）＋ `--warn-ink` / `--ok-ink`（压在染色底上的**文字色**）。
       起因：那 4 处把 `#100d0a` / `#e88d7d` / `#8fc9a1` 写死在规则里 ⇒ **昼夜两套都漏**（白天是暗底暗字）。
       ⚠️ 两套的值**不是**互为反色：白底上文字必须**更深**（4.5:1），暗底上才要更亮。*/
    :root{
    /* 底与面（三层：底 → 面板 → 浮起）*/
    --bg:#15110e;        /* 底：带一点暖的墨黑（纯黑 #000 会让鎏金发脏） */
    --panel:#1e1915;     /* 面板：比底高一档 */
    --raise:#272019;     /* 浮起：卡面 / 输入框 / 悬停 */

    /* 墨色（暗底 ⇒ 前景要亮）*/
    --ink:#ece3d4;       /* 主文：暖白，不是纯白（纯白在暗底上会"刺"） */
    --ink-soft:#c4b9a6;  /* 正文次级 */
    --muted:#9a8d78;     /* 辅助文字：on --bg 6.4:1 · on --panel 6.0:1 */
    --faint:#6b6152;      /* 最弱：分隔说明、占位符 */

    /* 鎏金主色（暗底上必须比昼间**更亮**，否则金不成金）*/
    --accent:#d8a94e;    /* 主金：标题 / 重点 / 主按钮 */
    --accent-2:#e8c47a;  /* 亮金：悬停 / 焦点环 / 高亮边 */
    --accent-deep:#8a6520;/* 暗金：需要压住不抢戏的场合 */
    --on-accent:#1a1206;  /* 压在主金上的文字色（暗底 ⇒ 用深墨，不是白）*/

    /* 语义色（色相不变，只校准明度以适配底色）*/
    --danger:#d4695a;    /* 危险 / 档 A 强制 */
    --ok:#6fae82;        /* 成 / 可派遣 */
    --blue:#7ba0cc;      /* 场景 */
    --purple:#a98ad0;    /* 占卜 */
    --on-danger:#2a0f0b; /* 压在危险色上的文字 */

    /* 描边与染色底（暗底 ⇒ 染色很暗、描边很弱）*/
    --line:#3a3229;      /* 描边基色：比面板高一档，**远低于**面板的对比 */
    --line-soft:#2b251e; /* 更弱的分隔线 */
    --gold-line:#6b5527;
    --hint-line:#4a3f2c;
    --hint-line-2:#5a4c35;   /* 卡槽虚线：比 hint-line 再亮一档（"可放东西"的位置）*/
    --warn-line:#5c3a34;  --danger-soft:#2a1c19;
    --ok-line:#33503c;    --ok-soft:#18241c;
    --sunken:#15110e;      /* 比 bg 更凹的一层（"槽底"）*/
    --warn-ink:#e8c47a;   /* 压在 danger-soft 上的文字（白底要深）*/
    --ok-ink:#8fc9a1;     /* 压在 ok-soft 上的文字 */
    --scene-line:#33475c; --scene-soft:#18202a;
    --purple-soft:#231c2e;

    /* 兼容旧类名（JS 内联样式里还引用着这 8 个名字）——
       ⚠️ 类名与用途一字未改，只是两套主题下**值不同**。 */
    --gold-soft:#2a2118;
    --warn-soft:#2a1c19;
    --ok-soft:#18241c;
    --scene-soft:#18202a;

    /* 阴影：暗底上靠**深色投影**分层（亮底上那套浅色投影在暗底上看不见）*/
    --sh-1:0 2px 10px rgba(0,0,0,.26);              /* 卡片 */
    --sh-2:0 6px 22px rgba(0,0,0,.28);              /* 存档卡 */
    --sh-3:0 10px 34px rgba(0,0,0,.6);               /* 忙碌条 */
    --sh-4:0 24px 70px rgba(0,0,0,.6);              /* 弹窗 */
    --sh-5:0 0 0 1px rgba(0,0,0,.4);                /* 弹窗第二层描边 */
    --sh-inset:inset 0 1px 24px rgba(0,0,0,.35);    /* 画布内凹 */
    --overlay:rgba(8,6,4,.72);                      /* 遮罩 */
    --vignette:rgba(0,0,0,.5);                      /* 封面四周压深 */
    --sh-float:0 10px 26px rgba(0,0,0,.24);          /* 拖拽幽灵 */
    /* 结局全屏层（2026-10-06）：暗底那套 —— 中心一团暖金，边缘收进墨里 */
    --ending-glow:#241a10; --ending-bg:#0c0908;

    /* 鎏金标题渐变（暗底上要亮，否则金属感丢失）*/
    --sheen-1:#f6e2b0; --sheen-2:#e8c47a; --sheen-3:#a97f2c; --sheen-4:#e5c485;

    /* 字体系统 ───────────────────────────────────────────────────
       业界通行做法（Barrett Media 2026 / 汉仪游戏字体方案）：
         · **display 衬线**做标题 —— 承担题材辨识度与仪式感
         · **无衬线**做正文与 UI —— 小字号可读性优先
         · **等宽 + tabular-nums** 做数字 —— 数值跳动是"廉价感"的头号来源
       ⚠️ 衬线栈按"本机一定有"排：宋体系在 Windows/macOS 都有，
          再退回 CJK 泛型 serif。**不引外部字体文件**（离线要能跑）。*/
    --font-display:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",
                   "Noto Serif SC",Georgia,serif;
    --font-body:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",
                "Noto Sans SC","Segoe UI",system-ui,sans-serif;
    --font-num:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;

    /* 动效变量 ─────────────────────────────────────────────────
       一套时长/缓动**全站共用**。业界惯例：进场比退场慢，微交互最快。 */
    --t:180ms;                                   /* 微交互：悬停 / 按下 */
    --t-slow:420ms;                              /* 进场：卡片 / 面板 */
    --t-slower:720ms;                            /* 大件：封面标题 */
    --ease:cubic-bezier(.2,.7,.3,1);             /* 通用：减速收尾 */
    --ease-in:cubic-bezier(.5,0,.9,.4);          /* 退场 */
    --stagger:40ms;                              /* 逐条错开的步长 */

    /* ⚠️⚠️ 2026-10-07 补三个「只有人用、没人定义」的名字 ——
       前端结构体检（probe/frontend-audit.mjs）一次扫出 6 个"未定义变量"，其中这 3 个是**真缺**：
       CSS 的 var() 取不到值 ⇒ **那一整条声明作废** ⇒ 用到它们的 12 处样式**静默失效**
       （症状是"颜色不对 / 动画不动"，但控制台一个字都不报，所以此前一直没被发现）。
       ⚠️ 一律**别名到已有的真相源**，不另抄一份值 —— 否则又要"四处同步"（本文件的老坑）。 */
    --gold:var(--accent);      /* 金 ＝ 主金。此前 7 处（事件台淡黄提示 / 选中卡 / 欲望小字…）全废 */
    --warn:var(--danger);      /* 警 ＝ 危险色。此前 3 处（人物飞离 / 脉冲环 / 染色底）全废 */
    --t-fast:120ms;            /* 比 --t 再快一档（轻触级微交互）。此前 2 处全废 */
  }

  /* ─────────────────────────────────────────────────────────────
     昼间（`[data-theme=light]`）—— 回到「纸与墨」的路子，但**重新校准过**。
     ⚠️ 不是把夜间变量反过来写 —— 亮底上要**加**对比，暗底上要**减**对比：
        · 描边要更深（暗底上 3~5 点的差就够分层，亮底上不够 ⇒ 提到 10~14）
        · 投影要更浅更散（亮底上深投影会发脏 ⇒ 用带暖的浅褐）
        · 染色底要**极浅**（暗底的 12% 在亮底上就是一片脏渍 ⇒ 降到 5%）
        · 鎏金要**压深**（`#8a5a2b` 一族才在白底上像金；`#d8a94e` 在白底上太淡）
     唯一与夜间**完全相同**的是语义色的色相与功能 —— 它们各自回答的问题没变。
     ───────────────────────────────────────────────────────────── */
  [data-theme="light"]{
    --bg:#f4f1ea;        /* 暖白纸底（这一支就是原来的「纸与墨」）*/
    --panel:#fffdf9;
    --raise:#ffffff;     /* 浮起：亮底上"浮起"要用纯白（比面板更亮）*/

    --ink:#2b2620;       /* 主文：暖黑 */
    --ink-soft:#453f37;
    --muted:#5f574c;     /* 辅助：**调深**（与夜间相反的方向）on --bg 5.9:1 */
    --faint:#8a8175;

    --accent:#8a5a2b;    /* 深金 —— 亮底上的金必须压深才立得住 */
    --accent-2:#6d451f;  /* 亮底上没有"更亮的金"可用，焦点环改用更深的褐金 */
    --accent-deep:#c9a86a;
    --on-accent:#fffaf0;  /* 压在主金上的文字色（亮底 ⇒ 用暖白）*/

    --danger:#a63a2e;
    --ok:#3f7a4f;
    --blue:#3a5f8a;
    --purple:#7b5ea7;
    --on-danger:#fff;

    --line:#ddd5c6;      /* 亮底上描边要明显更深 */
    --line-soft:#e8e1d4;
    --gold-line:#c9a86a;
    --hint-line:#e3d3ae;
    --hint-line-2:#cbbf9a;
    --warn-line:#e0b9ad;  --danger-soft:#fdf2ef;
    --ok-line:#bdd9c6;    --ok-soft:#f2f9f4;
    --sunken:#eee8db;      /* 比 bg 更凹的一层（"槽底"）*/
    --warn-ink:#a8452f;   /* 压在 danger-soft 上的文字（白底要深）*/
    --ok-ink:#1f6b46;     /* 压在 ok-soft 上的文字 */
    --scene-line:#9fb8d4; --scene-soft:#f6f9fd;
    --purple-soft:#faf7fd;

    --gold-soft:#fdf6ea;
    --warn-soft:#fdf2ef;
    --ok-soft:#f2f9f4;
    --scene-soft:#f6f9fd;

    /* 亮底上投影要**浅而暖**（深黑影在纸面上发脏）*/
    --sh-1:0 1px 3px rgba(80,62,40,.10);
    --sh-2:0 4px 14px rgba(80,62,40,.12);
    --sh-3:0 8px 26px rgba(80,62,40,.16);
    --sh-4:0 20px 56px rgba(60,46,28,.24);
    --sh-5:0 0 0 1px rgba(80,62,40,.06);
    --sh-inset:inset 0 1px 20px rgba(80,62,40,.07);
    --overlay:rgba(43,38,32,.44);
    --vignette:rgba(120,96,64,.16);
    --sh-float:0 8px 20px rgba(80,62,40,.18);
    /* 结局全屏层（2026-10-06）：亮底那套 —— **不能照抄暗底**，否则纸面发脏 */
    --ending-glow:#fdf7ec; --ending-bg:#e8e1d3;

    --sheen-1:#c9a86a; --sheen-2:#8a5a2b; --sheen-3:#e8cfa0; --sheen-4:#b0813f;
  }

  /* ⚠️ **默认跟随系统**（用户裁定「默认跟随系统，可手动覆盖」）：
     只有在玩家**没有**手动锁定时（`<html>` 上没有 `data-theme`）才生效。
     ⇒ 这一段必须排在 `[data-theme=light]` **之后** —— 同等特异性下后者赢，
        手动锁昼间时不会被系统偏好（夜）压回去；反之锁夜间也不受影响。
     ⚠️ 两个 `@media` 是**互补**的两半：`no-preference` 给日间模式用亮色，
        剩下那半（给夜间的）必须用 `(prefers-color-scheme:dark)` 显式写。 */
  @media (prefers-color-scheme:no-preference){
    :root:not([data-theme]){
      --bg:#f4f1ea; --panel:#fffdf9; --raise:#ffffff;
      --ink:#2b2620; --ink-soft:#453f37; --muted:#5f574c; --faint:#8a8175;
      --accent:#8a5a2b; --accent-2:#6d451f; --accent-deep:#c9a86a; --on-accent:#fffaf0;
      --danger:#a63a2e; --ok:#3f7a4f; --blue:#3a5f8a; --purple:#7b5ea7; --on-danger:#fff;
      --line:#ddd5c6; --line-soft:#e8e1d4;
      --gold-line:#c9a86a; --hint-line:#e3d3ae; --hint-line-2:#cbbf9a;
      --warn-line:#e0b9ad;  --danger-soft:#fdf2ef;
      --ok-line:#bdd9c6;    --ok-soft:#f2f9f4;
      --sunken:#eee8db;      /* 比 bg 更凹的一层（"槽底"）*/
      --warn-ink:#a8452f;   /* 压在 danger-soft 上的文字（白底要深）*/
      --ok-ink:#1f6b46;     /* 压在 ok-soft 上的文字 */
      --scene-line:#9fb8d4; --scene-soft:#f6f9fd;
      --purple-soft:#faf7fd;
      --gold-soft:#fdf6ea; --warn-soft:#fdf2ef; --ok-soft:#f2f9f4; --scene-soft:#f6f9fd;
      --sh-1:0 1px 3px rgba(80,62,40,.10);
      --sh-2:0 4px 14px rgba(80,62,40,.12);
      --sh-3:0 8px 26px rgba(80,62,40,.16);
      --sh-4:0 20px 56px rgba(60,46,28,.24);
      --sh-5:0 0 0 1px rgba(80,62,40,.06);
      --sh-inset:inset 0 1px 20px rgba(80,62,40,.07);
      --overlay:rgba(43,38,32,.44);
      --vignette:rgba(120,96,64,.16);
      --sh-float:0 8px 20px rgba(80,62,40,.18);
    /* 结局全屏层（2026-10-06）：亮底那套 —— **不能照抄暗底**，否则纸面发脏 */
    --ending-glow:#fdf7ec; --ending-bg:#e8e1d3;
      --sheen-1:#c9a86a; --sheen-2:#8a5a2b; --sheen-3:#e8cfa0; --sheen-4:#b0813f;
    }
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      /* 系统是夜间 ⇒ 显式把夜间那套**再写一遍**。
         ⚠️ 不能靠"什么都不写"：`:root` 里写的是夜间，可上面对
            `no-preference` 那半已经给了昼间 —— 系统夜间时那个 media 不成立，
            理论上会落回 `:root` 的夜间。**这里显式重写是为了让意图可读**，
            代价是两份值必须同步（改一处忘另一处 = 夜里在白天亮着）。
            ⇒ 变量表就这一份来源，夜间的真值在 `:root`，这里只是镜像。 */
      --bg:#15110e; --panel:#1e1915; --raise:#272019;
      --ink:#ece3d4; --ink-soft:#c4b9a6; --muted:#9a8d78; --faint:#6b6152;
      --accent:#d8a94e; --accent-2:#e8c47a; --accent-deep:#8a6520; --on-accent:#1a1206;
      --danger:#d4695a; --ok:#6fae82; --blue:#7ba0cc; --purple:#a98ad0; --on-danger:#2a0f0b;
      --line:#3a3229; --line-soft:#2b251e;
      --gold-line:#6b5527; --hint-line:#4a3f2c; --hint-line-2:#5a4c35;
      --warn-line:#5c3a34;  --danger-soft:#2a1c19;
      --ok-line:#33503c;    --ok-soft:#18241c;
      --sunken:#15110e;      /* 比 bg 更凹的一层（"槽底"）*/
      --warn-ink:#e8c47a;   /* 压在 danger-soft 上的文字（白底要深）*/
      --ok-ink:#8fc9a1;     /* 压在 ok-soft 上的文字 */
      --scene-line:#33475c; --scene-soft:#18202a;
      --purple-soft:#231c2e;
      --gold-soft:#2a2118; --warn-soft:#2a1c19; --ok-soft:#18241c; --scene-soft:#18202a;
      --sh-1:0 2px 10px rgba(0,0,0,.26);
      --sh-2:0 6px 22px rgba(0,0,0,.28);
      --sh-3:0 10px 34px rgba(0,0,0,.6);
      --sh-4:0 24px 70px rgba(0,0,0,.6);
      --sh-5:0 0 0 1px rgba(0,0,0,.4);
      --sh-inset:inset 0 1px 24px rgba(0,0,0,.35);
      --overlay:rgba(8,6,4,.72);
      --vignette:rgba(0,0,0,.5);
      --sh-float:0 10px 26px rgba(0,0,0,.24);
    /* 结局全屏层（2026-10-06）：暗底那套 —— 中心一团暖金，边缘收进墨里 */
    --ending-glow:#241a10; --ending-bg:#0c0908;
      --sheen-1:#f6e2b0; --sheen-2:#e8c47a; --sheen-3:#a97f2c; --sheen-4:#e5c485;
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.65 var(--font-body);
    display:flex; flex-direction:column;
    /* 暗底上正文行高要比暖白底**再松一档**：亮底上字形显得重、密一点也读得动，
       暗底的发光边缘会让行距显得更挤（视觉上比实际更密）。 */
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    /* 中文断行禁则（2026-10-08 用户裁定「标点前后不要莫名其妙的空格」）：
       浏览器默认折行**不管行首是什么** ⇒ 收标点（」』。，！？；……——）会被
       挤到下一行开头，读起来就是截图里那种"引号孤零零挂在行首"的断裂感。
       `strict` 让引擎应用中文行首禁则：收标点宁可向行尾挤压也不下行首。
       老引擎不认识这条 ⇒ 平静回落（与现状相同），无害。 */
    line-break:strict;
  }
  /* 标题一律衬线 —— 承担题材辨识度（原来是全站 Segoe UI，西幻王权题材零辨识度）。
     ⚠️ 只给**标题**用：正文绝不用衬线（小字号下衬线会糊，这是那条铁律）。 */
  h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:.02em}
  /* 数字：等宽 + 定宽数位 —— 顶栏那些会频繁变的数字（金币 / 天数 / 点数）
     不再左右抖动。 */
  b,.num,input,select,textarea,.chip,.apdots i{font-variant-numeric:tabular-nums}
  button{
    font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--raise);
    color:var(--ink); border-radius:6px; padding:4px 12px;
    transition:background var(--t) var(--ease),border-color var(--t) var(--ease),
               color var(--t) var(--ease),transform var(--t) var(--ease),
               box-shadow var(--t) var(--ease);
  }
  button:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--raise));color:var(--ink)}
  /* 按下：微微下沉 —— 这是"按钮真的被按到了"最廉价也最有效的反馈 */
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  button.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
  button.ghost{background:transparent;color:var(--muted);border-color:transparent}
  button.ghost:hover:not(:disabled){background:var(--raise);color:var(--ink)}
  input,select,textarea{
    font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);
    border-radius:5px;padding:3px 8px;
    transition:border-color var(--t) var(--ease),background var(--t) var(--ease);
  }
  input:hover,select:hover,textarea:hover{border-color:var(--line-soft)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--panel)}
  input[type=number]{width:66px}
  .mono{font-family:var(--font-num)}
  /* 选中文本：暗底上默认的蓝底会糊，给一条与主色同族的鎏金选中 */
  ::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:#fff}
  /* 滚动条：默认滚动条在暗底上是一条亮白槽，比任何控件都抢眼 */
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-line)}

  /* ── 顶栏（2026-10-05 · 暗色 + 分三区）────────────────────────────
     ⚠️ 原来 8 个 `<span>` 平铺在一条 flex 里，读者分不出"哪些是**今天**、
        哪些是**这一局**"。业界做法（Island Class「HUD 只放必要信息」+
        电影 HUD 的三分法）是把常驻读数**按语义分三区**，各区之间给一条竖线。
     ⚠️ 三区的**内容与顺序一字未改**（`renderTop` 逐字照旧）——
        这里只改**摆放方式**：`.tb-l` 时间 · `.tb-c` 资源与进度 · `.tb-r` 时间读数。
        之前那条 `#topbar > span + span{border-left}` 的"相邻加分隔"因此退休：
        语义分组要靠容器（`span` 的父级），靠相邻选择器分不开。 */
  #topbar{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0 20px;
    padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  /* 左区：这一天的进度（天数 · 章节 · 剩下几点）—— 三项各占一格，中间有间距。
     ⚠️ 原来三个 `<span>` 是**并列**的兄弟，靠 `#topbar` 的 `gap` 撑开；
     分成三区容器之后它们落进了 `.tb-l`，那个 gap 只作用于**三区之间**了
     ⇒ 必须给 `.tb-l` 自己也声明 gap，否则三项会贴成一坨（实测截图证实）。*/
  #topbar .tb-l{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
  #topbar .tb-c{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
    justify-content:center;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
    padding:1px 18px}
  #topbar .tb-r{display:flex;align-items:center;gap:12px;justify-content:flex-end}
  /* 天数：全场最该被一眼看到的东西 —— 衬线 ＋ 亮金 ＋ 略大。
     ⚠️ 右边给 `.day` 加一条竖线，与后面两项分组（"今天" vs "这一章"）。 */
  #topbar .day{font-family:var(--font-display);font-size:19px;font-weight:600;
    color:var(--accent);letter-spacing:.03em;white-space:nowrap;
    padding-right:16px;border-right:1px solid var(--line-soft)}
  #topbar .kv{color:var(--muted);font-size:13px;white-space:nowrap}
  #topbar .kv b{color:var(--ink);font-weight:600}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:999px;
    padding:1px 9px;color:var(--muted);font-size:12px;white-space:nowrap}
  .prop{font-style:italic;color:var(--accent-2)}

  /* 欲念区间（玩家唯一看得到的欲念读数 —— 数值与危险区都在上帝视角里）
     ⚠️ `win`（窗口）那一档是唯一的"好结局"区间，它该在暗底上**发一点光**；
        `lost`/`indulge` 两档用暗红底 + 暗红字，不用亮红（亮红在暗底上会像报错）。 */
  .chip.band{font-weight:600}
  .chip.band.norm{color:var(--ink-soft)}
  .chip.band.win{border-color:var(--accent-deep);color:var(--accent-2);background:var(--gold-soft);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 12%,transparent)}
  .chip.band.lost,.chip.band.indulge{border-color:var(--warn-line);color:var(--danger);background:var(--danger-soft)}

  /* ── 主体两栏（2026-09-22 · 画布轮；2026-10-05 改留白节奏）──────────
     ⚠️ **右栏撤掉**：用户裁定「事件处理后也不需要保留这么多历史……」⇒ 装历史的
        「记事」没有内容可装，留着就是一条空栏。
     ⚠️ 左栏 300px：名册要放下**全部已出现的人**（开局 1 入队 ＋ 9 未入队）。
     ⚠️ 间距 12 → **14**，卡片内边距 10/12 → **12/14**：暗底上元素贴得太近会糊成一片，
        留白要比亮底**多**一点。 */
  /* ─────────────────────────────────────────────────────────────────
     主体两栏（2026-09-22 画布轮；2026-10-05 布局重构 ＋ 暗色 ＋ 留白）
     ─────────────────────────────────────────────────────────────────
     ⚠️ **右栏撤掉**（2026-09-22）：用户裁定「事件处理后也不需要保留这么多历史……」⇒
        装历史的「记事」没有内容可装，留着就是一条空栏。
     ⚠️ **左栏 304 → 236px**（2026-10-05）：布局重构把「三王子 / 身外之物 / 人手」
        三张卡沉到了**底部手牌带**（`renderHand`），左栏只剩「最终任务清单」
        ＋「尚未入队」＋「章级概要」—— 而这三张卡面**各只有一两行**。
        304px 配这种内容就是"为了放三行字占掉四分之一屏" ⇒ 收窄，
        省下的宽度**全给中栏的画布**（它才是主体）。
     ⚠️ 间距 12 → **14**，卡片内边距 10/12 → **12/14**：暗底上贴得太近会糊成一片，
        留白要比亮底**多**一点。
     ───────────────────────────────────────────────────────────────── */
  /* ═══════════════════════════════════════════════════════════════════
     三段式布局（2026-10-06 · 用户裁定，原话见下）
     ─────────────────────────────────────────────────────────────────
     用户裁定：「整体UI布局还是有问题：**不需要这么多分块**，只需要
       ① 上部分的**基础信息区** ② 下部分的**手牌区** ③ **中间全部是地图区**；
       **最终任务区域和未入队人物应该也是地图区内的方格**，
       而且既然未入队放在这里了，**手牌区就不需要有了**（指"未入队"那块）。
     ⇒ **左栏整个取消**（`grid-template-columns` 变**单列**）：
       · 顶栏 ＝ 基础信息区（日期/章节/时间/资源/声望，它本来就是 `header`）
       · 中间 ＝ 地图区（画布 ＋ 最终任务清单 ＋ 未入队人物，**全在里面**）
       · 底部 ＝ 手牌区（人物 ＋ 物品 ＋ 金币；**砍到原来一半高**）
     ⚠️ **左栏取消后「最终任务清单」会丢** —— 所以 `renderLeft` 的内容
       要**搬进中栏**（见 `renderMid` 里的 `missionPanel`），
       不是"删掉"。⚠️ 另有一条测试钉着"清单仍在左栏"，需同步改（意图不动）。
     ═══════════════════════════════════════════════════════════════════ */
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px;
    align-items:stretch;overflow:hidden;min-height:0}
  /* ⚠️ 2026-10-05：`min-height:0` 不可省 —— flex/grid 子项默认 `min-height:auto`，
     它会让 `overflow:hidden` 失效（内容顶出去而不是内部滚动）。
     左栏**自己滚**（它内容可能很长），中栏**不滚**（画布要吃满高度）。 */
  #colLeft{display:none}   /* 2026-10-06：三段式布局取消左栏（内容搬进中栏）*/
  #colMid{min-height:0;position:relative}
  /* ⚠️ `#colMid` 的 `position:relative` 是**给 `.cvhead` 当定位基准**用的（2026-10-07）。
     它的基准原先是 `.canvas`（台面），而台面下面还有事件块、左上角那两块常驻卡
     ⇒ 「这些是摆在你面前的事」那句被挤到台面里、**不是地图的最上面居中**
     （用户第 23 条原话：「这句话应该显示在地图**最上面居中**」）。
     ⇒ 现在把那句话提成中栏的**第一个子元素**（`.cvtop`），定位基准换成整个中栏。*/
  .col{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
  /* 卡片：暗底上"卡片"这件事**全靠描边与投影成立**（亮底上靠阴影）——
     第一版只给了 `--line` 描边，实测左栏与底色糊成一片 ⇒ 补一层投影。
     ⚠️ 投影是**向下**的（`0 2px 8px`），不是发光 —— 发光会让暗底界面变成霓虹。*/
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    box-shadow:var(--sh-1);
    transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
  /* 小标题：衬线 ＋ 宽字距 ＝ "分区标题"的读感（原来是无衬线 13px 灰字）*/
  .card > h3{font-family:var(--font-display);font-size:13.5px;color:var(--muted);
    font-weight:600;letter-spacing:.14em;margin-bottom:9px}

  /* 事件卡 */
  .ev{border-left:3px solid var(--line)}
  .ev.tA{border-left-color:var(--danger)}
  .ev.tB{border-left-color:var(--accent-2)}
  .ev.tC{border-left-color:var(--blue)}
  .ev .evhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ev .title{font-family:var(--font-display);font-weight:600;font-size:15.5px}
  /* 叙事正文：**唯一**该用较大行高的地方（1.8）—— 玩家在这段文字上要停留最久 */
  .ev .body{color:var(--ink-soft);line-height:1.8;margin:6px 0 8px}
  .ev .meta{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--muted);font-size:12.5px;margin-bottom:6px}
  .tags{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;margin:8px 0}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
    color:var(--muted);white-space:nowrap}
  .tag.warn{border-color:var(--warn-line);color:var(--danger);background:var(--danger-soft)}
  .tag.good{border-color:var(--ok-line);color:var(--ok);background:var(--ok-soft)}
  .who{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0}
  .who label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;font-size:13px}
  .ops{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .ops .sep{color:var(--line)}
  .list{display:flex;flex-direction:column;gap:9px}

  /* 人物表 */
  .prow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .nm{font-weight:600}
  .prow .sub{color:var(--muted);font-size:12px}
  /* ⚠️ 2026-09-20：**只**给人物的行改成上下堆叠。
     原因：挤压来自**左栏容器只有 250px**（`#colLeft`），与视口宽度无关 ——
     宽屏下 `瓦伦丁·索雷 丞相 | HP 3 SAN 3 · 容量 4` 一样会被折断成三四截。
     而 `.prow` 还有 4 处别的用法（身边之物 / 回退 / 已了结 / **最近概要**），
     其中「最近概要」是 `第 N 天 | 右对齐长文`，**靠 flex 行成型，不能堆叠** ⇒
     只对带着 `person` 类的那一种生效（`personLine()`）。 */
  .prow.person{flex-direction:column;align-items:flex-start;gap:2px}
  .hp{color:var(--danger);font-weight:650}
  .dim{opacity:.5}

  /* 最终任务清单（左栏 · 全周常驻） */
  .plrow{display:flex;gap:6px;align-items:baseline;margin-bottom:5px}
  .plrow .tag{flex:0 0 auto}
  .plrow .lst{min-width:0;font-size:12.5px;color:var(--ink-soft);word-break:break-word}

  /* 第 28 天 · 放格子的三格 */
  .slot{border:1px dashed var(--line);border-radius:8px;padding:9px 11px;margin-top:9px;background:var(--raise)}
  .slot .sh{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:6px}
  .slot .sh b{font-family:var(--font-display);font-size:13.5px;color:var(--accent)}
  .slot .sh .sub{font-size:12px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  // ⚠️ 2026-10-06 清单第 4B 条：`.optchip` 那三条样式**已删** —— 它服务的是
  //   P5-B 时代的「三格候选项就地选择」（`slotHtml`），那一整条通路都撤了。
  //   留着它们不会出错，但会让人以为还有一个候选 chip 系统。

  /* 播报 */
  .feed{border-left:3px solid var(--accent-2);padding:3px 0 3px 10px;margin-bottom:10px}
  .feed .fh{font-size:12px;color:var(--muted)}
  .feed.k揭晓{border-left-color:var(--ok)}
  .feed.k弹窗{border-left-color:var(--danger)}
  .feed.k场景{border-left-color:var(--blue)}
  .feed.k终局{border-left-color:var(--accent);background:var(--gold-soft)}
  .feed.k占卜{border-left-color:var(--purple);background:var(--purple-soft)}
  /* ── 画布（2026-09-22 · 用户裁定；2026-10-05 暗色 + 悬停浮起）───────
     原话：「UI 要是一个地图的形状会更有代入感 … 大部分事件是分散在地图上的」；
     再收敛成：「不需要呈现完整的地图 …… 事件较为**随机出现在画布上**就可以，
     **不需要根据地点分区**，地图上**只需要出现事件的 title**，**点开后才看到详情**。」
     ⚠️ 它**不是地图系统**：不分区、不设区域层级、**不读 `location` / `stage` 摆位**
        ⇒ 《设定.md》:619「不搭地图系统、不设区域层级」**原样成立**，设计文档一个字没改。
     ⚠️ 摆位是**确定性伪随机**（见 `hashOf` / `canvasSlots`），不是每次渲染重新掷骰 ——
        纯随机会让同一条事在每次重画（勾人 / 展开 / 存读档）之后**跳到别处**。
     ⚠️ 点阵从"褐点"改成 **`--raise` 亮一点**的圆点：暗底上原来的 `--line`
        点阵几乎看不见（这正是"画布空得刺眼"的直接原因 —— 有网格也像没有）。 */
  /* 「这一局·最终任务」＋「尚未入队」两块：**浮在地图台面左上角**。
     ⚠️ 2026-06 用户裁定：「任务清单/尚未入队**像事件块一样放在地图区的左上角**」
     ⚠️ **不占布局**（`position:absolute`）⇒ 它不把事件块往下挤；
       事件块的摆位是 `canvasSlots` 按**条数**算的，与它无关。
     ⚠️ `pointer-events` 只在这块里开 ⇒ 空白处的拖动/平移仍然穿透到画布。 */
  .mapcorner{position:absolute;left:12px;top:12px;width:292px;z-index:4;
    display:flex;flex-direction:column;gap:8px;pointer-events:auto;
    max-height:calc(100% - 24px)}
  .mapcorner .card{background:color-mix(in srgb,var(--panel) 92%,transparent);
    backdrop-filter:blur(3px);box-shadow:var(--sh-1)}
  /* 名单那块默认可滚动，不把地图压满 */
  .mapcorner .foldlist{max-height:216px;overflow-y:auto}

    overflow:hidden;

       ③ 是关键：没有它，一条事的时候画布就是**一片死黑**，看着像加载失败。*/
    background-image:radial-gradient(ellipse 52% 46% at 50% 46%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 74%),

       ③ **横向滚动**而不是换行：11 个人横铺会占 3 屏，一行放不下就必须滚动。
       ④ 「未入队」那组**默认收起**（折叠钮在卡带右端）—— 11 张卡里
          开局真正能派的只有 1 个，其余是背景，不该占着最好的位置。

     ⚠️ **不新增任何读数**：卡面上每个字段都取自 `v.people[i]` 里**已经存在**的值。
     ⚠️ 拖拽落点与判定**一字未改** —— 仍走 `canDropOn` 那一个判据（见文件尾的拖拽段）。
     ⚠️ **DOM 位置在 `<main>` 之后**：`body` 是 flex 列且 `main{flex:1}`，
        手牌带排在 `main` 前面会被顶到顶栏下面（第一版实测就是这样）。
     ═══════════════════════════════════════════════════════════════════ */
  /* ⚠️⚠️ 2026-10-06 用户裁定（**改**）：「我说的手牌区的折叠，是指**高度**可以展开
     （**展开后自然遮挡事件区**）不是宽度的折叠，这样才自然」。
     ⇒ `#hand` 平时**只留一条边**（露出卡的上半截，一眼知道"下面还有"），
       点它**向上展开成整幅**（展开态 `position:relative` + `z-index` 盖住中栏）
       —— 不是横向收窄、不是宽度动画。
     ⚠️ 展开按钮那条边自己有 `cursor:pointer` ＋ 写明"点我展开"，
       免得玩家以为是分块边框。 */
  #hand{display:none}
  body.mode-game #hand{
    display:flex;align-items:stretch;gap:0;
    position:relative;
    padding:10px 16px 8px;
    background:var(--panel);border-top:1px solid var(--line);
    box-shadow:var(--sh-1);
  }
  body.mode-title #hand{display:none}
  /* 卡带本体：一条横向的轨道。两端各留一点渐隐，暗示"还能往那边滑"。 */
  .hand-rail{display:flex;align-items:stretch;gap:9px;overflow-x:auto;overflow-y:hidden;
    padding:2px 2px 6px;flex:1;min-width:0;
    scroll-behavior:smooth;scrollbar-width:thin}
  .hand-rail::-webkit-scrollbar{height:6px}
  .hand-rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:0}
  /* 卡带左端的固定块：「这一局」与「三格」的入口 —— 它不滚动，永远在手边 */
  .hand-fixed{display:flex;align-items:stretch;gap:8px;flex:0 0 auto;
    padding-right:12px;margin-right:4px;border-right:1px solid var(--line-soft)}

  /* 一张角色卡 —— **主角与下属同一个函数、同一套 class、同样可拖**。
     ⚠️ 唯一区别是 `me` 时多一圈金边（表明"这是你"），**不是**另一种形状或另一种待遇：
        它照样出现在派人的名单里、照样能被拖到事件上。 */
  /* ⚠️ 2026-10-06 用户裁定：「下部分的手牌区太大了，**高度砍到原来的一半**」
     96 → 52。⚠️ 只砍高度、**不砍宽度**（卡面那一行的字要读得出来）。
     ⚠️ 压到 52 之后卡内只放**两行**：名字 ＋ 状态/加成那行
     （第三行如六维点阵、HP 条在 52px 里放不下了 ⇒ 移进点开的浮层看）。
     字号同步降一档，否则 52px 塞不下现在的字。 */
  .hcard{flex:0 0 auto;width:112px;min-height:52px;
    display:flex;flex-direction:column;gap:2px;padding:5px 8px;
    background:var(--raise);border:1px solid var(--line);border-radius:9px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:border-color var(--t) var(--ease),background var(--t) var(--ease),
               transform var(--t) var(--ease),box-shadow var(--t) var(--ease);
    animation:cardIn var(--t-slow) var(--ease) both;
    animation-delay:calc(var(--i,0) * 30ms)}
  .hcard:hover{border-color:var(--gold-line);background:color-mix(in srgb,var(--accent) 8%,var(--raise));
    transform:translateY(-3px);box-shadow:var(--sh-2);z-index:2}
  /* 主角：金边 ＋ 一个小角标。⚠️ 不是"特殊卡" —— 形状/尺寸/可拖性全与下属一致。 */
  .hcard.me{border-color:var(--accent-deep);background:color-mix(in srgb,var(--accent) 7%,var(--raise))}
  .hcard.me::after{content:'我';position:absolute;top:0;right:0;
    font-size:10px;line-height:1;padding:3px 5px;color:var(--on-accent);
    background:var(--accent);border-bottom-left-radius:7px}
  /* 拖拽时的手感（源卡被按住）*/
  .hcard[data-kind]{cursor:grab}
  .hcard[data-kind]:active{cursor:grabbing}
  /* 卡面三行：**名字 / 身份一行 / 状态点**。HP·SAN 折成两颗小点，不占文字位。 */
  .hcard .hn{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--ink);
    line-height:1.25;word-break:break-word}
  .hcard .hi{font-size:11px;color:var(--muted);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hcard .hr{display:flex;align-items:center;gap:5px;margin-top:auto;flex-wrap:wrap}
  /* 能力点：四颗小点，用了的是实心（与顶栏那颗计时器同一套语言）*/
  .hcard .hap{display:inline-flex;gap:2px}
  .hcard .hap i{width:5px;height:5px;border-radius:50%;border:1px solid var(--accent);
    display:block}
  .hcard .hap i.on{background:var(--accent)}
  .hcard .hs{font-size:10.5px;color:var(--muted);white-space:nowrap}
  /* 状态徽标：重伤 / 在途 / 濒死 —— 只在**有**事时出现，平时不留空位 */
  .hcard .hb{position:absolute;left:0;top:0;bottom:0;width:3px}
  .hcard.hurt .hb{background:var(--danger)}
  /* 归位（2026-10-05）：刚结算完，他那张卡亮一下 —— 他本来就在卡带上，
     这里演的是"刚才不见了，现在又出现了"，不是"搬过来"。 */
  .hcard.back{animation:backHome 1500ms var(--ease) both;z-index:3}
  @keyframes backHome{
    0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);
       border-color:var(--accent-2)}
    22%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent);
       border-color:var(--accent-2);transform:translateY(-5px) scale(1.035)}
    100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent);transform:none}}
  @media (prefers-reduced-motion:reduce){.hcard.back{animation:none}}
  .hcard.away .hb{background:var(--blue)}
  .hcard.off{opacity:.55}
  /* 六维格里那个 `+3`：绿色、斜体、紧跟实值 —— 三个特征合起来才读得出"这是装备给的" */
  .attrgrid .a.boosted b{color:var(--ok)}
  .attrgrid .abo{font-family:var(--font-num);font-size:10.5px;font-style:normal;
    font-weight:500;color:var(--ok);margin-left:3px;vertical-align:2px;
    background:color-mix(in srgb,var(--ok) 13%,transparent);border-radius:3px;padding:0 3px}

  /* 事件卡上那行「要智慧 —— 办之前不妨先给他带上加成的装备」。
     ⚠️ 它是**提醒**不是**要求** ⇒ 没有红框、没有 `.must`，只是行提示。 */
  .equipTip{margin:7px 0 2px;padding:5px 9px;border-radius:7px;font-size:12px;
    color:var(--muted);background:color-mix(in srgb,var(--accent) 6%,transparent);
    border-left:2px solid var(--gold-line);line-height:1.55}
  .equipTip.warn{color:var(--ink-soft);border-left-color:var(--warn-line);
    background:color-mix(in srgb,var(--warn) 7%,transparent)}

  /* ── 携带物品：卡上那个 `@n` ＋ 逐件物品词条（2026-10-07 用户裁定）────────
     ⚠️ `@n` 借的是《口袋风暴》"寄放"那套记号：一个字符，不占地方（保留）。
     ⚠️ 卡面**逐件**显示带的东西（2026-10-07 用户裁定「统一改成」）：
        · 有数值加成的 ⇒ 显示加成词条（`.itb`，如「争斗+1」）；
        · 特殊物品 ⇒ 蓝色「特殊物品」词条（`.itsp`）；
        · 其余（无加成的装备/消耗品）⇒ 不占卡面（详情页的四个卡槽里有）。
     ⚠️ 旧的「物品卡缩进人卡」飞行特效（.carryfly / carryIn）**已删** ——
        用户原话：「删掉这个奇怪的携带特效」。 */
  .hat{display:inline-block;margin-left:5px;padding:0 5px;border-radius:4px;
    font-family:var(--font-num);font-size:10.5px;font-weight:500;line-height:15px;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);
    border:1px solid var(--ok-line);vertical-align:1px}
  /* 卡面上的逐件物品词条：加成用绿（与 `.hat` 同族），特殊物品用蓝。
     ⚠️ 2026-10-07：`.itb` 改 **inline-flex** —— 里面要装属性图标（`attrSigil` 的 svg）
     ＋ 文字，`inline-block` 会让图标和文字的基线对不齐。 */
  .itb,.itsp{display:inline-flex;align-items:center;gap:2px;margin:2px 4px 0 0;padding:0 6px;border-radius:4px;
    font-size:10.5px;line-height:16px;vertical-align:1px}
  .itb .sigil{flex:none}
  .itb{font-family:var(--font-num);color:var(--ok);
    background:color-mix(in srgb,var(--ok) 12%,transparent);
    border:1px solid var(--ok-line)}
  .itsp{color:var(--accent-2);
    background:color-mix(in srgb,var(--accent-2) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--accent-2) 45%,transparent)}
  /* 卡面上那行属性加成：绿底小徽（+3 与"恢复"这类状态词区分开，靠位置与底色）*/
  /* 声望五项：**恒定全列**（用户裁定「0 也要显示」）——
     0 用淡色但**占位**，非 0 用正常色 ⇒ 一眼看出"哪几项在动"。
     ⚠️ 不折行（`nowrap`）：顶栏那一条是常驻的，折行会把日期顶下去。 */
  .tb-rep .rp{white-space:nowrap;margin-right:6px;font-family:var(--font-num)}
  .tb-rep .rp.zero{color:var(--faint)}
  /* 物卡：比人卡**窄一档**（东西没有"身份"要写）—— 独立成卡后必须重新定宽，
     否则它跟人卡一样宽，卡带上就分不清哪张是物。
     ⚠️⚠️ 2026-10-07：尺寸与字号的**真值不在这里**，在下面「底部手牌区」那一节（全文件只此一处）。
       此前这里还写了一遍 width:88px ＋ .hn{font-size:11px}，却被后一处 104px / 12.5px 覆盖
       ⇒ **注释写 88px、实际生效 104px**。那两条死规则已删（"同选择器不同值"正是结构体检在抓的）。 */
  .hcard.item .hb2{margin-top:2px}
  /* 「尽」角标在物卡上是**独立**的（小卡那套已随卡面撤掉） */
  .hcard.item .hone{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;
    font-size:9px;line-height:13px;vertical-align:1px;
    color:color-mix(in srgb,var(--danger) 78%,var(--ink));
    background:color-mix(in srgb,var(--danger) 15%,transparent);
    border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}

  /* 浮层里的携带物清单：每件一张小片，生效的给绿边，白带的压暗 ＋ 标「白带」。
     ⚠️ 这一组 class **只在 `sheetPerson` 用**（卡面已不画携带物）。 */
  .carrylist{display:flex;flex-wrap:wrap;gap:6px}
  .carrylist .carri{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
    border-radius:7px;border:1px solid var(--line);background:var(--raise);
    font-size:12.5px;color:var(--ink)}
  .carrylist .carri.on{border-color:var(--ok-line);
    background:color-mix(in srgb,var(--ok) 8%,var(--raise))}
  .carrylist .carri.off{opacity:.62}
  .carrylist .carri i{font-style:normal;font-size:10.5px;color:var(--muted)}
  .carrylist .carri b{font-family:var(--font-num);font-size:11.5px;color:var(--ok)}
  .carrylist .carri u{text-decoration:none;font-size:10px;color:var(--faint);
    border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .hr.bonus{gap:4px;margin-top:3px}
  /* ── 人物详情页的**四个物品卡槽**（2026-10-07 用户裁定）─────────────────
     · 从左到右四格，顺序 = `Person.items`（装填顺序）= **生效优先级**；
     · 卡槽**变绿 = 这件的加成正在生效**（前 2 件有加成的；与规则层 `effectiveItems` 同源）；
     · 物品卡可拖走（交给别人 / 收回自己），手上的物品卡可拖进来（交给他），
       槽与槽之间拖 = 换位（调整生效优先级）。
     ⚠️ 旧的 `.carrylist` 小片（文字条）**由这一组取代** —— 详情页不再画第二遍。 */
  .cslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .islot{position:relative;min-height:86px;border:1px dashed var(--line);border-radius:8px;
    background:color-mix(in srgb,var(--panel) 60%,transparent);
    display:flex;align-items:stretch;justify-content:center;padding:4px}
  .islot.empty{align-items:center;color:var(--faint);font-size:11px}
  .islot.on{border:1px solid var(--ok-line);border-style:solid;
    background:color-mix(in srgb,var(--ok) 10%,var(--raise));
    box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 30%,transparent)}
  /* 槽内那张物卡：占满卡槽（它是真卡，不是文字条） */
  .islot .icard{cursor:grab;width:100%}
  .islot .icard .hn{font-size:12px;font-weight:650}
  .islot .icard .hb2{font-size:10.5px;color:var(--muted);margin-top:2px}
  /* 生效那格的角标（绿点 ·「生效」两字太吵，一个色点 ＋ title 足够） */
  .islot.on::after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;
    border-radius:50%;background:var(--ok)}
  /* ── 固定功能事件（2026-10-07 用户裁定·第二批改版）─────────────────────
     医馆疗伤 / 神殿净化**不再塞在事件台里**，改成**地图上的常驻功能事件**：
     · 有人 hp/san 不满（1~2）才出现 ＋ 带全体未处理事件同款呼吸脉冲；
     · 点开是一张**功能单**：一个人物槽 ＋ 一个金币槽 ＋ 标题描述 ＋ ×/✔，
       **没有**处理方式按钮、**没有**叮嘱输入 —— 它不走 LLM，没有"方式"可选。
     ⚠️ 金币槽是**定额**（医馆 1 金 / 神殿 3 金）：拖金币卡进去即按定额记下，
        点一下取回 —— 与事件的钱槽同一套手势。 */
  .cvchip.fixv{border-left:3px solid var(--ok);cursor:pointer}
  .cvchip.fixv .cvt{font-family:var(--font-display);font-weight:600}
  .cvchip.fixv .cvd{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
  /* 功能单（点开地图上那张功能卡后的浮层内容） */
  .fixsheet .fxbut{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0}
  .fixsheet .fxslots{display:flex;gap:18px;align-items:flex-start;margin:12px 0 4px}
  .fixsheet .fxslot{width:132px;min-height:96px;border:1px dashed var(--line);border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:8px;position:relative;text-align:center}
  .fixsheet .fxslot.filled{border-style:solid;border-color:var(--ok-line);
    background:color-mix(in srgb,var(--ok) 8%,transparent)}
  .fixsheet .fxslot .flbl{font-size:11px;color:var(--faint)}
  .fixsheet .fxslot .reqnum{font-family:var(--font-num);font-size:22px;font-weight:650;color:var(--danger)}
  .fixsheet .fxslot .hg{font-family:var(--font-num);font-size:22px;font-weight:650}
  .fixsheet .fscard{font-weight:650;font-size:13px;line-height:1.3}
  .fixsheet .fssub{font-size:11px;color:var(--muted)}
  .fixsheet .fx{position:absolute;top:2px;right:6px;border:none;background:none;
    color:var(--muted);font-size:14px;cursor:pointer;padding:2px 4px}
  .fixsheet .fx:hover{color:var(--danger)}
  .fixsheet .fxslot.dropok{border-color:var(--ok-line);border-style:solid;
    background:color-mix(in srgb,var(--ok) 10%,transparent)}

  /* ── 手牌区左端的「我想做点什么」方格 ＋ 右端的双箭头（2026-10-07 用户裁定）──
     · 方格：与手牌卡同高的一块虚线格，常驻在卡带**左边** —— 自己创造事件的
       入口从页脚搬到这里（页脚那颗小按钮太不显眼，用户原话「手牌区左边应该是
       一个明显的『我想做点什么』的方格」）。
     · 翻页双箭头：卡带**右边**两枚按钮（2026-10-08 用户裁定：一枚改两枚）——
       ‹ 往前翻一页 · › 往后翻一页（手牌溢出时可来回翻看）。 */
  .hand-compose{flex:0 0 auto;align-self:stretch;width:96px;margin:2px 10px 6px 0;
    border:1.5px dashed var(--gold-line);border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--accent-2);background:var(--gold-soft);
    font-family:var(--font-display);font-size:12.5px;font-weight:650;line-height:1.4;text-align:center;
    padding:6px}
  .hand-compose:hover{border-color:var(--accent);color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,var(--gold-soft))}
  .hand-compose .hcplus{font-size:22px;line-height:1;font-weight:400}
  .hand-more{flex:0 0 auto;align-self:center;border:1px solid var(--line);border-radius:8px;
    width:30px;height:56px;margin-left:6px;cursor:pointer;color:var(--muted);
    background:var(--raise);font-size:16px;line-height:1}
  .hand-more:hover{color:var(--ink);border-color:var(--accent)}
  /* ═══════════════════════════════════════════════════════════════════
     事件处理台 —— **浮层**（2026-10-06 用户裁定）
     ─────────────────────────────────────────────────────────────────
     用户裁定：「点开后应该是在**画面中间有一个额外的弹窗区，在地图层上方**，
     而不是显示在地图层上面」。
     ⚠️ 2026-10-05 它一度是「中栏同屏」，理由是「手牌带要保持可见可拖」；
     2026-10-06 改成「浮层里自带一块迷你卡带」，**2026-10-07 整块撤回** ——
     同一批卡在屏幕上出现两次、卡片竖着堆成一列、还白吃 122px（矮屏上正缺这 122px）。
     ⇒ 那条目标现在由**布局本身**达成：浮层只占上 2/3，下面 1/3 的手牌带就露在外面。
     ⚠️ 底下**半透明** ⇒ 玩家仍看得见地图与那一堆事件块，不丢方位感。
     ═══════════════════════════════════════════════════════════════════ */
  .evdeskmodal{position:relative;max-width:min(1180px,94vw);max-height:92vh;overflow:auto;
    background:color-mix(in srgb,var(--panel) 96%,transparent);
    backdrop-filter:blur(6px);border:1px solid var(--gold-line);border-radius:14px;
    box-shadow:var(--sh-3);padding:14px 16px 12px}

  /* ═══════════════════════════════════════════════════════════════════
     变化演出（2026-10-06 · 用户裁定「避免静默的状态变化」）
     ─────────────────────────────────────────────────────────────────
     ⚠️ **替身走最上层**（`z-index:70`）—— 用户要求"事件处理时手牌区、
        声望区、未入队人物区都不隐藏，好让动画正常显示"；
        而结算浮层／档 A 弹窗仍会盖住卡带 ⇒ 只有走最上层才演得出来。
     ⚠️ **只动 transform/opacity** —— 绝不引发布局重排（那会让整页抖一下）。
     ⚠️ `prefers-reduced-motion` 下**全部不演**，但**终态保留**
        （那一次亮一下还在，否则用户会觉得"什么都没发生"）。
     ═══════════════════════════════════════════════════════════════════ */
  .fly{position:fixed;z-index:70;pointer-events:none;
    display:flex;align-items:center;justify-content:center;text-align:center;
    border-radius:8px;padding:2px 5px;overflow:hidden;
    font-size:11px;line-height:1.2;font-family:var(--font-display);
    animation:flyMove 900ms var(--ease) both;
    box-shadow:var(--sh-2)}
  @keyframes flyMove{
    0%{transform:translate(0,0) scale(.5);opacity:0}
    16%{opacity:1;transform:translate(0,0) scale(1.06)}
    78%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.55);opacity:0}}
  .fly-person{background:linear-gradient(160deg,var(--raise),var(--panel));
    border:1px solid var(--gold-line);color:var(--ink)}
  .fly-item{background:linear-gradient(160deg,var(--accent),var(--accent-2));
    border:1px solid var(--gold-line);color:var(--panel);font-weight:600}
  /* 离队 ＝ 飞到未入队区（**卡面不变灰** —— 他还能拉回来）*/
  .fly-person.leavefly{border-color:var(--warn-line);color:var(--warn)}
  /* 离册（真没了）＝ 灰掉飞走，与离队**明确不同** */
  .fly-person.gonefly{filter:grayscale(1) brightness(.6);border-color:var(--danger)}
  .fly-item.lostfly{filter:grayscale(1) brightness(.7)}
  /* 撕毁 ＝ 撕开两半 ＋ 错开（消耗）—— 与"失去"的灰掉飞走**明确不同** */
  .fly.torn,.fly-item.tornfly{animation:tear 900ms var(--ease) both}
  @keyframes tear{
    0%{transform:translate(0,0) rotate(0);opacity:0}
    14%{opacity:1}
    46%{transform:translate(calc(var(--dx) * .3),calc(var(--dy) * .3 + 6px)) rotate(-5deg)}
    100%{transform:translate(calc(var(--dx) * .5),calc(var(--dy) * .5 + 26px)) rotate(11deg) scale(.6);opacity:0}}
  .torn{position:relative}
  .torn::after{content:'';position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 46%,var(--danger) 48%,var(--danger) 52%,transparent 54%);
    animation:tearLine 620ms var(--ease) both}
  @keyframes tearLine{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}

  /* 兜底提示：落点不在（折叠区/屏幕外）时的那一句。
     ⚠️ **屏幕正中偏上**，不挡手牌带与中栏（玩家此刻的眼睛在那两处）。
     ⚠️ 1.6 秒后自己走掉（用户裁定「就淡出」）—— 不留关闭钮、不进历史。 */
  .chgtoasts{position:fixed;left:50%;top:16%;transform:translateX(-50%);
    z-index:72;pointer-events:none;max-width:min(520px,84vw);
    background:var(--panel);border:1px solid var(--gold-line);border-radius:9px;
    padding:7px 15px;font-size:13px;color:var(--ink);text-align:center;
    box-shadow:var(--sh-2);animation:toastIn 260ms var(--ease) both}
  .chgtoasts.out{animation:toastOut 480ms var(--ease) both}
  @keyframes toastIn{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}
  @keyframes toastOut{0%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
  /* ⚠️⚠️ 2026-10-08（用户第 3 条）：**欲望面板首次自动弹出的引导 toast** ——
     不在屏幕正中，而是**欲望弹窗左侧**（`render()` 末尾实量 `#modal` 左缘后内联定位）。
     ⚠️ 必须另起一对 keyframes：`toastIn/Out` 的 transform 里都带 `translate(-50%,…)`，
       而 `.desirehint` 的定位不走"left:50% ＋ translateX"那套 ⇒ 套用会把 toast 拽偏半个身位。 */
  .chgtoasts.desirehint{left:auto;transform:none;text-align:left;
    animation:desireHintIn 260ms var(--ease) both}
  .chgtoasts.desirehint.out{animation:desireHintOut 480ms var(--ease) both}
  @keyframes desireHintIn{0%{opacity:0}100%{opacity:1}}
  @keyframes desireHintOut{0%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    /* ⚠️ 减少动效时**保留那一句**（不演动画 ≠ 不告诉玩家）—— 只是不淡入淡出。 */
    .chgtoasts{animation:none}.chgtoasts.out{animation:none;opacity:0}
    .chgtoasts.desirehint{animation:none}.chgtoasts.desirehint.out{animation:none;opacity:0}}

  /* 到站弹一下（.arrive 挂 1400ms）*/
  .hcard.arrive{animation:arrivePop 1400ms var(--ease) both}
  @keyframes arrivePop{
    0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
    16%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 0%,transparent);
       transform:translateY(-4px) scale(1.04)}
    100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent);transform:none}}
  /* 状态变化：坏（死亡/疯狂）用红，好一点（重伤/濒死）用黄 */
  .hcard.flash-bad{animation:flashBad 1500ms var(--ease) both}
  .hcard.flash-warn{animation:flashWarn 1500ms var(--ease) both}
  @keyframes flashBad{
    0%,100%{box-shadow:var(--sh-1);border-color:var(--line)}
    22%{box-shadow:0 0 0 5px color-mix(in srgb,var(--danger) 42%,transparent);
       border-color:var(--danger);filter:grayscale(.5)}}
  @keyframes flashWarn{
    0%,100%{box-shadow:var(--sh-1);border-color:var(--line)}
    22%{box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 40%,transparent);
       border-color:var(--warn-line)}}
  /* 离队途中：轻微压暗 ＋ 往未入队方向偏（**不变灰** —— 他还能拉回来）*/
  .hcard.leaving{animation:leaveShift 1400ms var(--ease) both}
  @keyframes leaveShift{
    0%{transform:none;opacity:1}
    30%{transform:translateX(14px) scale(.9);opacity:.72}
    100%{transform:none;opacity:1}}
  /* 数值变化：亮一下那一处（涨绿跌红 —— 与 `.mdb` 那套同一口径）*/
  .flash-up{animation:numUp 1500ms var(--ease) both}
  .flash-down{animation:numDown 1500ms var(--ease) both}
  @keyframes numUp{
    0%,100%{background:transparent;box-shadow:none}
    20%{background:color-mix(in srgb,var(--ok) 22%,transparent);
       box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}}
  @keyframes numDown{
    0%,100%{background:transparent;box-shadow:none}
    20%{background:color-mix(in srgb,var(--danger) 20%,transparent);
       box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 16%,transparent)}}
  @media (prefers-reduced-motion:reduce){
    .fly,.hcard.arrive,.hcard.flash-bad,.hcard.flash-warn,
    .hcard.leaving,.flash-up,.flash-down{display:none!important}}
    /* ⚠️ 可跳过动画时**保留那一下亮**（`outline` 不受 animation 影响）——
       否则"减少动效"的用户会以为什么都没发生。 */

  /* ── 携带物：贴在人卡下面的一排小卡（2026-10-06）──────────────────────
     用户裁定：「物品卡缩小插入到了对应人物卡上」——
     落在**卡面之内**（不是卡带上的另一段）才是"插在人物卡上"。
     ⚠️ 缩到 **58px 宽**：能读出名字，又能看出"这是附属于他的"。
     ⚠️ **生效的那两件给亮边、白带的压暗** —— 否则玩家不知道 `BONUS_CAP`
        到底让哪两件算数（那正是他换装的依据）。 */
  .carryrow{display:flex;gap:4px;margin-top:5px;padding-top:5px;
    border-top:1px dashed var(--line);width:100%}
  .hcard.mini{width:58px;min-height:34px;border-radius:6px;padding:3px 4px;
    display:flex;flex-direction:column;justify-content:center;gap:1px;
    box-shadow:none;background:var(--raise)}
  .hcard.mini[data-kind]{cursor:grab}
  /* 「尽」：它**有次数**（跟他办完一件事就用掉）。
     ⚠️ 暗红底 ＋ 小一号 —— 与绿底的加成行、灰底的「白带」三者一眼分得开。 */
  .hcard.mini .hone{display:inline-block;margin-left:3px;padding:0 3px;border-radius:3px;
    font-size:8.5px;line-height:12px;color:color-mix(in srgb,var(--danger) 78%,var(--ink));
    background:color-mix(in srgb,var(--danger) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);vertical-align:1px}
  .hcard.mini .hn{font-size:9.5px;line-height:1.2;color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
  .hcard.mini .hb2{font-size:8.5px;line-height:1.1;color:var(--ok);
    font-family:var(--font-num);display:flex;align-items:center;gap:2px}
  /* 生效中：亮边（留得住眼睛） */
  .hcard.mini.eff{border-color:var(--ok-line);
    background:color-mix(in srgb,var(--ok) 9%,var(--raise))}
  /* 白带：压暗 + 虚线（"它跟着他，但不起作用"） */
  .hcard.mini.noeff{opacity:.5;border-style:dashed}
  .hcard.mini.noeff .hb2{color:var(--faint);text-decoration:line-through}
  @media (prefers-reduced-motion:reduce){.hcard.mini{transition:none}}

  /* 「只有 2 件算数」：小字提示，告诉他白带了几件（不红——那不是错误） */
  .hr.cap{margin-top:2px;font-size:10px;color:var(--faint);letter-spacing:.04em}
  .ab{display:inline-flex;align-items:center;gap:2px;padding:0 5px;border-radius:4px;
    font-size:10.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
  .ab .sigil{color:var(--ok)}
  .ab b{font-family:var(--font-num);font-weight:600}
  @media (prefers-reduced-motion:reduce){.islot.on{box-shadow:none}}

  /* 「没了的人」（2026-10-05）：**留在卡带上，但完全不能操作**。
     ⚠️ 灰得足够狠（去饱和 ＋ 压暗 ＋ 名字划掉）—— 半灰的卡会被读成"他还能用，只是不好"，
        而"他没了"必须读成**不可逆**。
     ⚠️ `pointer-events:none` 是**第二道**保险：第一道是 `handCard` 不给 `data-act`
        （拖拽与点开都按不住），这里再堵一层"连 hover 都别响应"。 */
  .hcard.gone{filter:grayscale(1) brightness(.62);opacity:.5;cursor:default;
    pointer-events:none;border-style:dashed;box-shadow:none}
  .hcard.gone .hn{text-decoration:line-through;text-decoration-color:var(--faint);
    text-decoration-thickness:1px}
  .hcard.gone .hdead{font-size:10.5px;color:var(--faint);text-decoration:none;
    letter-spacing:.08em}
  /* 卡带里那一行「没了的 N」—— 它是**分隔**,不是按钮: 不可点,只是让那段灰卡有归属 */
  .hand-gonehead{flex:0 0 auto;align-self:center;padding:0 4px 0 10px;
    font-size:11px;color:var(--faint);letter-spacing:.14em;cursor:default;
    writing-mode:vertical-rl;text-orientation:upright;user-select:none}
  /* HP 条：卡面最下面一道细线（数字在点开里，卡面只给"他还好不好"）*/
  .hcard .hphp{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line-soft)}
  .hcard .hphp i{display:block;height:100%;background:var(--ok)}
  .hcard.hurt .hphp i{background:var(--danger)}

  /* ── 金币卡（2026-10-05）─────────────────────────────────────────────
     与人卡**同一种形状**（同一个 `.hcard`）—— 用户裁定「统一为卡牌」，
     而"统一"的要点是**它们躺在同一条带上、用同一种手拿**。
     ⚠️ 卡面**大数字在下部**：上部说"这是什么"，下部说"有多少"。
        数字小到 10px 就读不出来了，而它恰恰是拖之前唯一要读的信息。 */
  .hcard.gold{width:88px;min-height:104px;justify-content:flex-start;
    border-left:3px solid var(--gold-line);background:
    linear-gradient(168deg,color-mix(in srgb,var(--accent) 13%,var(--raise)),var(--raise) 62%)}
  .hcard.gold .hn{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;
    color:var(--accent-2);text-align:center}
  .hcard.gold .hg{margin-top:auto;font-family:var(--font-num);font-size:26px;font-weight:600;
    line-height:1;color:var(--accent);text-align:center;padding-bottom:4px;
    font-variant-numeric:tabular-nums}
  /* ⚠️ 0 金**不隐藏这张卡** —— 它变灰、只留一个 0。
     理由：金币是很多事的硬约束，"我一枚也没有"是玩家必须**看见**的事实。 */
  .hcard.gold.zero{filter:grayscale(.7) brightness(.8);opacity:.6}
  .hcard.gold.zero .hg{color:var(--faint)}
  /* 拖拽中的幽灵：金币卡要**跟着指针走一张卡**，而不是一行字（与人物卡同一条路）*/
  .dragghost.hcard.gold{width:88px;min-height:104px}

  /* 物卡：与人卡**同一种形状**，只是窄一点（东西没有"身份"要写）。
     ⚠️⚠️ **物卡的尺寸只有这一处**（2026-10-07 合并）：宽 104px（人卡基类 .hcard 是 112px），
       不随名字长短变 —— 否则卡带上长短不齐、很难扫。padding 原写在文件上半截，一并搬来。
       （合并前的实际结果一直是后者赢，所以**画面一个像素都没变**，只是把真值收成一处。） */
  .hcard.item{width:104px;min-height:96px;padding:6px 6px 5px}
  /* 三类物品各有色边 —— 那是"用途"的分档（能穿的 / 能用的 / 说不清的），
     玩家要能一眼分清，而不是读完三行小字才知道。 */
  .hcard.item .hi{display:flex;align-items:center;gap:4px}
  .hcard.item .hi .sigil{flex:0 0 auto}
  .hcard.item.k装备{border-left:3px solid var(--blue)}
  .hcard.item.k消耗品{border-left:3px solid var(--ok)}
  .hcard.item.k特殊物品{border-left:3px solid var(--purple)}
  .hcard.item .hn{font-size:12.5px;line-height:1.25;margin:0}

  /* 卡带右端的折叠钮：「未入队 N」—— 默认收起，不占最好的位置 */
  .hand-fold{flex:0 0 auto;display:flex;align-items:center;padding:0 10px;
    border:1px dashed var(--line);border-radius:10px;cursor:pointer;
    color:var(--muted);font-size:12px;white-space:nowrap;
    transition:border-color var(--t) var(--ease),color var(--t) var(--ease)}
  .hand-fold:hover{border-color:var(--gold-line);color:var(--accent)}

  /* 「这一局」固定块：命题入口。**只给一行命题**，其余点开。 */
  .hand-quest{flex:0 0 auto;width:186px;display:flex;flex-direction:column;justify-content:center;
    gap:4px;padding:8px 11px;background:var(--raise);
    border:1px solid var(--hint-line);border-radius:10px;cursor:pointer;
    transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
  .hand-quest:hover{border-color:var(--gold-line);background:color-mix(in srgb,var(--accent) 8%,var(--raise))}
  .hand-quest .hq-l{font-size:10.5px;color:var(--faint);letter-spacing:.2em}
  .hand-quest .hq-p{font-size:12.5px;color:var(--ink-soft);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hand-quest .hq-c{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
  .hand-quest .hq-c .tag{font-size:10.5px;padding:0 6px}

  /* ── 底栏（2026-10-05 · 主次分明）──────────────────────────────────
     ⚠️ 原来「进下一天」和「保存并退出」是**同样大小**的两颗按钮并排站着
        （`UI借鉴-苏丹的游戏.md` §2 早就点出来过：「它是当天唯一那个大按钮」）。
        现在把三组动作按"今天有多重要"分层：
          · 主决策（右）：**进下一天** —— 当天唯一那个推进阀，最大
          · 随手的（左）：拨钟 / 我想做点什么 —— 中等
          · 出口（最右）：保存并退出 / 直接结算 —— 最小、最不显眼
        顺序与 `renderFooter` 的**内容**一字未改，只改权重与间距。 */
  footer{
    display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
    padding:10px 18px;background:var(--panel);border-top:1px solid var(--line);
    box-shadow:var(--sh-1);
  }
  footer .sp{flex:1}
  /* 出口那组：靠一道竖线与"今天"分开（它们是**离开**，不是**推进**）*/
  footer .exits{display:flex;align-items:center;gap:8px;padding-left:14px;
    border-left:1px solid var(--line-soft)}

  /* 上帝视角（默认收起 · 从页脚打开）—— 开发读数一律收在这里，玩家面上不出现 */
  #godpanel{display:grid;grid-template-columns:220px minmax(0,1.7fr) minmax(0,1fr);gap:14px;
    padding:0 16px 12px;align-items:start;background:var(--bg)}
  #godpanel.hidden{display:none}
  /* 开发面用**更暗**的一面：一眼就能看出"这不是玩家看的东西" */
  #godpanel .card{background:var(--sunken);border-color:var(--line-soft)}
  .lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .lanes h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}

  /* 提示条 */
  #banner{margin:14px 16px 0;display:flex;flex-direction:column;gap:7px}
  .msg{border-radius:9px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);
    line-height:1.6;animation:msgIn var(--t-slow) var(--ease) both}
  .msg.err{border-color:var(--warn-line);background:var(--danger-soft);color:var(--warn-ink)}
  .msg.ok{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-ink)}

  /* ── 弹窗（档 A 强制弹窗 / 结算 / 详情）────────────────────────────
     ⚠️ 暗底上遮罩不能只是压暗（**已经**很暗了，压不暗）：改用**模糊** ＋
        一点暖色投影 —— 模糊让"背后的世界还在，但暂时不属于你"这件事成立。 */
  #overlay{position:fixed;inset:0;background:var(--overlay);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:auto;
    animation:fadeIn 240ms var(--ease) both}
  #overlay.hidden{display:none}

  /* ── 贴地图上方的浮层（2026-10-07 用户裁定第 4 条 · 补做）──────────────
     ⚠️⚠️ **用户第 4 条明说：「事件点开时，手牌区应当在可以互动的图层，
        如果我点开事件但手牌区不可选中那么我怎么拖拽卡牌？？」**
        此前事件台与「你的欲望」都走 `#overlay`（`inset:0` 全屏 ＋ 模糊 ＋ z-index:50）
        ⇒ **整块遮罩把手牌区也盖住了**，凭证卡/人卡根本拖不出来。
        ⇒ 现在这一类浮层改走 `#overlay.top`：
          · **只占上面 2/3**（`bottom:33%`），下 1/3 永远留给手牌区；
          · **背景不遮**（`--overlay` 换成一个几乎透明的值 ＋ **不模糊**），
            玩家仍看得见底下那一堆事件块，不会失去方位感（《苏丹》也是这个路子）；
          · **`z-index` 抬到 60**（盖住地图区那一层），而**手牌区不设 z-index**
            —— 手牌区在文档流上更靠后（同为 `position` 且 `z-index:auto`）
            ⇒ 这条"手牌区可交互"**由布局顺序保证**，不是靠调 z-index 试出来的。
     ⚠️ **档 A 强制弹窗 / 结算正文仍走原样 `#overlay`** —— 那两类是"必须打断"的，
        它们占满全屏是对的；只有"可以边看边拖"的那两类走 `.top`。
     ⚠️ z-index 那一行是**上一轮的教训**：抬高 `#hand` 会让浮层半透明处
        误点到底下的事件块 ⇒ 不抬它，改抬浮层。 */
  /* ⚠️⚠️ 2026-10-07 清单第 2 条：**背景染色撤掉**。
     此前是 `color-mix(var(--bg) 30%, transparent)` —— 它把底下那片空台面染成
     一条**淡黄横带**（用户截图里"事件卡和手牌中间奇怪的黄色条带"就是它）：
     卡片盖住的地方看不见它，卡片没盖住的那一缝就只剩这条色带 ⇒ 观感极怪。
     ⇒ 改成**全透明**：底下的地图原样透出来，没有"多出来的一层色"。
  ⚠️ 清单第 2/3 条：**四周留白加大**（18/26/14，原 14/20/8）——
     事件卡不再贴着屏幕边与浮层边。 */
  /* ⚠️⚠️ 2026-10-07（用户第 1 条）：上下边界改由 `render()` **实量**写入的
     `--ovtop`（顶栏高，声望系统住那儿）与 `--ovbottom`（页脚＋手牌区高）——
     事件卡在**任何**屏高下都让开这两块，不再靠猜出来的固定值
     （148px 那档在"手牌＋页脚 > 148px"的机器上就是遮住手牌的根源）。 */
  #overlay.top{inset:0 0 var(--ovbottom, max(148px,17vh)) 0;align-items:flex-start;
    padding:calc(var(--ovtop, 52px) + 8px) 26px 14px;
    background:transparent;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    z-index:60;overflow:hidden}
  /* ⚠️ 2026-10-07 用户裁定：事件卡**可以向下（往手牌区）拉长** —— 底边不再钉在 67vh，
     只需让开**页脚 ＋ 手牌区**（≈150px；17vh 在高屏上再多让一点，呼吸更匀）。
     所有走 `.top` 的立体横线卡（事件台／你的欲望／尚未入队／各手牌浮层）一并变高。 */
  /* 里面那层卡：**不再强制铺满全宽**（清单第 1/3 条：浮层太大、盖住左侧
     「你的欲望／尚未入队」那两块）⇒ 宽度收在内容自己的 max-width 里、
     **靠右放**（`margin-left:auto`），左边让出 `.mapcorner` 那一条；
     那两块的"变灰不可点"由 `body.ovtop` 负责（见下）。
     ⚠️ 事件台不自己滚动（滚动交给内部两栏）；「你的欲望」那一屏**自己滚** ——
     四行卡槽 ＋ 四段平铺比 67vh 高 ⇒ 此前 `overflow:hidden` 把下面几行**直接裁掉**
     （用户第 3 条"图像层被吃掉了一些"就是这个），改 `overflow-y:auto` 后滚得到。 */
  #overlay.top #modal{width:auto;max-width:100%;overflow:hidden;
    max-height:100%;align-self:stretch;margin-left:auto}
  /* ⚠️⚠️ 2026-10-07（用户第 1 条）：事件台**去掉外面那层** ——
     此前是双层框：`#modal` 一层（红边 ＋ 20px 内衬）＋ 里面 `.card.ev` 又一层
     （金边 ＋ 内衬）⇒ 四边各白白吃掉 30px+，还读成"两个框"。
     ⇒ `#modal` 自己变成**唯一**那层金框（细边、小内衬），
       事件台的内容直接贴着它排 —— 省下的空间全给卡槽与正文。
     ⚠️ `--ovtop` / `--ovbottom` 由 `render()` 量出（顶栏高 / 页脚＋手牌区高）：
       事件卡**永远**让开上面的声望区（顶栏）与下面的手牌区，不再靠猜固定值。 */
  #overlay.top #modal.evdeskmodal{display:flex;flex-direction:column;
    max-width:min(1180px,100%);
    border:1px solid var(--gold-line);border-left-width:1px;
    background:var(--panel);box-shadow:var(--sh-3);padding:12px 16px}
  #overlay.top #modal.evdeskmodal > .evdesk{flex:1 1 auto;min-height:0}
  /* 「你的欲望」那一屏：宽度回到自己的 820px（不再被"横向铺满"撑成整条），
     且**自身可滚**。`outmodal`（尚未入队）照旧比它宽一档。 */
  #overlay.top #modal.sheetmode{max-width:min(820px,100%);overflow-y:auto;
    overscroll-behavior:contain}
  #overlay.top #modal.sheetmode.outmodal{max-width:min(920px,100%)}
  /* 宽屏（≥1080）：两类浮层都给左侧让出 `.mapcorner`（292 ＋ 台面 12 ＋ 呼吸 40）那一条 ——
     「你的欲望／尚未入队」两块**全程可见**（只是变灰），玩家不会失去方位感。 */
  @media (min-width:1080px){
    #overlay.top #modal.evdeskmodal{max-width:min(1180px,calc(100% - 344px))}
    #overlay.top #modal.sheetmode{max-width:min(820px,calc(100% - 344px))}
  }
  /* 浮层开着时，左上角那两块常驻卡**变灰不可点**（清单第 3 条用户原话：
     "只不过两者颜色都变灰表示不能再点击"）。`ovtop` 由 renderOverlay 同步。 */
  body.ovtop .mapcorner{opacity:.45;filter:grayscale(.6);pointer-events:none;
    transition:opacity var(--t) var(--ease),filter var(--t) var(--ease)}

  /* ── 结局全屏层（2026-10-06 用户裁定：「为结局做**专门的全屏动画**，而不是简单的弹窗」）──
     ⚠️ **为什么不用 `#overlay` 那套**：那一套是"**遮挡**世界"（模糊 ＋ 压暗 ＋ 卡片居中），
        适合弹窗；结局是"**这一局结束了**" ⇒ 它该**接管整个屏幕**、把世界收进暗里再放开。
        ⇒ 独立一套：全屏 ＋ 更慢的淡入 ＋ 逐段浮现。
     ⚠️ **两路都走这里**（成功与失败 alike）：判定一落账就播，**不等 LLM** ——
        失败结局是系统预写话术，成功结局的判词后到（见 `endingTwoStage` 的两段式）。
     ⚠️ `z-index:90`（高于 `#overlay` 的 50）⇒ 结局期间**任何弹窗都压不过它**。 */
  #endingscreen{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:6vh 24px;text-align:center;
    background:radial-gradient(ellipse at 50% 42%,var(--ending-glow) 0%,var(--ending-bg) 62%);
    animation:endingFade 900ms var(--ease) both;overflow:auto}
  #endingscreen.hidden{display:none}
  /* 标题：先出（判出成功那一刻就有值 —— 2026-10-06 起标题由规则层写定，不等 LLM） */
  #endingscreen .es-kicker{font-size:12px;letter-spacing:.34em;color:var(--muted);
    text-indent:.34em;animation:esRise 700ms var(--ease) both}
  #endingscreen .es-title{font-family:var(--font-display);font-size:clamp(30px,6.2vw,54px);
    line-height:1.24;color:var(--accent);margin:14px 0 0;letter-spacing:.05em;
    animation:esRise 900ms 160ms var(--ease) both}
  #endingscreen .es-sub{font-size:12.5px;color:var(--muted);margin-top:12px;
    animation:esRise 700ms 420ms var(--ease) both}
  /* 正文：逐字浮现（长文本必须可跳过 ⇒ `.es-skip` 那个提示一直在） */
  #endingscreen .es-text{max-width:62ch;margin-top:30px;font-size:16px;line-height:2.05;
    color:var(--ink);text-align:left;white-space:pre-wrap;
    animation:esRise 1000ms 620ms var(--ease) both}
  #endingscreen .es-text.es-typing > span{opacity:0}
  #endingscreen .es-text.es-typing > span.on{opacity:1;transition:opacity .5s linear}
  /* 落定后的细线 ＋ 提示（那两个"结局名/风味"这类系统词一律不进这一屏） */
  #endingscreen .es-rule{width:76px;height:1px;background:var(--gold-line);margin:26px auto 0;
    animation:esGrow 760ms 300ms var(--ease) both}
  #endingscreen .es-skip{margin-top:30px;font-size:11.5px;letter-spacing:.16em;color:var(--muted);
    animation:esRise 600ms 1200ms var(--ease) both}
  /* 出口（2026-10-07 用户裁定）：看完结局回标题屏。按钮用全局那套，只是给它让出呼吸位 */
  #endingscreen .es-exits{margin-top:34px;animation:esRise 700ms 1400ms var(--ease) both}
  #endingscreen .es-exits button{min-width:148px}
  /* 失败结局换一种金调（不必是"失败"，但**不该和成功长得一样**） */
  #endingscreen.es-fail .es-title{color:var(--muted)}
  #endingscreen.es-fail .es-rule{background:var(--line)}
  @keyframes endingFade{from{opacity:0}to{opacity:1}}
  @keyframes esRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes esGrow{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    #endingscreen,#endingscreen .es-kicker,#endingscreen .es-title,
    #endingscreen .es-sub,#endingscreen .es-text,#endingscreen .es-rule,#endingscreen .es-skip
      {animation-duration:1ms!important;animation-delay:0ms!important}
    #endingscreen .es-text.es-typing > span{opacity:1!important}
  }

  /* ⚠️⚠️ 2026-10-06 用户裁定（问题 4：「欲望觉醒事件，为什么**事件显示划不上去**？」）：
     `#overlay` 有 `overflow:auto`，**但它救不了这个** ——
     `#modal` 自己**没有 `max-height`、也没有 `overflow`** ⇒ 它会撑到内容的全高，
     整块比视口还高 ⇒ 滚轮在它上面**滚不动**（内容没有任何可滚的容器）。
     ⇒ 改成：**限高 ＋ 自身滚动**（`max-height:88vh; overflow-y:auto`）。
     ⚠️ 用 `dvh` 兜一下移动端浏览器地址栏（`vh` 会把地址栏算进视口）。
     ⚠️ `overscroll-behavior:contain` ＝ 滚到底**不**把整页一起带着滚。 */
  #modal{background:var(--panel);border:1px solid var(--danger);border-left:3px solid var(--danger);
    border-radius:14px;max-width:640px;width:100%;padding:20px 22px;
    max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
    box-shadow:var(--sh-4),var(--sh-5);
    /* 进场：从下方 12px 淡入上移 ＋ 极轻的缩放 —— 电影里"东西落到面前"的读感 */
    animation:modalIn var(--t-slow) var(--ease) both}
  /* 弹窗标题用衬线（暗底上它是这块区域最大的字，辨识度收益最明显） */
  #modal h2{font-family:var(--font-display);color:var(--danger);font-size:18px;margin-bottom:6px;
    letter-spacing:.04em}
  #modal .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:9px 14px}

  /* ── 这一屏里三段文字的**权重**（2026-09-24 用户裁定）────────────────
     原话：「事件本身的描述、结算文字、玩家选项都很重要，你现在的比例和渲染设置
     反而让**选项过度突出**」。
     量出来的旧账：`.body` 在 `#modal` 里**一条规则都没有**（`.ev .body` 要求祖先带
     `.ev`，而弹窗里不是那个祖先）⇒ 事件正文与选项文字**同字号同色**；而选项是
     **满宽带框按钮** ⇒ 一张卡里面积最大、色块最重的恰恰是选项，选中的那条还
     金底 ＋ 金框 ＋ 加粗 ＋ 换色，**四重强调**叠在一起。
     新序：**正文（主）＞ 结算（次，但要读得清）＞ 选项（最轻）**。

     处理完的那张卡（2026-09-23 用户裁定「**保留事件页面 ＋ 玩家处理方式**」）：
     选项列表**留在原地**，只把玩家当时选的那一项挑出来 —— 其余的淡下去。
     刻意**不是**"只显示选中的那一条"：玩家要看得见"我当时是在这几个里选的"。
     ⚠️ 「回看态」与「还在等你点」靠 **`data-act` 的有无**分开（`handledHtml` 顶上
        那段注释已声明"选项不带 data-act"）⇒ **可点的档 A 选项照旧是满宽按钮**、
        一点没变弱；这里下药的只是"回看"。 */
  #modal .body{font-size:14.5px;line-height:1.8;color:var(--ink);margin:8px 0}
  #modal .opt:not([data-act]){
    width:max-content;max-width:100%;margin-top:4px;padding:2px 8px 2px 10px;text-align:left;
    border:0;border-left:3px solid var(--line);border-radius:0;background:transparent;color:var(--muted);
  }
  /* ⚠️ 回看态**不该有可点的暗示** ⇒ 把全局那条 `button:hover` 的金底盖掉 */
  #modal .opt:not([data-act]):hover{border-color:transparent;border-left-color:var(--line);background:transparent}
  #modal .opt:not([data-act]).picked{border-left-color:var(--accent-2);background:var(--gold-soft);color:var(--ink);font-weight:600}
  #modal .opt:not([data-act]).picked:hover{background:var(--gold-soft);border-left-color:var(--accent-2)}
  #modal .opt:not([data-act]).dim{opacity:.55}
  #modal .res{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px;color:var(--ink)}
  #modal .res .sub{font-size:11.5px;letter-spacing:.05em}
  #modal .res > div:last-child{font-size:14px;line-height:1.8}
  /* 结算正文**逐段浮现**（2026-10-05 · 学《苏丹》那段"文字一行行出现"）
     ⚠️ 拆的是**句**不是字：按 `.。！？` 断句。逐字浮现会让人读到一半被打断
        （那是有损的 —— 玩家读到"他犹豫了一"就被迫去看下一个字）。
     ⚠️ 每段 90ms 错开、上限 1.2s：段落多的结算也不该让玩家干等。 */
  #modal .res .resline{--seg:0}
  #modal .res .resline{animation:none}
  .segline{display:block;animation:fadeUp 420ms var(--ease) both;
    animation-delay:calc(180ms + var(--seg) * 90ms)}
  /* 叙事正文的美观三件套（2026-10-08 用户裁定「文字显示尽量美观清晰」）：
     · **两端对齐**（justify ＋ 末行回落左对齐）—— 中文方块字天然适合两端对齐，
       消掉右侧"长长短短参差不齐"的锯齿边；短句整段是"末行" ⇒ 照旧左对齐，不受影响；
     · **句段呼吸感** —— 逐句浮现的每句之间垫 .2em，读起来一句是一句；
     · 行首禁则已由全局 `line-break:strict` 兜底（见 body）。 */
  #modal .body,#modal .res .segline,.ev .body,.prose{text-align:justify;text-align-last:left}
  .segline + .segline{margin-top:.2em}
  /* ── 资源增减的演出（2026-10-05）────────────────────────────────────
     ⚠️ 涨跌用**颜色 ＋ 形状**（▲▼）两重编码 —— 只靠颜色的话，色觉障碍玩家读不出方向。
     ⚠️ 逐条错开出现：一次给六个「+3」会读成一团，逐条来才读得清"涨了哪些"。 */
  .meters{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;
    padding-top:11px;border-top:1px dashed var(--line)}
  .mdl{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:7px;
    background:var(--raise);border:1px solid var(--line);white-space:nowrap;
    animation:chipIn2 var(--t-slow) var(--ease) both;
    animation-delay:calc(240ms + var(--i,0) * 80ms)}
  .mdl.up{border-color:var(--ok-line);color:var(--ok)}
  .mdl.dn{border-color:var(--warn-line);color:var(--danger)}
  .mdk{font-size:12px;color:var(--muted)}
  .mdl.up .mdk,.mdl.dn .mdk{color:inherit;opacity:.85}
  .mddir{font-size:9px;line-height:1}
  .mdb{font-family:var(--font-num);font-size:16px;font-weight:600;line-height:1}
  .mdabs{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  @keyframes chipIn2{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
  /* ⚠️ 2026-10-07（用户裁定）：六维属性的变化**不做动画** —— 就在结算卡上写
     「谁谁谁 某属性 +x」的小字。与 `.meters` 同一张卡、同一条分隔线之下，
     更淡一档：它是"附带的说明"，不是主事件。 */
  .attrlines{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:8px;
    font-size:11.5px;color:var(--muted)}
  .acline b{color:var(--ink);font-weight:600}
  .acline{font-variant-numeric:tabular-nums}

  /* ═══════════════════════════════════════════════════════════════════
     判定盘（2026-10-05 · 学《苏丹》左盘右纸的对位）
     ─────────────────────────────────────────────────────────────────
     它只回答「这次成没成」；「发生了什么」是右边那叠纸的事。
     ⚠️ **一屏放不下时它整个消失**，不留空框 —— 空盘会被读成"页面坏了"。
     ⚠️ 盘面用**横向一行**（不是竖排）：竖排会把浮层撑得比视口还高。
     ═══════════════════════════════════════════════════════════════════ */
  /* ═══════════════════════════════════════════════════════════════════
     骰子动画弹窗（2026-10-07 · 左骰右纸）
     ─────────────────────────────────────────────────────────────────
     左 1/2＝骰区（点击投掷）：黄 d20 ＋ 灰惩罚 d4 ＋ 白奖励 d4；
     右 1/2＝处理信息（事件标题 ＋ 处理者卡槽 ＋ 判定属性 ＋ 骰况 ＋「查看结算结果」）。
     ⚠️ 骰色是**玩家指定的道具色**（黄/灰/白），不随主题换 —— 换了就不是那三种骰了。
     ⚠️ 动画三拍：抖动（rolling）→ 落定缩放（landed）→ 卡牌飞回手牌区（内联 transform）。
     ═══════════════════════════════════════════════════════════════════ */
  .dicemode .dicegrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:320px}
  .diceleft{position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:14px 10px;cursor:pointer;user-select:none;
    -webkit-user-select:none;border:1px dashed var(--line);border-radius:12px}
  .diceleft:hover{border-color:var(--gold-line)}
  .diceleft.done{cursor:default}
  .diceleft.done:hover{border-color:var(--line)}
  .dicepit{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;min-height:120px}
  .die{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
  .die .dshape{display:flex;align-items:center;justify-content:center;
    width:88px;height:88px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.28))}
  .die .dnum{font-size:27px;font-weight:800;line-height:1}
  .die .dtag{font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
  /* d20＝黄色六边形剪影；d4＝三角形剪影（惩罚灰、奖励白） */
  .die.d20 .dshape{clip-path:polygon(50% 1%,94% 25%,94% 75%,50% 99%,6% 75%,6% 25%);
    background:linear-gradient(160deg,#f0ca62,#d9a83c);color:#41300a}
  .die.d4 .dshape{clip-path:polygon(50% 3%,97% 90%,3% 90%);width:68px;height:68px}
  .die.d4.pen .dshape{background:linear-gradient(160deg,#9a9a9a,#6f6f6f);color:#141414}
  .die.d4.bon .dshape{background:linear-gradient(160deg,#fbf8ef,#ddd6c4);color:#3c362a}
  .die.d4 .dnum{font-size:20px;margin-top:10px}
  .die.rolling .dshape{animation:diceTumble .17s linear infinite}
  .die.landed .dshape{animation:diceLand .4s cubic-bezier(.34,1.4,.5,1)}
  @keyframes diceTumble{
    0%{transform:rotate(-13deg) translateY(-3px)}
    50%{transform:rotate(11deg) translateY(3px)}
    100%{transform:rotate(-13deg) translateY(-3px)}}
  @keyframes diceLand{0%{transform:scale(1.32)}62%{transform:scale(.93)}100%{transform:scale(1)}}
  .dicehint{font-size:11.5px;letter-spacing:.24em;color:var(--muted)}
  .diceres{font-size:14px;line-height:1.9;text-align:center;padding:8px 6px 0;
    border-top:1px dashed var(--line);width:100%}
  .diceright{display:flex;flex-direction:column;gap:13px;min-width:0}
  .dtitle{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.4}
  .drow{font-size:13.5px;line-height:1.85}
  .drow b{font-weight:700}
  .dk{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--muted);margin-bottom:5px}
  .dslots{display:flex;gap:9px;flex-wrap:wrap}
  /* 卡槽里的**人物卡** —— 与事件台同族（4 格、可换行），但只是回看，放不进拖不出 */
  .dslotcard{flex:0 1 112px;min-width:100px;border:1px solid var(--line);border-radius:9px;
    padding:7px 9px;background:var(--panel);display:flex;flex-direction:column;gap:2px;will-change:transform}
  .dslotcard .nm{font-weight:650;font-size:13px}
  .dslotcard .sub{font-size:10.5px;color:var(--muted)}
  .dslotcard.lead{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-line) inset}
  .dslotcard.empty{border-style:dashed;background:transparent;opacity:.4}

  /* ═══════════════════════════════════════════════════════════════════
     同屏处理台 ＋ 四个卡位（2026-10-05 · 学《苏丹》的牌桌）
     ─────────────────────────────────────────────────────────────────
     它解决的**不是**好看，是一件功能性的事：浮层的遮罩把手牌带盖住了，
     而手牌带是**拖拽源** ⇒ 玩家看得见卡、拖不动。
     ⇒ 事件详情改放中栏，底部手牌带保持可见 ⇒ 拖第一次真的能用。
     ═══════════════════════════════════════════════════════════════════ */
  /* ⚠️ 2026-10-07（用户第 1 条）：`.evdesk` 自己那层金框（inset 金线 ＋ 投影）
     **删了** —— 外面 `#modal.evdeskmodal` 已是唯一那层框（见上），
     再画一道就是用户说的"外面那层/两侧卡面"，四边白白吃掉一圈空间。 */
  .evdesk-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;
    padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .ehk{font-size:10.5px;letter-spacing:.2em;color:var(--gold-line);
    border:1px solid var(--gold-line);border-radius:4px;padding:1px 6px;flex:0 0 auto}
  .ehn{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--ink);
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ehx{flex:0 0 auto;padding:3px 10px;font-size:12px;border-radius:6px;
    border:1px solid var(--line);background:var(--raise);color:var(--muted);cursor:pointer}
  .ehx:hover{border-color:var(--gold-line);color:var(--accent)}

  /* ── 四个卡位（人）─────────────────────────────────────────────────
     ⚠️ **视觉上要与下拉框那一支彻底不同** —— 它不是"一个框里列着名字"，
        它是**四个可以放东西的位置**（《苏丹》那三个空槽的做法）。
     ⚠️ 必空的位是**红实线**（用户裁定）—— 红色在《苏丹》里就是"这里必须有东西"。
     ⚠️ 放满/放过的位**立刻变成一张卡的样子**（深底 ＋ 名字 ＋ ×），
        玩家一眼能数出"我放了几个人"，不必去读那句「已放 N 个」。 */
  /* ⚠️⚠️ 2026-10-06 用户裁定：「**现在卡槽太小了**」+ 参《苏丹的游戏》：
   *   那个游戏里**空槽就是一张竖卡的轮廓**（跟他手牌区那张卡同一比例），
   *   玩家看一眼就知道"这里要放一张卡" —— **不需要任何文字说明**。
   *   ⇒ 尺寸：宽 `92px`（卡带那张 112 的 0.82）· **高 128px**（竖卡比例 ≈ 1:1.39）
   *   ⇒ `grid-template-columns:repeat(4,92px)` —— **固定宽**不按比例摊，
   *     摊开会让空槽变成扁扁的横条，失去"这是一张卡"的形状感。
   *   ⇒ `.pdash`（"拖到这里"那行字）**只留一个极淡的框内记号**，
   *     真的什么都不写才最像《苏丹》—— 折中：留一个「＋」符号。
   */
  /* ⚠️⚠️ 2026-10-06 修一个**结构错**：`.slots` 这个类**被两处用**，含义不同 ——
     · 内层（`slotWho` 里）＝ **四个 92px 的人位** ⇒ 该 grid 4 列；
     · 外层（`evbox` 里）＝ **包三个 `slotbox`**（人 / 物 / 钱）⇒ 该 flex 换行。
     我上一轮把**基础规则**改成 `grid-template-columns:repeat(4,92px)`
     ⇒ 外层那三个 `slotbox`（标签容器，最小宽 122px）被塞进 92px 一列
     ⇒ **竖排成一条、卡片溢出重叠**（实测截图就是这样）。
     ⇒ 拆成两个类：**内层 `.slots`**（保留）＋ **外层 `.slotrow`**（新，flex）。
     外层那处 `evbox .slots` 一并改成 `.slotrow`。 */
  .slots{display:grid;grid-template-columns:repeat(4,92px);gap:10px;margin:10px 0 6px}
  .slotrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .pslot{position:relative;width:92px;height:128px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;padding:8px 6px;cursor:default;
    background:color-mix(in srgb,var(--raise) 60%,transparent);
    border:1px dashed var(--line);
    transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
  /* 空槽记号：**一个「＋」**，不是一行字（《苏丹》的做法：空位自己会说话）*/
  .pdash{font-size:26px;line-height:1;color:var(--faint);opacity:.5;font-weight:300}
  /* 必空 ⇒ 红实线（与"可以空"那一档必须一眼能分开） */
  .pslot.must{border:1px solid var(--danger);
    background:color-mix(in srgb,var(--danger) 6%,transparent)}
  .pslot.must .pdash{color:color-mix(in srgb,var(--danger) 62%,var(--faint))}
  /* 放上去了 ⇒ 变成"卡"的样子：深底 ＋ 白字 ＋ 一个 × */
  .pslot.filled{background:var(--panel);border:1px solid var(--gold-line);
    box-shadow:var(--sh-1);cursor:pointer}
  /* ⚠️⚠️ 清单第 1 条：放进去的人**以整张卡的样子**住在槽里（与手牌区同一副面孔）——
     拖拽的语义是"卡从手上搬进了这个位"。槽 92×128 ⇒ 卡自己充满槽（inset 6px），
     字号比手牌卡（112 宽）降一档。主角卡沿用 `me` 那套金边语言。 */
  .pslot .scard{position:absolute;inset:6px 6px 8px;display:flex;flex-direction:column;gap:3px;
    padding:7px 8px;background:var(--raise);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;text-align:left;box-shadow:var(--sh-1)}
  .pslot .scard.me{border-color:var(--accent-deep);
    background:color-mix(in srgb,var(--accent) 7%,var(--raise))}
  .pslot .scard .sn{font-family:var(--font-display);font-size:13px;font-weight:600;
    color:var(--ink);line-height:1.3;word-break:break-word}
  .pslot .scard .si{font-size:10px;color:var(--muted);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 钱格那张：名字在上、大数字在下（与卡带上的金币卡同一排版口径）*/
  .pslot.filled.gold{flex-direction:column;gap:4px;padding:10px 6px}
  .pslot.filled.gold .pname{font-family:var(--font-display);color:var(--accent-2);
    font-size:11.5px;letter-spacing:.06em}
  .pslot .hg.small{font-family:var(--font-num);font-size:20px;font-weight:600;
    line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .pslot.filled:hover{border-color:var(--danger)}
  .pname{font-size:12.5px;color:var(--ink);line-height:1.3;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .px{position:absolute;top:2px;right:5px;font-size:13px;color:var(--faint);line-height:1}
  .pslot.filled:hover .px{color:var(--danger)}
  /* 拖到可放的位上：亮起来（`dropok` 由 `canDropOn` 决定，与人物/物品同一套）*/
  .pslot.dropok{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    box-shadow:0 0 0 1px var(--accent) inset}
  .pslot.dropno{opacity:.5}
  /* 槽上闪一句（金币拖拽第 ① 档："这件事不用垫钱"）—— 就地显示，不飘到屏幕顶 */
  .slotflash{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--gold-line);border-radius:6px;
    padding:3px 9px;font-size:11.5px;color:var(--accent);white-space:nowrap;
    pointer-events:none;z-index:8;box-shadow:var(--sh-2);
    animation:fadeUp var(--t-fast) var(--ease) both}
  .slotbox{position:relative}
  @media (max-width:520px){
    .slots{grid-template-columns:repeat(2,1fr)}   /* 四个 56px 挤在一行会看不清每个位 */
  }

  .rlpair{display:flex;gap:15px;align-items:flex-start;margin-top:12px}
  .rlleft{flex:0 0 auto}
  .rlright{flex:1;min-width:0}
  /* 左盘不画时（没掷骰）右边的纸**占满整行** —— 刻意不留半截空白 */
  .rlleft:empty + .rlright{width:100%}
  @media (max-width:560px){
    /* 窄屏：盘落回竖排（它在 210px 宽时会把纸压成两条缝）*/
    .rlpair{flex-direction:column;gap:11px}
    .rollpanel{flex:1 1 auto;width:100%}
  }
  .rollpanel{flex:0 0 210px;display:flex;flex-direction:column;gap:7px;
    padding:12px 13px;border-radius:11px;
    background:var(--raise);border:1px solid var(--line);box-shadow:var(--sh-1);
    animation:cardIn var(--t-slow) var(--ease) both}
  .rollpanel.ok{border-color:var(--ok-line)}
  .rollpanel.no{border-color:var(--warn-line)}
  .rlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rlk{font-size:11px;color:var(--faint);letter-spacing:.14em;flex:0 0 auto}
  .rlv{font-size:14px;color:var(--ink);font-family:var(--font-display);font-weight:600}
  .rlattrs .esig.mini{width:26px;height:26px;border-radius:7px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    animation:none;margin-right:4px}
  /* 骰面：一张立着的方牌。⚠️ 它要读起来像"掷出来的" ⇒ 有厚度、有高光、翻出来。 */
  .rldie{position:relative;align-self:center;width:74px;height:74px;margin:5px 0 3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    border-radius:13px;background:linear-gradient(160deg,var(--raise),var(--panel));
    border:1px solid var(--gold-line);
    box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accent) 26%,transparent),var(--sh-2);
    animation:dieFlip 620ms var(--ease) 120ms both}
  .rldnum{font-family:var(--font-num);font-size:32px;font-weight:600;line-height:1;
    color:var(--accent-2);font-variant-numeric:tabular-nums}
  .rldnum.small{font-size:17px;color:var(--ink);display:inline-block}
  .rld20{font-size:9.5px;color:var(--faint);letter-spacing:.18em;margin-top:2px}
  /* 翻出：从**侧面**转出来（rotateY）—— 正面淡入会读成"渐显"，读不出"掷"。 */
  @keyframes dieFlip{
    0%{transform:perspective(500px) rotateY(-96deg) scale(.86);opacity:0}
    60%{opacity:1}
    100%{transform:none;opacity:1}}
  .rlarith{align-items:baseline;gap:6px;padding-top:7px;border-top:1px dashed var(--line)}
  .rleq{font-family:var(--font-num);font-size:11.5px;color:var(--muted)}
  .rlmod{font-size:11px;color:var(--faint)}
  .rlvs{font-size:13px;color:var(--ink-soft);padding-top:6px}
  .rlvs b{font-family:var(--font-num);font-size:16px;color:var(--accent)}
  .rollpanel.ok .rlvs{color:var(--ok)}
  .rollpanel.no .rlvs{color:var(--danger)}
  /* 端点说明：必须显式告诉玩家"1/20 先于一切修正"，否则他会以为算错了 */
  .rlep{font-size:10.5px;color:var(--faint);line-height:1.45;
    padding-top:6px;border-top:1px dashed var(--line)}
  .rlep b{color:var(--accent-2)}
  @media (prefers-reduced-motion:reduce){.rldie{animation:none}}
  .empty{color:var(--muted);font-style:italic}

  /* ═══════════════════════════════════════════════════════════════════
     属性符号 · 事件纹章（2026-10-05）
     ─────────────────────────────────────────────────────────────────
     纯 SVG、无外部资源。三个尺寸档（16 / 24 / 大纹章），共用一套描边参数
     —— 粗细不统一会让六枚符号看起来像来自六个不同的图标集。
     ═══════════════════════════════════════════════════════════════════ */
  .sigil{flex:0 0 auto;display:block}
  /* 属性小徽：卡面上的「这件事要什么」。⚠️ 不用 `tag` 那套 pill 形状 ——
     那是"文字分类"，这个是"能力"，形状该不同，否则会和 tag 混在一起。 */
  .attrchip{display:inline-flex;align-items:center;gap:4px;
    padding:1px 7px 1px 6px;border-radius:6px;font-size:12px;white-space:nowrap;
    border:1px solid var(--hint-line);color:var(--ink-soft);background:var(--raise)}
  .attrchip .sigil{color:var(--accent)}

  /* ── 事件纹章：详情浮层左侧那块"图像" ───────────────────────────────
     ⚠️ 尺寸刻意**不大**（120px 见方）：它是"这件事的标识"，
        不是插画 —— 一旦做大，右侧正文会被挤成一条缝（那就本末倒置了）。
     ⚠️ 底纹只做几何：半吊子的具景（一个歪掉的人形）比没有更糟。 */
  .esigil{position:relative;flex:0 0 auto;width:120px;height:120px;
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;overflow:hidden;
    background:color-mix(in srgb,var(--accent) 5%,var(--raise));
    border:1px solid var(--line);
    box-shadow:inset 0 1px 20px rgba(0,0,0,.18)}
  .esigil .epat{position:absolute;inset:0;width:100%;height:100%}
  .esigil.tA{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,var(--raise))}
  .esigil.tB{border-color:var(--accent-deep);background:color-mix(in srgb,var(--accent) 8%,var(--raise))}
  .esigil.tC{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--raise))}
  .esigil.tA .epat{color:var(--danger)}
  .esigil.tB .epat{color:var(--accent)}
  .esigil.tC .epat{color:var(--blue)}
  .esigs{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
  /* 一枚属性符号 ＝ 一层"薄牌"：底下一张小圆片，浮在纹章上 */
  .esig{display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:10px;
    background:color-mix(in srgb,var(--raise) 88%,transparent);
    border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .esig .sigil{color:var(--accent)}
  .esigil.tA .esig .sigil{color:var(--danger)}
  .esigil.tC .esig .sigil{color:var(--blue)}
  /* 一枚属性（不指定时）⇒ 符号区缩小，别撑出一个空盒 */
