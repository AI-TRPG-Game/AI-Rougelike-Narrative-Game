    // ⚠️ 2026-10-06（问题 5）：`needPick` 时**不再给标题与解说** ——
    //   那两句（「那东西还没有名字」／「它得由你命名…」）是原来那一屏的**解说**，
    //   而用户原话是「下面的东西全部不需要在这次弹窗出现」⇒ 一并去掉。
    //   剩下的是**面板本身**（四宣言 or 属性），那才是玩家要操作的东西。
    //   ⚠️ `needPick` 为假时（已选过）仍旧要标题 —— 那一屏的功能是"点掉最后一条"。
    // ⚠️⚠️ 2026-10-07 用户裁定：**先详情后选项** ——「点击事件后应该显示事件详情＋玩家的选项，
    //   玩家点击选后再呈现结果」。旧版把详情整段吞了、上来就是选项列表（序幕与正文的
    //   档 A 同病 —— 都走这一支），玩家对着几个不明所以的按钮做决定。
    //   ⇒ **`eventCardHtml(pe)` 打头**（标题 ＋ 地点 ＋ 正文），选项与阶段面板跟在后面；
    //     点选之后的下半场不变（`handled` 那张卡本来就有详情 ＋ 所选 ＋ 结果）。
    $('modal').innerHTML =
      eventCardHtml(pe) +
      (needPick ? '' : '<h2 style="margin-top:14px">你当场就得拿主意</h2>' +
        '<div class="sub" style="color:var(--muted)">' +
          '没有别人能替你走这一步 —— 定下来，当场就有下文。') +
      '</div>' +
      (needPick && pickStage === 'kit'
        // ⚠️ 第二步：四宣言那一步（问题 6）—— **只给四句**，属性那步在它之后（问题 7）。
        ? kitStageHtml(v.desirePick)
        : (needPick ? advStageHtml(v.desirePick) : '')) +
      (needPick ? '' : pe.options.map((o, i) => '<button class="opt" data-act="popup" data-ev="' + pe.id + '" data-i="' + i + '"' +
        (kitChosen ? '' : ' disabled') + '>' +
        esc(o.text) + '</button>').join('')) +
      '<div class="ops" style="margin-top:10px">' +
        (needPick && pickStage === 'kit'
          ? '<button data-act="pickBack">返回</button>'
          : '<button data-act="closePopupOpen">先不处理</button>') +
      '</div>';
    return;
  }

  // ①″ 详情浮层（B 轮）—— 点开一张卡看「具体内容」。
  //     ⚠️ 它**让位给档 A**：那一步是强制的、点选即结算，不能被一个阅览层盖住。
  // ⚠️⚠️ 2026-10-05：**事件的详情不进浮层**（用户裁定：「点开后手牌区就不能拖拽了」）。
  //    病灶（用户实测 ＋ 截图）：浮层上面盖着**遮罩**，而拖拽源（底部手牌带）
  //    在遮罩下面 ⇒ 看得见卡、**拖不动**。而我们明明已经写好了 `canDropOn`
  //    （认人卡、认物卡，第五轮又加了认金币卡）—— **那条路事实上一直是断的**。
  //    ⇒ 事件详情改**同屏**：中栏顶部一条「正在办：××」（可收起），
  //      底部手牌带保持可见可拖。人/物/钱三格做成《苏丹》那样的**卡位**。
  //    ⚠️ **只有事件走这条路**：人物/物品/这一局的详情仍是浮层 ——
  //    它们是"看一眼"，而事件是"要动手"，动手这件事必须在手牌旁边做。

  if (detailOpen && v && !pending.length && !popupResults.length) {

    // ⚠️ 走 `.top`：**「你的欲望」与事件台同一图层**，手牌区不被遮挡
    //   ⇒ 凭证卡能从手牌区拖进四行卡位（用户 2026-07-07 原话：
    //   「『你的欲望』应当和常规事件在同一图层，即不遮挡手牌区，
    //     不然玩家无法放凭证」）。
    //   ⚠️ `person` / `item` 两个详情**也走 `.top`** —— 它们同样要拖物品卡给人（`/api/give`）。
    ov.classList.remove('hidden');
    ov.classList.add('top');
    document.body.classList.add('ovtop');
    modal.className = 'sheetmode';
    const d = detailOpen;
    // ⚠️⚠️ 2026-10-07 用户第 3 条：**「尚未入队」是一块自己成套的弹窗**（左竖列 ＋ 右详情），
    //   它不套 `.sheet`（那一层是"一页文字"，会把左右两栏压成上下）。
    //   ⚠️ 它**不给凭证拖拽入口**（`enableVoucherDrag(false)` 不必调：`.voucher` 本就没 `data-kind`）。
    if (d.kind === 'outsiders') {
      // ⚠️ 额外挂一个 `outmodal` —— 这一屏是**左右两栏**，720px 会把右栏挤扁
      //   （`#modal.sheetmode` 的 `max-width` 是给"一页文字"定的）。
      modal.className = 'sheetmode outmodal';
      $('modal').innerHTML = '<div class="sheet outsheet">' + sheetOutsiders(v) + '</div>' +
        '<div class="ops" style="margin-top:12px"><button class="primary" data-act="closeDetail">退出</button>' +
        '<span class="sub" style="color:var(--muted)">点左边的人换一个看；点空白处也能退出。</span></div>';
      return;
    }
    const inner = d.kind === 'quest' ? sheetQuest(v)
      : d.kind === 'person' ? sheetPerson(v, d.id)
      : d.kind === 'voucher' ? sheetVoucher(v, d.id)
      : sheetItem(v, d.id);
    // ⚠️⚠️ 2026-10-06 清单第 4B.4 条：**凭证卡只在「你的欲望」这一屏可拖**
    //   （用户原话：「放在手牌区，但**只能在『你的欲望』事件中使用**」）。
    //   ⇒ 在这一屏 `innerHTML` 写完之后、手牌区重画**之前**补上 `data-kind` ——
    //     `handRailInner` 每轮 `render()` 都重画，而 `render()` 先调 `renderHand` 再 `renderOverlay`
    //     ⇒ 必须在这里补（下一轮 render 手牌会被清掉、这个属性得每轮重补一次）。
    enableVoucherDrag(d.kind === 'quest');
    $('modal').innerHTML = '<div class="sheet">' + inner + '</div>' +
      '<div class="ops" style="margin-top:12px"><button class="primary" data-act="closeDetail">收起</button>' +
      '<span class="sub" style="color:var(--muted)">点卡片外面也能收起。</span></div>';
    return;
  }
  if (!pending.length && !popupResults.length) { ov.classList.add('hidden'); $('modal').innerHTML = ''; return; }
  ov.classList.remove('hidden');
  ov.classList.remove('top');   // ⚠️ 同上
  modal.className = '';

  // ② 档 A ⇒ **不再自动弹出**（2026-10-05 用户裁定「开局一进去就是疯狂点弹窗太突兀了」）。
  //    改成：画布正中摆一张**大牌**，玩家点了才开这一层。
  //    ⚠️ `popupOpen`（画布上那一下）走的是**同一个** `/api/popup` 通路与同一批选项 ——
  //       这只是**什么时候显示**变了，"点一下即结算"这条规则一个字没改。
  //    ⚠️ 结算正文（下面 ③）**仍然自动弹**：那是"你刚做完一件事的结果"，
  //       藏起来等于让玩家以为自己白做了一件事。**该打断的才打断。**
  // ⚠️⚠️ 2026-10-07 用户裁定「档 A 与常规事件同级」的连带：**结算正文不再被档 A 堵住**。
  //    旧判据 `if (pending.length)` 一刀切收遮罩 —— 档 A 没点完时，刚到账的结算结果
  //    （含骰子动画）整队干等，玩家看到的又是"结算什么都没弹"。
  //    ⇒ 档 A 只在**没有结果要看**时才收遮罩（大牌还铺在画布上，随时点得到）。
  if (pending.length && !popupResults.length) {
    // ⚠️ 不弹 ⇒ 直接收起遮罩。玩家点画布上那张牌时会重新走进来。
    ov.classList.add('hidden');
    $('modal').innerHTML = '';
    return;
  }

  // ③ 一笔结算（正文事件的了结 / 场景收束 / 终局话术 …）⇒ **同样一次一条**，
  //    看完点「知道了」才轮到下一条（此前是全堆在一块儿）。
  //    ⚠️ 2026-09-24：这一屏改用 `plain`（金棕）而不是默认那套红 ——
  //      红是留给「你当场就得拿主意」的强制弹窗与危险确认的；一笔下文顶着
  //      两个红字 ＋ 一圈红框，口气对不上（用户这一轮正是在调这个权重）。
  modal.className = 'plain';
  const r = popupResults[0];
  // ③′ **骰子动画弹窗**（2026-10-07 用户裁定）—— 这笔结果若是简略处理掷过骰的那件事，
  //    先在这里播"骰子怎么落的"，玩家点「查看结算结果」才放它换成下面那张普通结果卡。
  //    ⚠️ 骰子在**排布那一刻**就已经掷完（服务端 `handleEvent`），这里的动画是
  //    **纯展示**：播的就是那份既定结果，不掷第二次。
  if (r.roll) {
    // 弹窗态按**条目身份**记（`popupResults` 每次进出都是新对象）：
    // 换了一条 ⇒ 回到"还没掷"；同一条 ⇒ 保留玩家掷到哪一步了（重渲染不重播）。
    if (diceState.entry !== r) diceState = { entry: r, rolled: false, done: false };
    if (!diceState.done) {
      ov.classList.remove('hidden');
      ov.classList.remove('top');
      modal.className = 'plain dicemode';
      $('modal').innerHTML = dicePopupHtml(r);
      return;
    }
  } else if (diceState.entry) {
    diceState = { entry: null, rolled: false, done: false };
  }
  const more = popupResults.length > 1
    ? '<div class="sub" style="color:var(--muted)">后面还有 ' + (popupResults.length - 1) + ' 条。</div>'
    : '';
  $('modal').innerHTML =
    '<h2>结果</h2>' +
    more +
    '<div class="res">' +
      (r.title ? '<div class="sub" style="color:var(--muted)">' + esc(r.kind) + ' · ' + esc(r.title) + '</div>' : '') +
      // ⚠️ 2026-10-05：逐段浮现 ＋ 资源增减演出。档 A 同样要"看得见地变了" ——
      //    它不掷骰，但金币/好感照样在动（只给文字等于让玩家自己心算）。
      segmentHtml(r.text, 'segline') +
      meterDeltaHtml(meterDiffs(beforeMeters, readMeters(S && S.view))) +
      // ⚠️ 2026-10-07（用户裁定）：六维属性的变化**不做动画** —— 在这张结算卡上
      //    直接写一行小字：「谁谁谁 某属性 +x」。
      attrChangeHtml(pendingAttrLines) +
    '</div>' +
    '<div class="ops" style="margin-top:12px"><button class="primary" data-act="closeResults">知道了</button></div>';
}

/**
 * **开局选择面板**（2026-10-05 用户裁定：欲望 ＋ 六维都改成玩家自己挑）。
 *
 * ⚠️ **它渲染的是"还没发出去的那次编辑"**（`pickKit` / `pickAdv` 两个本地变量），
 *    灌进来时**从 `v.desirePick.choice` 取**（`syncPick`）—— 服务端的 `Session.choice`
 *    才是事实源，这里只是草稿。
 * ⚠️ **判据全在服务端**（`needsChoice` ＋ `pickDesire` 的越界拒）⇒ UI 不重算一遍
 *    "亮点最多 2 个"，只把后果显示出来（点第三个时那句提示）。两份判据必然漂移。
 * ⚠️ **两条文本都显示，但措辞不同**：宣言是**他自己写下的原话**（大字、居中），
 *    判据是**系统拿它判 28 天的那一句**（小字、灰色）—— 别让玩家分不清哪句会一直在。
 */
/**
 * **第一步：选欲望宣言**（2026-10-06 用户裁定 · 问题 6）。
 *
 * ⚠️ 排版是裁定的一部分：**四个框平铺并排**（不是竖着四行），
 *   每个框里 **大字主体 ＝ 手段＋目的合成的那句**，
 *   **下面小字 ＝ 宣言原话**当修饰性文字。
 *   原话（要删的那段）：「你受够了这样的生活，你下定决心要让塞兰王国迎来大变！」
 *   —— 那句在**上一屏**（序幕那一句），不在这里。
 *
 * ⚠️⚠️ **为什么主体用 `means ＋ proposition` 而不是 `manifesto`**：
 *   后端 `DesireKit` 三个字段各判一个维度 —— `manifesto`（宣言 · 只上卡面与终局，
 *   **不进任何判定**）、`means`（手段 · 判「正当的手段」）、`proposition`（目的 · 判「欲向」）。
 *   ⇒ 玩家要承诺的是**手段与目的**，那才是 28 天里天天拿来判他的东西；
 *     宣言原话是**修辞**，当修饰正好。
 *   ⚠️ 而 28 天后拿他判的是**服务端落的 `desire.manifesto/means/proposition`** ——
 *     这里选哪个，最后都是那三个字段一起进账本，**不许在这里改口径**。
 */
function kitStageHtml(dp){
  syncPick(dp);
  const kits = arr(dp && dp.kits);
  const cards = kits.map(function (k){
    const on = pickKit === k.index;
    const body = esc(k.means) + '，' + esc(k.proposition);
    return '<button class="kitcard' + (on ? ' on' : '') + '" data-act="pickKit" data-k="' + k.index + '" ' +
      'aria-pressed="' + (on ? 'true' : 'false') + '">' +
      '<span class="kc-body">' + body + '</span>' +
      '<span class="kc-tag">' + esc(k.manifesto) + '</span>' +
    '</button>';
  }).join('');
  return '<div class="kitstage">' +
    '<div class="ktitle">挑一句你这 28 天都认的话</div>' +
    '<div class="kgrid">' + cards + '</div>' +
  '</div>';
}

/**
 * **第二步：选优势属性**（2026-10-06 用户裁定 · 问题 7）。
 *
 * ⚠️ 改动三处，其余一字未动：
 *   ① 顶部**保留已选的宣言**当提醒（用户原话：「前面选择的欲望宣言要保留到这个弹窗作为提醒」）
 *   ② 「六项总和 60，点亮越多单项越高、其余越低 —— 专精的代价就是平庸。」
 *      ⇒ 改成「**请选择你的优势属性，可选0-2项**」（原话给定）
 *   ③ 按钮「就这样」⇒ 改成「**确定**」
 * ⚠️ **六维怎么分仍是服务端那套算术**（`ATTR_ADV_MAX` ＋ 均值约束），这里只是**点名**——
 *   用户裁的是「**只改文案＋按钮名**」，不是改分配规则。
 */
function advStageHtml(dp){
  syncPick(dp);
  const kits = arr(dp && dp.kits);
  const mine = kits.find((k) => k.index === pickKit);
  const ADV = ['争斗','敏捷','智慧','魅力','社交','感知'];
  const chosen = ADV.filter((a) => pickAdv[a]);
  const full = chosen.length >= 2;
  const adv = ADV.map(function (a){
    const on = !!pickAdv[a];
    return '<button class="optchip" data-act="pickAdv" data-a="' + esc(a) + '" ' +
      'aria-pressed="' + (on ? 'true' : 'false') + '" ' +
      'style="margin:4px 6px 0 0;' + (on ? 'border-color:var(--gold);color:var(--gold);' : '') + '">' +
      esc(a) + '</button>';
  }).join('');
  return '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
    // ① 已选宣言的提醒（问题 7 明确要"保留到这个弹窗作为提醒"）
    (mine
      ? '<div class="pickedline"><span class="pl-t">你刚挑的</span>' +
        '<span class="pl-b">' + esc(mine.means) + '，' + esc(mine.proposition) + '</span>' +
        '<span class="pl-tag">' + esc(mine.manifesto) + '</span></div>'
      : '') +
    '<div style="font-weight:650">再定下你拿什么去换</div>' +
    // ② 文案按裁定替换
    '<div class="sub" style="color:var(--muted);margin-top:2px">请选择你的优势属性，可选0-2项</div>' +
    '<div style="margin-top:8px">' + adv + '</div>' +
    '<div class="sub" style="font-size:12px;color:var(--muted);margin-top:6px">' +
      (chosen.length === 0
        ? '一项都不选也可以 —— 六项一样平庸。'
        : '已选 ' + chosen.length + ' 项：' + esc(chosen.join('、')) + (full ? '（最多 2 项）' : '')) +
    '</div>' +
    '<div class="ops" style="margin-top:10px">' +
      // ③ 按钮名按裁定替换
      '<button class="primary" data-act="pickCommit"' + (pickKit < 0 ? ' disabled' : '') + '>确定</button>' +
      '<button data-act="pickBack">返回</button>' +
      (pickKit < 0 ? '<span class="sub" style="color:var(--muted)">先回去挑一句宣言。</span>' : '') +
    '</div>' +
  '</div>';
}

function desirePickHtml(dp){
  syncPick(dp);
  const kits = arr(dp && dp.kits);
  const ADV = ['争斗','敏捷','智慧','魅力','社交','感知'];
  const chosen = ADV.filter((k) => pickAdv[k]);
  const rows = kits.map(function(k){
    const on = pickKit === k.index;
    return '<button data-act="pickKit" data-k="' + k.index + '" ' +
      'style="display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;' +
      'border:1px solid ' + (on ? 'var(--gold)' : 'var(--line)') + ';' +
      'background:' + (on ? 'var(--gold-soft)' : 'transparent') + '">' +
      '<div style="font-weight:650;font-size:14px">' + esc(k.label) + '</div>' +
      '<div style="margin-top:4px;font-size:14px;line-height:1.6">' + esc(k.manifesto) + '</div>' +
      // ⚠️ 手段与目的**分开两行、各带标签**（2026-10-06）：它们各判一个维度 ——
      //    手段判「正当的手段」、目的判「欲向」。糊成一句玩家就分不清自己在承诺什么。
      '<div style="margin-top:6px;font-size:12px;color:var(--muted)">手段：' + esc(k.means) + '</div>' +
      '<div style="font-size:12px;color:var(--muted)">目的：' + esc(k.proposition) + '</div>' +
    '</button>';
  }).join('');
  const adv = ADV.map(function(a){
    const on = !!pickAdv[a];
    return '<button class="optchip" data-act="pickAdv" data-a="' + esc(a) + '" ' +
      'style="margin:4px 6px 0 0;' + (on ? 'border-color:var(--gold);color:var(--gold);' : '') + '">' +
      esc(a) + '</button>';
  }).join('');
  const full = chosen.length >= 2;
  return '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
    '<div style="font-weight:650">先定下你想要什么</div>' +
    '<div class="sub" style="color:var(--muted);margin-top:2px">' +
      '这句话此后 28 天不会变 —— 每天每一手都会拿它判「离它更近了还是更远了」。' +
    '</div>' +
    rows +
    '<div style="margin-top:14px;font-weight:650">再定下你拿什么去换</div>' +
    '<div class="sub" style="color:var(--muted);margin-top:2px">' +
      '六项总和 60，点亮越多单项越高、其余越低 —— 专精的代价就是平庸。' +
    '</div>' +
    '<div style="margin-top:8px">' + adv + '</div>' +
    '<div class="sub" style="font-size:12px;color:var(--muted);margin-top:6px">' +
      (chosen.length === 0
        ? '还没点亮任何一项 —— 六项一样平庸。'
        : '已点亮 ' + chosen.length + ' 项：' + esc(chosen.join('、')) + (full ? '（最多 2 项）' : '')) +
    '</div>' +
    '<div class="ops" style="margin-top:10px">' +
      '<button class="primary" data-act="pickCommit"' + (pickKit < 0 ? ' disabled' : '') + '>就这样</button>' +
      (pickKit < 0 ? '<span class="sub" style="color:var(--muted)">先在上面挑一句。</span>' : '') +
    '</div>' +
  '</div>';
}

/** 把本地草稿**灌成**服务端那份选择 —— 每次进这一层都调，别让它变成第二份事实源 */
function syncPick(dp){
  const c = (dp && dp.choice) || { kit: -1, advantages: [] };
  if (pickKit === -1) pickKit = typeof c.kit === 'number' && c.kit >= 0 ? c.kit : -1;
  if (!Object.keys(pickAdv).length) {
    pickAdv = {};
    arr(c.advantages).forEach(function(a){ pickAdv[a] = true; });
  }
}

/**

/* ═══════════════════════════════════════════════════════════════════
   资源增减的演出（2026-10-05 · 学《苏丹》的资源提示）
   ─────────────────────────────────────────────────────────────────
   用户的判断：「各类资源的增减也是会有额外动画提醒玩家的，**而不是静默变化、
   只有文字提示**」—— 这条说到根子上了。

   病灶（不是观感问题，是信息问题）：我们的 `delta` 是**静默落账**的。
   结算浮层里写「好感 2 · 银 32」—— 玩家读到的是**结果**，
   而"刚才那一下动了多少"这件事在**任何地方都没有被演出来**。
   ⇒ 玩家要自己去心算"原来是多少"。

   做法：**在 UI 侧算前后差值**（`beforeView` / `afterView` 两份 view 对比），
   然后把「涨了 / 跌了」做成一次**看得见的动作**。
   ⚠️ **零请求、零规则改动**：两份 view 都已经在手里了（`api()` 前后各一份），
      差值是**算出来的**，不是新加的读数 —— 它回答的问题本来就在两个 view 里。
   ⚠️ 这是**纯呈现**：不参与任何判定，也绝不回写。关掉动画一切照旧。
   ═══════════════════════════════════════════════════════════════════ */

/** 上一次动作之前的**读数**快照（只在页面内存活，刷新即失） */
let beforeMeters = null;

/* ═══════════════════════════════════════════════════════════════════
   参与卡归位（2026-10-05）
   ─────────────────────────────────────────────────────────────────
   用户的纠正：「卡牌在用的时候，它就不在手牌区了（拖拽进一个事件后你在手牌区就看不到它了）
   ⇒ 所以它们结算时本来就在画面里，**反而是后续可能会飞回来 / 撕毁等**！」

   照这个做下来，第一件事是**去掉一个假动作**：
     ❌ "参与卡飞入判定盘" —— 他本来就不在卡带上，飞进来是凭空造的动画。
     ❌ "结算完真的从判定盘搬回卡带" —— 参与人**根本不在判定盘上**（那只是一份名单）。
   两处都会让玩家以为"我的卡被程序搬来搬去"，而账本里根本没有这种搬运。

   真正该做的是这件事，而且它**只需要一行状态**：
     **他不见了，现在又出现了 —— 这件事要被看见。**
   卡本来就会自己回到卡带（`ledger/types.ts·isAway` 判"在不在路上"，
   他归队日当天就回来）。所以这里做的不是"移动"，是**让那张卡亮一下**：
   结算浮层一关，他那张卡闪一次金光 ＋ 微微弹一下 ⇒ 眼睛跟到了"人回来了"。

   ⚠️ **零请求、零账本改动**：人的位置由 `isAway` 说了算，这里只演一次。
   ⚠️ 只在**真的有参与人**且**他刚刚还在路上**时亮 —— 不然每结算一次都闪一遍，
      那就不是提示而是噪音（第二次就没人看了）。
   ═══════════════════════════════════════════════════════════════════ */
/** 刚结算完、正等着"亮一下"的人 id（页面状态，一次性） */
let backHome = [];

/** 记住"谁去办了这事" —— 在**派出去那一刻**记（那时他正要离开卡带） */
function noteDispatched(ids){
  const me = S && S.view && S.view.me ? S.view.me.id : 'npc000';
  const list = arr(ids).filter((x) => x && x !== me);
  if (list.length) backHome = list;
}

/**
 * 让"刚回来的人"那张卡亮一下。
 *
 * ⚠️ **在 `render()` 之后调**（那时卡带已经是新的 DOM），且**延时清标记** ——
 *   标记必须活过这一轮动画，否则动画刚开始就被下一次 `render()` 抹掉了。
 * ⚠️ 找不到人（他已离场/不在 `people` 里）就**什么都不做** ——
 *   不留一个空壳标记等下一次 `render()`。
 * @param ids 人 id 列表
 */
function markHomecoming(ids){
  var done = false;
  for (var i = 0; i < ids.length; i++) {
    var el = document.querySelector('.hcard[data-id="' + (window.CSS && CSS.escape ? CSS.escape(ids[i]) : ids[i]) + '"]');
    if (el) { el.classList.add('back'); done = true; }
  }
  if (!done) return;
  setTimeout(function () {
    var els = document.querySelectorAll('.hcard.back');
    for (var k = 0; k < els.length; k++) els[k].classList.remove('back');
  }, 1500);
}

/** 盯着那几个会变的顶层读数 —— 全部取自 `view` 里**本来就有的**字段 */
/* ═══════════════════════════════════════════════════════════════════
   变化清单（2026-10-06 · 用户裁定「避免静默的状态变化」）
   ─────────────────────────────────────────────────────────────────
   用户的原话：「所有卡牌（包括人物卡、物品卡等）的获得与失去
   （包括一次性物品的被使用、被派遣的人物处理完事件重新回到手牌区等），
   都应该有简短动画提示玩家，甚至声望等数值的变化也要有动画效果」。

   ⚠️ **为什么它能成立**：`view` 每个动作前后各有一份**全量快照**
      ⇒ 差值是**算得出来的**，不需要任何新数据、**不碰规则层**。
   ⚠️ **它替掉了三处"手抄"**：
      · `readMeters` 只抄 5 个字段 ⇒ **每个人的** HP/SAN 查不到；
      · 动画只在结算屏与卡带各有一套触发点；
      · `markHomecoming` 只在"玩家派出去的人"回来时触发 ⇒
        **LLM 新造的人**、**事件过期自动结算**回来的人，全都漏掉。
   ⚠️ 一条铁律：**清单只"看"，不回写**。它不参与任何判定，
      演出失败（动画被跳过、元素找不到）也只是没演，不影响游戏。
   ═══════════════════════════════════════════════════════════════════ */

/** 上一份 view 的**全量**快照（不是手抄的几个字段）。刷新即失。 */
let beforeView = null;
/** 本次动作算出的变化清单 —— 演出在 `render()` 之后消费它。 */
let pendingChanges = [];
/**
 * 六维属性的**文字版**变化清单（2026-10-07 用户裁定）——
 * 属性动画不好做 ⇒ 在**结算卡**上写「谁谁谁 某属性 +x」的小字。
 * `api()` 里算、结算弹窗渲染时消费，下一次动作时被覆盖。
 */
let pendingAttrLines = [];

/**
 * 一次动作的**变化清单**。三类，卡与数各占一半。
 * @typedef {{kind:string, ...}} Change
 */
function buildChanges(before, after){
  const out = [];
  if (!before || !after) return out;

  // ── ① 人：进出 ─────────────────────────────────────────────────
  //    ⚠️ 比的是**在册**（`view.people` 那一整份），不是"能派的那些" ——
  //    死了的人仍在名册里（第五轮定的"留在卡带上"），
  //    真正"离册"的是 `lost.people` 那种（他整条从 `people` 里消失了）。
  // ⚠️ `indexPeople` 返回的是**对象**（`{id: 人}`）⇒ 必须遍历 `Object.keys`，
  //    `for...of` 一个对象会直接抛 `is not iterable`（**在浏览器里也一样炸**，
  //    且它抛在 `render()` 里 ⇒ 整页不画 —— 这种错最难查，所以这里写死遍历键）。
  const bp = indexPeople(before), ap = indexPeople(after);
  for (const id of Object.keys(ap)) {
    if (bp[id]) continue;
    const q = ap[id];
    out.push({ kind: 'person-in', id: id, name: q.name, status: q.status });
  }
  for (const id of Object.keys(bp)) {
    const p = bp[id], q = ap[id];
    if (!q) { out.push({ kind: 'person-out', id: id, name: p.name, gone: isGoneStatus(p.status) }); continue; }
    // 归属变了 ＝ 离队（`affiliated` true → false）／入队（反向）
    if (p.affiliated && !q.affiliated) out.push({ kind: 'person-leave', id: id, name: q.name });
    else if (!p.affiliated && q.affiliated) out.push({ kind: 'person-join', id: id, name: q.name });
    // 状态变了（正常 → 重伤 / 濒死 / 死亡 / 疯狂）＝ 那一档的演出
    if (p.status !== q.status) out.push({ kind: 'person-status', id: id, name: q.name, from: p.status, to: q.status });
  }

  // ── ② 物：进出（**获得**与**失去/消耗**同一条路，只是演出不同）────
  //    ⚠️ 比的是**所有人在带的所有东西**，不只是玩家的 ——
  //    LLM 给玩家新造一件东西时它落在玩家名下，但那是在"任何人的 items"里。
  const bi = indexItems(before), ai = indexItems(after);
  for (const k of Object.keys(ai)) {
    if (!bi[k]) out.push({ kind: 'item-in', id: k, name: ai[k].name, itemKind: ai[k].kind, holder: ai[k].holder });
  }
  for (const k of Object.keys(bi)) {
    if (!ai[k]) {
      // ⚠️ 演出分两档：**用过**（用掉的）与**失去**（被毁/被抢/落水）。
      //    规格里裁定的区分：用过 ＝ 撕毁；失去 ＝ 灰掉飞走。
      //    ⚠️⚠️ **判据是 `kind === '消耗品'`**（2026-10-06 改）——
      //    此前靠**日志正则**（「×× 用掉了 ××」）判，那条路**脆**：LLM 改一句措辞
      //    就认不出，用掉的东西会被演成"被抢了"。
      //    ⚠️ 而 `indexItems` **本来就把 `kind` 存下来了**（它是身份骨架 · 永不变），
      //    且消耗与否的**唯一口径**就是它（`rules/ability.ts·isOneShot` 由 kind 推导）⇒
      //    **同一份判据，零新增数据、零解析**。
      //    ⇒ 连带**删掉了**那个靠日志正则的 `markUsedFromLog`（连同 `usedItemNames`）。
      out.push({
        kind: 'item-out', id: k, name: bi[k].name,
        used: isOneShotKind(bi[k].kind),   // ⚠️ 与小卡那个「尽」**共用同一个函数**
      });
    } else if (bi[k].holder !== ai[k].holder) {
      // 换了主人 ＝ 转移（借出/收回）—— 也要看得见
      out.push({ kind: 'item-move', id: k, name: ai[k].name, from: bi[k].holder, to: ai[k].holder });
    }
  }

  // ── ③ 数：逐个读数 ─────────────────────────────────────────────
  //    ⚠️ **每个下属的 HP/SAN 也在这里** —— 这是手抄做不到的那一处。
  for (const m of numDiffs(before, after)) out.push(m);

  return out;
}

/**
 * **演一遍这份清单**（2026-10-06）。
 *
 * ⚠️ **在 `render()` 之后调**（那时 DOM 已是新的，飞行才能找到落点）。
 * ⚠️ **只看不写**：任何一步找不到元素就**跳过那一条**，绝不影响其他条、
 *    更不影响游戏（清单不参与判定，见上面那条铁律）。
 * ⚠️ **一次动作里所有演出同时排**（用户裁定「这些动画应当可以同时出现」）
 *    ⇒ 逐条**错开 70ms** 起演，而不是排队等前一条演完。
 *    错开是为了"眼睛能跟上一条"，不是"限制同时"。
 * ⚠️ 飞行替身一律 `position:fixed` ＋ 高 `z-index`（用户裁定：
 *    「事件在处理时，手牌区、声望区、未入队的人物区图层都不会隐藏，
 *    这样动画可以正常显示」）⇒ **走最上层，不被任何中间层遮挡**。
 */
function playChanges(changes){
  if (!changes || !changes.length) return;
  const v = S && S.view;
  if (!v) return;
  let i = 0;
  for (const c of changes) {
    const delay = 70 * i;
    i++;
    try {
      switch (c.kind) {
        case 'person-in':   // 新人出现（LLM 造的）⇒ 从画布正中浮起
          at(delay, function () { flyInPerson(c); }); break;
        case 'person-out':  // 离册（罕见）⇒ 灰掉飞走
          at(delay, function () { flyAwayGone(c); }); break;
        case 'person-leave':// 离队 ⇒ **飞到未入队区**（⚠️ 不是变灰：他还能拉回来）
          at(delay, function () { flyLeave(c); }); break;
        case 'person-join': // 入队 ⇒ 从未入队区飞回卡带
          at(delay, function () { flyJoin(c); }); break;
        case 'person-status': // 状态变了（重伤/濒死/死亡/疯狂）⇒ 就地亮一下
          at(delay, function () { flashPerson(c); }); break;
        case 'item-in':     // **获得**（用户裁定：物品获得也要动画）
          at(delay, function () { flyInItem(c); }); break;
        case 'item-out':    // 消耗 ＝ 撕毁 ／ 失去 ＝ 灰掉飞走
          at(delay, function () { c.used ? tearItem(c) : flyAwayItem(c); }); break;
        case 'item-move':   // 转移（借出/收回）⇒ 小方块飞到新主人身上
          at(delay, function () { flyMoveItem(c); }); break;
        case 'num':         // 数值 ⇒ 那处亮一下 ＋ 数字滚动
          at(delay, function () { flashNum(c); }); break;
        default: break;     // 未知种类静默跳过（清单格式变了也不该炸）
      }
    } catch (e) { /* ⚠️ 演出失败一律吞掉 —— 它是装饰，不是功能 */ }
  }
}

/** 延后 `ms` 毫秒执行（`setTimeout` 的薄封装，让上面那串读起来是一句句的） */
function at(ms, fn){ setTimeout(fn, ms); }

/** 找一个人的卡（`.hcard[data-id=…]`）；找不到返回 null */
function cardOfPerson(id){
  const e = (window.CSS && CSS.escape) ? CSS.escape(id) : id;
  return document.querySelector('.hcard[data-id="' + e + '"]');
}

/** 找一件物的卡（人或物卡上那张都算）；找不到返回 null */
function cardOfItem(id){
  const e = (window.CSS && CSS.escape) ? CSS.escape(id) : id;
  return document.querySelector('.hcard[data-id="' + e + '"]');
}

/**
 * **落点在折叠区 / 屏幕外时的那句兜底提示**（2026-10-06 · 用户裁定
 * 「避免静默的状态变化」的延伸）。
 *
 * ⚠️ **为什么需要它**：变化发生在**收着**的东西上时（尚未入队的人、
 *    折叠区里的物品），那个元素**不在 DOM 里**（折叠是渲染时才不画的）
 *    ⇒ 飞行没有起终点 ⇒ 观众什么也没看到。
 *    ⚠️ 而"什么也没看到"正是这整套机制要消灭的那件事 ⇒
 *    **落点找不到时不能说"没有"**，要说"刚才那件事发生了什么"。
 * ⇒ 一枚**屏幕中央的小提示**，1.6 秒后自己走掉。
 *    不做历史、不给关闭按钮（用户裁定「就淡出」）。
 */
function toast(c){
  const el = document.createElement('div');
  el.className = 'chgtoasts';
  // ⚠️ 一次动作可能有**多条**落点找不到 ⇒ 合并成一条（用户裁定过一次"合并同类"）
  el.textContent = c;
  document.body.appendChild(el);
  setTimeout(function () {
    el.classList.add('out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
  }, 1600);
}

/**
 * 造一个**飞行替身**（`position:fixed`，走最上层）。
 * @param from 起点 `{left, top, width, height}`（可空 ＝ 从屏幕边缘外飞入）
 * @param to 终点同款
 * @param cls 替身额外的 class（决定长什么样）
 * @param text 替身上的字
 * @param ms 飞行时长
 */
function spawnFly(from, to, cls, text, ms){
  const f = document.createElement('div');
  f.className = 'fly ' + cls;
  f.textContent = text || '';
  const w = Math.max(24, Math.min(64, (to && to.width) || 40));
  f.style.width = w + 'px';
  f.style.height = (to && to.height ? Math.max(24, to.height) : w * 1.4) + 'px';
  const x0 = (from ? from.left + from.width / 2 : window.innerWidth + 40) - w / 2;
  const y0 = (from ? from.top + from.height / 2 : -40) - f.style.height.replace('px', '') / 2;
  const x1 = (to ? to.left + to.width / 2 : window.innerWidth / 2) - w / 2;
  const y1 = (to ? to.top + to.height / 2 : window.innerHeight / 2) - f.style.height.replace('px', '') / 2;
  f.style.left = x0 + 'px';
  f.style.top = y0 + 'px';
  f.style.setProperty('--dx', (x1 - x0) + 'px');
  f.style.setProperty('--dy', (y1 - y0) + 'px');
  f.style.animationDuration = (ms || 900) + 'ms';
  document.body.appendChild(f);
  setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, (ms || 900) + 80);
  return f;
}

/** 读一个元素的矩形（`null` 元素返回 `null` 而不是抛） */
function rectOf(el){ return el ? el.getBoundingClientRect() : null; }

// ═══════════════════════════════════════════════════════════════════
// 九个具体演出（2026-10-06 · 用户逐条点名要的那几个）
// ─────────────────────────────────────────────────────────────────
// ⚠️ 共同约定：
//   · **卡在原地不动，动的永远是替身** —— 真的重排会让人以为界面跳了；
//   · 落点找不到就**静默跳过**（他在折叠里 / 物已被移出）；
//   · 动画**可跳过**（`prefers-reduced-motion`）—— 那时只给终态（亮一下）。
// ═══════════════════════════════════════════════════════════════════

/** ① 新人出现：从屏幕边缘外飞进来，落进卡带，弹一下。 */
function flyInPerson(c){
  const card = cardOfPerson(c.id);
  // ⚠️ 落点不在（他在折叠区/离席）⇒ **给一句提示**而不是什么都不演
  //    （"避免静默的状态变化"：什么也没看到 ＝ 那件事在观众眼里没发生）
  if (!card) { toast(c.name + ' 加入了'); return; }
  spawnFly(null, rectOf(card), 'fly-person', esc(c.name), 820);
  card.classList.add('arrive');
  setTimeout(function () { card.classList.remove('arrive'); }, 1400);
}

/** ② 离册（`lost.people` 那种，他整条从名册消失）：灰掉 ＋ 向上飞走。 */
function flyAwayGone(c){
  const card = cardOfPerson(c.id);
  if (!card) return;
  const to = { left: window.innerWidth + 60, top: -40, width: 40, height: 56 };
  spawnFly(rectOf(card), to, 'fly-person gonefly', esc(c.name), 760);
}

/** ③ 离队（用户特别点名：**必须区别于死亡**）：飞到**未入队区**，卡面**不变灰**。 */
function flyLeave(c){
  const card = cardOfPerson(c.id);
  if (!card) { toast(c.name + ' 离开了'); return; }
  // 落点 ＝ 未入队区（他会被收进折叠）⇒ 那个区的标题
  const zone = document.getElementById('outsiderszone');
  const to = rectOf(zone) || rectOf(card);
  spawnFly(rectOf(card), to, 'fly-person leavefly', esc(c.name), 860);
  card.classList.add('leaving');
  setTimeout(function () { card.classList.remove('leaving'); }, 1400);
}

/** ④ 入队：从未入队区飞回卡带。 */
function flyJoin(c){
  const card = cardOfPerson(c.id);
  if (!card) { toast(c.name + ' 入队了'); return; }
  const zone = document.getElementById('outsiderszone');
  const from = rectOf(zone);
  if (from) spawnFly(from, rectOf(card), 'fly-person joinfly', esc(c.name), 860);
  card.classList.add('arrive');
  setTimeout(function () { card.classList.remove('arrive'); }, 1400);
}

/** ⑤ 状态变了（重伤 / 濒死 / 死亡 / 疯狂）：就地亮一下 ＋ 卡面闪。 */
function flashPerson(c){
  const card = cardOfPerson(c.id);
  if (!card) { toast(c.name + ' ' + c.from + ' → ' + c.to); return; }
  const bad = (c.to === '死亡' || c.to === '疯狂');
  card.classList.add(bad ? 'flash-bad' : 'flash-warn');
  setTimeout(function () { card.classList.remove('flash-bad', 'flash-warn'); }, 1500);
}

/** ⑥ 物品**获得**（用户裁定：与人物同机制）：从屏幕边缘飞进来，落进主人卡下。 */
function flyInItem(c){
  const card = cardOfItem(c.id);
  // ⚠️ 落点可能是**人卡**（东西长在主人卡下的 `.carryrow`）⇒ 两者都试
  const to = rectOf(card) || rectOf(c.holder ? cardOfPerson(c.holder) : null);
  if (!to) { toast('得到了 ' + c.name); return; }
  spawnFly(null, to, 'fly-item', esc(c.name), 820);
  if (card) {
    card.classList.add('arrive');
    setTimeout(function () { card.classList.remove('arrive'); }, 1400);
  }
}

/** ⑦ 物品**消耗**（用户点名：撕毁动画）：撕开 ＋ 碎屑落下 ＋ 消失。 */
function tearItem(c){
  const card = cardOfItem(c.id);
  const box = card || document.querySelector('.fly-item');
  if (!box) { toast(c.name + ' 用掉了'); return; }
  if (box) {
    box.classList.add('torn');
    setTimeout(function () { box.classList.remove('torn'); }, 1000);
  }
  // ⚠️ 替身也要撕 —— 主人卡上的小卡可能正好在折叠区里看不到
  const holderCard = card ? card.closest('.hcard') : null;
  const r = rectOf(card) || rectOf(holderCard);
  if (r) {
    const f = spawnFly(r, { left: r.left, top: r.top + 30, width: r.width, height: r.height },
      'fly-item tornfly', esc(c.name), 900);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1000);
  }
}

/** ⑧ 物品**失去**（被毁 / 被抢 / 落水）：灰掉 ＋ 飞走（⚠️ **与撕毁不同**）。 */
function flyAwayItem(c){
  const card = cardOfItem(c.id);
  const r = rectOf(card);
  if (!r) { toast('失去了 ' + c.name); return; }
  const to = { left: window.innerWidth + 60, top: window.innerHeight - 40, width: r.width, height: r.height };
  spawnFly(r, to, 'fly-item lostfly', esc(c.name), 820);
}

/** ⑨ 转移（借出 / 收回）：小方块从旧主人飞到新主人。 */
function flyMoveItem(c){
  const from = c.from === S.view.me.id ? null : cardOfPerson(c.from);
  const to = c.to === S.view.me.id ? null : cardOfPerson(c.to);
  const fromR = rectOf(from);
  const toR = rectOf(to);
  // ⚠️ 两头都得在屏幕上才演得出来；有一头收着 ⇒ **给一句提示**（静默最坏）
  if (!fromR || !toR) { toast(c.name + ' 转手了'); return; }
  spawnFly(fromR, toR, 'fly-item', esc(c.name), 860);
  const target = to || cardOfPerson(c.to);
  if (target) {
    target.classList.add('arrive');
    setTimeout(function () { target.classList.remove('arrive'); }, 1400);
  }
}

/** ⑩ 数值变化：那处**亮一下** ＋ 数字滚过去（复用 `rollNumber`，不重写）。 */
function flashNum(c){
  // 落点：顶栏（金币/欲念/声望）或者那张人的卡（他的 HP/SAN）
  const sel = c.path === 'gold' ? '.tb-gold'
    : c.path === 'desire' ? '.tb-desire'
    : c.path.indexOf('rep.') === 0 ? '.tb-rep'
    : cardOfPerson(c.who);
  const el = sel && sel.querySelector ? sel : (typeof sel === 'string' ? document.querySelector(sel) : sel);
  if (!el) { toast(c.label + ' ' + (c.delta > 0 ? '+' : '') + c.delta); return; }
  el.classList.add(c.delta > 0 ? 'flash-up' : 'flash-down');
  setTimeout(function () { el.classList.remove('flash-up', 'flash-down'); }, 1500);
  // ⚠️ 数字滚动只在**有 `.mdb` 那种可滚的元素**上做（结算屏那种）；
  //    卡面上的 HP 条是连续读数，改宽度更合适 —— 这里只亮不滚。
}


/**
 * 这是不是**一次性**的（消耗品）—— UI 侧的小标记与 `buildChanges` 的演出一档共用它。
 *
 * ⚠️ **判据只有这一条**（`kind === '消耗品'`），与 `rules/ability.ts·isOneShot` 字面一致。
 *    ⚠️ 这里**没有** import 规则层那个函数：整个 `index.html` 是**零依赖**的单文件
 *    （浏览器直接开，没有构建步骤）⇒ 两处各写一个字面量，**由这条注释担保它们一致**。
 */
function isOneShotKind(kind){ return kind === '消耗品'; }

/** 判一个人"没了"（死亡/疯狂）—— 只认 `status`（**派生**的，账本侧唯一口径） */
function isGoneStatus(st){ return st === '死亡' || st === '疯狂'; }

/**
 * 一张**物卡**（玩家自己带的东西，2026-10-06 恢复为卡带上的**独立卡**）。
 *
 * ⚠️⚠️ **它为什么必须是独立卡，而不是贴在人卡下的小片**（这一条是踩出来的）：
 *   早先它画在人卡下面的 `.carryrow` 里，连锁出两个问题——
 *     · 它**盖住人卡下半部分**，`closest('[data-act]')` 先命中小卡
 *       ⇒ 「人物卡点不开」；
 *     · 属下的卡不带 `data-kind`（未入队者不可拖）⇒ **他身上的东西拖不动**，
 *       而「交给别人」**只能靠拖**（`/api/give`）⇒ 这条路整个断掉。
 *   ⇒ 独立成卡：人卡干净（点得开）、每件东西都是可拖的源（交得出去）。
 *   「他带了什么」在**点开的详情浮层**里看（`sheetPerson` 的「携带」一节）。
 *
 * @param it view 里的物品（`{id, name, kind, bonus[], …}`）
 * @param i 卡带序号（`style="--i"`，CSS 变量，控制进场次序）
 */
function handItemCard(it, i){
  const one = isOneShotKind(it.kind);
  return '<div class="hcard item k' + esc(it.kind || '特殊物品') + '" style="--i:' + i + '"' +
    ' data-act="detail" data-kind="item" data-id="' + it.id + '"' +
    ' data-name="' + esc(it.name) + '"' +
    // ⚠️ `data-to-whom="npc000"` ＝ 它**在谁名下**：拖到别人身上＝转给他，
    //    拖回自己那张卡＝收回（`canGiveTo` 收 `npc000` 那一支）。
    ' data-to-whom="npc000"' +
    ' title="' + esc(it.name) + ' —— 点开看；按住拖到某人身上就是交给他">' +
    '<div class="hn">' + esc(it.name)
      + (one ? '<span class="hone" title="他办完一件事就用掉了">尽</span>' : '') +
    '</div>' +
    // ⚠️ 2026-10-07 用户裁定（第三批）：物卡也要显示**基本性质**（像人卡显示 identity 那样）
    '<div class="hi">' + esc(it.kind || '特殊物品') + '</div>' +
    // ⚠️ 2026-10-07：加成改成**绿词条＋属性图标**（`bonusTags`）——
    //   原先那行是「物品小图标 ＋ 素文本」，小图标在 9px 下糊成一个"o"，
    //   用户原话：「之前有的那个好看的绿色词条和里面的『争斗』属性图标怎么没了」。
    (arr(it.bonus).length ? '<div class="hb2">' + bonusTags(it.bonus, 9) + '</div>' : '') +
  '</div>';
}

/** 人按 id 建索引（`view.people` ＋ 主角） */
function indexPeople(v){
  const m = {};
  const push = (p) => { if (p) m[p.id] = p; };
  push(v.me);
  arr(v.people).forEach(push);
  return m;
}

/** 物按 id 建索引：id → `{name, kind, holder}`（**跨所有人**） */
function indexItems(v){
  const m = {};
  const push = (p) => arr(p && p.items).forEach((it) => {
    if (it) m[it.id] = { name: it.name, kind: it.kind, holder: p.id };
  });
  push(v.me);
  arr(v.people).forEach(push);
  return m;
}


/**
 * 数值差：**每个**读数都报，绝不漏掉任何一处。
 * @returns `[{kind:'num', path, label, from, to, delta, who}]`
 */
function numDiffs(before, after){
  const out = [];
  const push = (path, label, a, b, who) => {
    if (typeof a === 'number' && typeof b === 'number' && a !== b) {
      out.push({ kind: 'num', path: path, label: label, from: a, to: b, delta: b - a, who: who || '' });
    }
  };
  // 主角与全局
  push('gold', '金币', before.gold, after.gold);
  push('desire', '欲念',
    before.desire ? before.desire.value : 0, after.desire ? after.desire.value : 0);
  const repA = before.rep || {}, repB = after.rep || {};
  for (const k of Object.keys(repB)) push('rep.' + k, k, repA[k] || 0, repB[k]);
  // ⚠️ 每人 HP/SAN —— 旧的那份 `readMeters` 只抄主角的，这里**全都报**
  // ⚠️ 六维属性**不在这里报**（2026-10-07 用户裁定）：属性的动画不好做，
  //    改为在**结算卡**上写一行「谁谁谁 某属性 +x」的小字（见 `attrChangeLines`）。
  const bp = indexPeople(before), ap = indexPeople(after);
  for (const id of Object.keys(ap)) {
    const p = bp[id], q = ap[id];
    if (!p) continue;
    push(id + '.hp', 'HP', p.hp, q.hp, id);
    push(id + '.san', 'SAN', p.san, q.san, id);
  }
  return out;
}

/**
 * 六维属性的**文字版变化清单**（2026-10-07 用户裁定）——
 * 属性变化的动画不好做，就在结算卡上写一行小字：「某某 争斗 +1」。
 * @returns `[{name, attr, delta}]`（只含真变了的那几条）
 */
function attrChangeLines(before, after){
  const out = [];
  if (!before || !after) return out;
  const ADV = ['争斗', '敏捷', '智慧', '魅力', '社交', '感知'];
  const bp = indexPeople(before), ap = indexPeople(after);
  for (const id of Object.keys(ap)) {
    const p = bp[id], q = ap[id];
    if (!p) continue;
    for (const k of ADV) {
      const a = (p.attrs || {})[k] || 0, b = (q.attrs || {})[k] || 0;
      if (a !== b) out.push({ name: q.name || p.name || id, attr: k, delta: b - a });
    }
  }
  return out;
}

function readMeters(v){
  if (!v) return null;
  return {
    gold: v.gold,
    desire: v.desire ? v.desire.value : 0,
    rep: Object.assign({}, v.rep || {}),
    hp: v.me ? v.me.hp : 0,
    san: v.me ? v.me.san : 0,
  };
}

/**
 * 比出两份 view 的差 —— **只报非零的那些**。
 * @returns `[{key, label, from, to, delta}]`
 */
function meterDiffs(before, after){
  if (!before || !after) return [];
  const out = [];
  const push = (key, label, a, b) => {
    if (typeof a === 'number' && typeof b === 'number' && a !== b) {
      out.push({ key: key, label: label, from: a, to: b, delta: b - a });
    }
  };
  push('gold', '金币', before.gold, after.gold);
  push('desire', '欲念', before.desire, after.desire);
  push('hp', 'HP', before.hp, after.hp);
  push('san', 'SAN', before.san, after.san);
  // 声望：逐项比（侠名/怪名/…），只报变动的那几项
  for (const k of Object.keys(after.rep || {})) {
    push('rep:' + k, k, (before.rep || {})[k] || 0, after.rep[k]);
  }
  return out;
}

/**
 * 一行「资源怎么动了」—— 出现在结算浮层里，**在正文之下、确认之上**。
 * ⚠️ 数字用 `rollTo` 从旧值**滚到**新值（不是直接写终值）—— 直接写的话
 *    玩家看到的仍是"一个数字变了"，只有"看见它滚过去"才构成一次事件。
 * ⚠️ 涨跌各有颜色与方向箭头，且**箭头是形状**不是"+" "-"（色觉障碍也读得出）。
 */
function meterDeltaHtml(diffs){
  if (!diffs.length) return '';
  const items = diffs.map(function (d, i) {
    const up = d.delta > 0;
    return '<span class="mdl ' + (up ? 'up' : 'dn') + '" style="--i:' + i + '">'
      + '<span class="mdk">' + esc(d.label) + '</span>'
      + '<span class="mddir" aria-hidden="true">' + (up ? '▲' : '▼') + '</span>'
      + '<span class="mdb" data-from="' + d.from + '" data-to="' + d.to + '">'
        + (up ? '+' : '') + d.delta + '</span>'
      + '<span class="mdabs">' + d.from + ' → ' + d.to + '</span>'
      + '</span>';
  }).join('');
  return '<div class="meters">' + items + '</div>';
}

/**
 * 属性变化的那几行**小字**（2026-10-07 用户裁定）—— 出现在结算卡里、
 * 资源增减词条之下：「某某 争斗 +1」。没有变化就不画这一块。
 * ⚠️ 与 `.meters` 同族的小字排版；涨跌用符号带出（+ / −），不再另做动画。
 */
function attrChangeHtml(lines){
  if (!lines || !lines.length) return '';
  const items = lines.map(function (c) {
    return '<span class="acline">' + esc(c.name) + ' <b>' + esc(c.attr) + '</b> '
      + (c.delta > 0 ? '+' : '') + c.delta + '</span>';
  }).join('');
  return '<div class="attrlines">' + items + '</div>';
}

/**
 * 把 `[data-from][data-to]` 的数字从旧值滚到新值。
 * ⚠️ **在 `render()` 之后调**（DOM 已经是新的），且**幂等**（`dataset.done` 防重滚）——
 *    `render()` 一个动作会跑一次，而结算浮层的 `innerHTML` 也可能被重画。
 */
function rollMeters(){
  var nodes = document.querySelectorAll('.mdb[data-from][data-to]');
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    if (el.dataset.done === '1') continue;
    el.dataset.done = '1';
    var from = Number(el.dataset.from), to = Number(el.dataset.to);
    if (!isFinite(from) || !isFinite(to) || from === to) { el.textContent = String(to); continue; }
    rollNumber(el, from, to, 620);
  }
}

/** 把一个元素的数字从 `a` 滚到 `b`（rAF 驱动，只改 textContent ⇒ 不引发布局抖动） */
function rollNumber(el, a, b, ms){
  if (!el || !window.requestAnimationFrame) { el.textContent = String(b); return; }
  var t0 = performance.now();
  // 缓动：减速收尾（与 `--ease` 同一套读感）
  function step(now){
    var k = Math.max(0, Math.min(1, (now - t0) / ms));
    var e = 1 - Math.pow(1 - k, 3);
    var val = a + (b - a) * e;
    el.textContent = (Math.abs(val - Math.round(val)) < 0.02 ? String(Math.round(val))
      : val.toFixed(1));
    if (k < 1) window.requestAnimationFrame(step);
    else el.textContent = String(b);
  }
  window.requestAnimationFrame(step);
}

/**
 * 把一段结算文字拆成**句**，逐段浮现。
 *
 * ⚠️ 为什么拆句不拆字：逐字浮现会打断阅读（玩家读到"他犹豫了一"就被迫看下一个字）。
 *   句子是中文的天然停顿 —— 按 `。！？；` 断，读起来才是一句一句落定。
 * ⚠️ 断点**保留**（句号跟着前一段走），否则拼回去会少标点。
 * ⚠️ 超过 12 段就**不再拆**（退化成一整块）—— 一段 20 句的结算逐句播要 2.4s，
 *   那是在拖时间，不是在演出。
 */
/**
 * **判定盘** —— 结算浮层左侧那块"这次成没成"（学《苏丹》左盘右纸的对位）。
 *
 * ⚠️ 它**只回答判定**，不回答"发生了什么" —— 后者是右边那叠纸的事。
 *   两者混在一屏里，玩家要同时读数字和叙事，眼睛无处落。
 * ⚠️ **没有 `view.roll` 就不画**（档 A 点选 / 场景轮次 / 直接成功失败都不掷骰）。
 *   刻意**不画一个空的盘** —— 一个"今天没掷骰"的占位框只会让人以为坏了。
 *
 * 盘面四行，自上而下是**判定的因果链**：
 *   ① 参与属性符号（用掉了哪几枚）② 主事者 ③ d20 → 修正 → R ④ A 与档位
 * ⚠️ **端点恒定那条例外要显式说**（1 / 20）：`rules/check.ts` 里它是**先于一切修正**判的，
 *   玩家看到"d20=20 却按大失败算"会以为算错了 —— 得告诉他这是规矩。
 */
function rollPanelHtml(v){
  const r = v && v.roll;
  if (!r) return '';
  const ep = r.endpoint
    ? '<div class="rlep">端点 ' + r.raw + ' · <b>' + esc(r.endpoint) + '</b>（先于一切修正）</div>'
    : '';
  const mod = r.diceRolls.length
    ? '<span class="rlmod">修正 ' + (r.modifierTotal >= 0 ? '+' : '') + r.modifierTotal
      + '（' + r.diceRolls.map((d) => (d >= 0 ? '+' : '') + d).join(' ') + '）</span>'
    : '<span class="rlmod">无修正</span>';
  const attrs = arr(r.attrs).map(function (k) {
    return '<span class="esig mini" title="' + esc(k) + '">' + attrSigil(k, 16) + '</span>';
  }).join('');
  return '<div class="rollpanel t' + (esc(r.tier) === '大成功' || esc(r.tier) === '困难成功' || esc(r.tier) === '成功' ? 'ok' : 'no') + '">'
    + '<div class="rlrow rlwho"><span class="rlk">主事</span>'
      + '<span class="rlv">' + esc(r.leaderName) + '</span></div>'
    + '<div class="rlrow rlattrs"><span class="rlk">用到的</span>' + (attrs || '<span class="rlv">—</span>') + '</div>'
    + '<div class="rldie" title="d20 原始 ' + r.raw + ' → 修正后 ' + r.adjusted + '">'
      + '<span class="rldnum" data-raw="' + r.raw + '">' + r.raw + '</span>'
      + '<span class="rld20">d20</span></div>'
    + '<div class="rlrow rlarith"><span class="rldnum small" data-adj="' + r.adjusted + '">' + r.adjusted + '</span>'
      + '<span class="rleq">=' + r.raw + ' ' + (r.modifierTotal >= 0 ? '+' : '−') + ' ' + Math.abs(r.modifierTotal)
      + '</span>' + mod + '</div>'
    + '<div class="rlvs">要 <b>' + r.a + '</b> · ' + esc(r.tier) + '</div>'
    + ep
    + '</div>';
}

function segmentHtml(text, cls){
  const t = String(text || '');
  if (!t) return '';
  const parts = t.split(/(?<=[。！？；])/);
  if (parts.length > 12) return '<span class="' + cls + '">' + esc(t) + '</span>';
  return parts.filter(Boolean).map(function (s, i) {
    return '<span class="' + cls + '" style="--seg:' + i + '">' + esc(s) + '</span>';
  }).join('');
}

function handledHtml(){
  const opts = arr(handled.options).map((t, i) =>
    '<button class="opt' + (i === handled.chosen ? ' picked' : ' dim') + '">' + esc(t) + '</button>').join('');
  const res = handled.result
    ? '<div class="res"><div class="sub" style="color:var(--muted)">结果</div><div>'
        + segmentHtml(handled.result, 'segline') + '</div></div>'
    : '<div class="res"><div class="sub" style="color:var(--muted)">这一步没有带来什么下文。</div></div>';
  // ⚠️ 2026-10-05：资源增减**演出来**（`meterDiffs` 是纯 UI 侧算的，零请求）。
  //    它排在「结果」之后、确认之前 —— 玩家的视线是「读结果 → 看变了什么 → 确认」。
  // ⚠️ `rollPanelHtml` 返回 `''` 时（这一次没掷骰）整个 `rlwrap` 也塌成空 ——
  //    刻意不给它留位置：空盘会被读成"坏了"。
  // ⚠️ 盘与纸**并排**（`.rlpair`）：左盘右纸是这一屏的骨架，
  //    盘只占 210px，其余全给正文 —— 数字不该占掉叙事的宽度。
  return eventCardHtml(handled) + opts
    + '<div class="rlpair">'
      + '<div class="rlleft">' + rollPanelHtml(S && S.view) + '</div>'
      + '<div class="rlright">' + res + meterDeltaHtml(meterDiffs(beforeMeters, readMeters(S && S.view))) + '</div>'
    + '</div>'
    + '<div class="ops" style="margin-top:12px"><button class="primary" data-act="ackHandled">确认</button></div>';
}

// ═══ 骰子动画弹窗（2026-10-07 用户裁定）══════════════════════════
//
// 规则回顾（`rules/check.ts` · `rules/dice.ts` · `rules/ability.ts`，动画必须照它演）：
//   · **A = 主事者参与属性的均值**（向下取整、≤3 项、含物品加成，钳 [1,20]）
//     —— 多个属性时就是**取平均**，不是取最高；
//   · 原始 d20：自然 20 ⇒ 大失败、自然 1 ⇒ 大成功，**先于一切修正**（端点局不掷修正骰）；
//   · 其余：R = d20 + 修正 —— **惩罚骰是 +d4、奖励骰是 −d4**（三源合计钳 ±2 个）；
//   · 档位：R≤⌊A/5⌋ 大成功 · R≤⌊A/2⌋ 困难成功 · R≤A 成功 · 否则失败。
// ⇒ 回答"惩罚骰/奖励骰是 4 面还是 6 面"：**都是 d4（四面骰）**。
//
// ⚠️ 动画是**纯展示**：骰在排布那一刻就掷完了（服务端 `handleEvent`），
//    这里播的正是那份既定结果 —— 不掷第二次、不重算。
// ⚠️ 动画实现：**纯 CSS/JS**（抖动 + 数字闪烁 + 落定缩放），不引外部骰子库 ——
//    项目是零依赖单文件，而 three.js 那族 3D 骰子（几百 KB）只为一次演出不值；
//    CSS 那族的好处是**落点可以钉死在既定值上**（3D 物理骰反而难保证落点）。

/** 惩罚/奖励骰各几个（端点局一个修正骰都没有 —— `diceRolls` 是空的） */
function diceSplit(d){
  if (d.modifierTotal > 0) return { pen: d.diceRolls.length, bon: 0 };
  if (d.modifierTotal < 0) return { pen: 0, bon: d.diceRolls.length };
  return { pen: 0, bon: 0 };
}

/** 结果算式那一行（掷完才出现）：20面骰 +（奖励骰和）−（惩罚骰和）= R，档位 */
function diceResultLine(d){
  if (d.endpoint) {
    return '<div class="diceres">投掷结果：20面骰 <b>' + d.raw + '</b>'
      + '（端点 ' + d.raw + ' · 先于一切修正）—— <b>' + esc(d.tier) + '</b></div>';
  }
  const sp = diceSplit(d);
  const bonRolls = sp.bon ? d.diceRolls.slice(0, sp.bon) : [];
  const penRolls = sp.pen ? d.diceRolls.slice(sp.bon) : [];
  const bonSum = bonRolls.reduce((a, b) => a + b, 0);
  const penSum = penRolls.reduce((a, b) => a + b, 0);
  let s = '投掷结果：20面骰 <b>' + d.raw + '</b>';
  if (sp.bon) s += ' +（奖励骰 ' + bonRolls.join('+') + ' = ' + bonSum + '）';
  if (sp.pen) s += ' −（惩罚骰 ' + penRolls.join('+') + ' = ' + penSum + '）';
  return '<div class="diceres">' + s + ' = <b>' + d.adjusted + '</b>，<b>' + esc(d.tier) + '</b></div>';
}

/**
 * 骰子动画弹窗本体 —— 左 1/2 骰区（点击投掷）、右 1/2 处理信息 ＋「查看结算结果」。
 * ⚠️ `diceState.rolled` 为真时骰面**直接渲染既定值** —— 重渲染（比如窗口变化）不重播。
 */
function dicePopupHtml(r){
  const d = r.roll;
  const sp = diceSplit(d);
  // ── 左 1/2：骰区 ──
  const num = (side, i) => {
    if (!diceState.rolled) return '?';
    if (side === 'd20') return d.raw;
    if (side === 'p') return d.diceRolls[i];
    return d.diceRolls[sp.pen + i];   // 奖励骰排在惩罚骰后面（服务端就是一份连续数组）
  };
  const dice = ['<div class="die d20"><div class="dshape"><span class="dnum">' + num('d20') + '</span></div><span class="dtag">d20</span></div>'];
  for (let i = 0; i < sp.pen; i++) {
    dice.push('<div class="die d4 pen" data-i="' + i + '"><div class="dshape"><span class="dnum">' + num('p', i) + '</span></div><span class="dtag">惩罚</span></div>');
  }
  for (let i = 0; i < sp.bon; i++) {
    dice.push('<div class="die d4 bon" data-i="' + i + '"><div class="dshape"><span class="dnum">' + num('b', i) + '</span></div><span class="dtag">奖励</span></div>');
  }
  const left =
    '<div class="diceleft' + (diceState.rolled ? ' done' : '') + '" data-act="diceRoll" title="点击投掷">'
    + '<div class="dicepit">' + dice.join('') + '</div>'
    + (diceState.rolled ? diceResultLine(d) : '<div class="dicehint">点击画面进行投掷</div>')
    + '</div>';
  // ── 右 1/2：处理信息（事件标题 ＋ 处理者卡槽 ＋ 判定属性 ＋ 骰况）──
  const meId = S && S.view && S.view.me ? S.view.me.id : '';
  const ps = arr(d.participants);
  const slots = [];
  for (let i = 0; i < 4; i++) {
    const p = ps[i];
    if (!p) { slots.push('<div class="dslotcard empty"></div>'); continue; }
    const lead = p.name === d.leaderName;
    slots.push('<div class="dslotcard' + (lead ? ' lead' : '') + '" data-pid="' + esc(p.id) + '">'
      + '<span class="nm">' + esc(p.name) + '</span>'
      + '<span class="sub">' + (lead ? '主事者' : (p.id === meId ? '我' : '随行')) + '</span>'
      + '</div>');
  }
  const attrLine = arr(d.attrs).length
    ? '判定属性为 ' + d.attrs.map((a) => esc(a.attr) + '（<b>' + a.value + '</b>）').join(' 和 ')
      + '，实际生效数值为均值 <b>' + d.mean + '</b>'
      + (d.a !== d.mean ? '（属性顶破天花板，钳为 ' + d.a + '）' : '')
    : '这次没有声明判定属性';
  const diceLine = (sp.pen || sp.bon)
    ? '根据场景情况，本次投掷有 <b>' + sp.pen + '</b> 个惩罚骰、<b>' + sp.bon + '</b> 个奖励骰'
    : '根据场景情况，本次投掷没有惩罚骰与奖励骰';
  const right =
    '<div class="diceright">'
    + '<div class="dtitle">' + esc(r.title || '投掷判定') + '</div>'
    + '<div class="drow"><span class="dk">处理者</span><div class="dslots">' + slots.join('') + '</div></div>'
    + '<div class="drow">' + attrLine + '</div>'
    + '<div class="drow">' + diceLine + '</div>'
    + '<div class="ops" style="margin-top:auto"><button class="primary" data-act="diceGo"'
      + (diceState.rolled ? '' : ' disabled')
      + ' title="' + (diceState.rolled ? '' : '先投掷，才看得到结算结果') + '">查看结算结果</button></div>'
    + '</div>';
  return '<div class="dicegrid">' + left + right + '</div>';
}

// ═══════════════════════════════════════════════════════════════════
// 画布的平移与缩放（2026-10-05 · 学《苏丹的游戏》的可拖地图）
// ─────────────────────────────────────────────────────────────────
// 用户裁定这一步做到「**只加拖动与缩放**」——不把事件按地点摆成真地图
//（那会与《设定.md》「不搭地图系统、不设区域层级」冲突，也会造出一个
//  玩家能看见却走不动的假世界）。
//
// 四条纪律：
//   ① **纯 Pointer Events**：HTML5 的 `dragstart/drop` 在触屏上是坏的。
//      不用 `wheel` 事件而用 `wheel` 的 `preventDefault` —— 页面滚动会
//      抢走它，必须在 `passive:false` 的监听里拦。
//   ② **缩放锚在指针上**：以指针所指的那一点为不动点缩放，
//      否则"滚轮缩放"会让目标漂走（缩到一半发现看不清自己要看的东西了）。
//   ③ **范围钳制**：0.6×~2.2×。再小事件块会小到点不准，再大画布会空到没有信息。
//   ④ **平移也钳制**：不许把整个台面拖出窗口 —— 否则玩家会"找不到自己的地图"，
//      而那是一种很具体的迷路感。可视范围随缩放放宽（放大后允许拖更远）。
//
// ⚠️ 状态活在页面上（不落账本）⇒ `resetLocalViewState()` 里一起清：
//    读档 / 换局之后地图回到原位。
// ⚠️ **拖动平移与拖拽派人是两套手势**，靠"起手点"分开：
//    手指/鼠标落在**空白**处 ＝ 平移；落在**卡片**上 ＝ 派人的拖拽。
//    两者都用 Pointer Events，但一个走 `closest('.cvchip')` 一个不走。
// ═══════════════════════════════════════════════════════════════════
const CANVAS_ZOOM_MIN = 0.6;
const CANVAS_ZOOM_MAX = 2.2;
/** 当前视图 `{scale, x, y}` —— 只活在页面上 */
let cvView = { scale: 1, x: 0, y: 0 };
/** 正在平移吗：`{px, py, ox, oy}`（`px/py` 是指针起点，`ox/oy` 是平移量起点） */
let cvPan = null;
/** 动画抑制的计时器（滚轮连滚时关掉 transition，松手后恢复） */
let cvNoAnimT = null;

/** 把 `cvView` 写进 DOM —— **只写 transform 一条**，别的都不碰。 */
function applyCanvasView(){
  const pan = document.querySelector('.canvas-pan');
  if (!pan) return;
  pan.style.transform = 'translate(' + cvView.x.toFixed(1) + 'px,' + cvView.y.toFixed(1) + 'px) '
    + 'scale(' + cvView.scale.toFixed(3) + ')';
}

/**
 * 钳制平移量 —— **只在放大档位**限制（不许把台面拖出窗口）。
 *
 * ⚠️⚠️ 2026-10-05 踩过一个大坑，第一版写成"上限 = `w*(s-1)/2`，`max(0, …)`"，
 *   探针实测发现：**缩小档位下平移被强行归零**，而缩放锚点公式在缩小档位
 *   **必须**有非零平移量才能维持"指针下那一点不动" ⇒ 两者互相打架，
 *   表现是**一滚轮地图就往一个方向窜**（探针量到锚点漂 169px）。
 *
 *   正确的语义：**`s ≤ 1` 时台面比窗小，压根没有"拖出去"这种可能 ⇒ 不限制**；
 *   `s > 1` 时台面比窗大，最多拖到"刚好露出窗的另一边"为止。
 *   —— 也就是上限只在放大时存在，且上限随放大倍数增长。
 *
 * @param w 窗宽  @param h 窗高
 */
function clampCanvasView(w, h){
  const s = cvView.scale;
  // 缩小 / 原始档位：不限（台面比窗还小，随便拖也不会丢）
  if (s <= 1) return;
  const limX = (w * (s - 1)) / 2;
  const limY = (h * (s - 1)) / 2;
  cvView.x = Math.max(-limX, Math.min(limX, cvView.x));
  cvView.y = Math.max(-limY, Math.min(limY, cvView.y));
}

// ⚠️ 落在**空白**处才起平移（落在卡片上的是"派人的拖拽"，那是另一套手势）。
document.addEventListener('pointerdown', (ev) => {
  const box = ev.target.closest ? ev.target.closest('.canvas') : null;
  if (!box) return;
  // 卡片上不抢：那属于派人的拖拽（下面那段 pointerdown 会接手）
  if (ev.target.closest('.cvchip')) return;
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const r = box.getBoundingClientRect();
  cvPan = { px: ev.clientX, py: ev.clientY, ox: cvView.x, oy: cvView.y, w: r.width, h: r.height };
  if (document.body && document.body.classList) document.body.classList.add('panning');
});

document.addEventListener('pointermove', (ev) => {
  if (!cvPan) return;
  cvView.x = cvPan.ox + (ev.clientX - cvPan.px);
  cvView.y = cvPan.oy + (ev.clientY - cvPan.py);
  clampCanvasView(cvPan.w, cvPan.h);
  applyCanvasView();
});

function endCanvasPan(){
  if (!cvPan) return;
  cvPan = null;
  if (document.body && document.body.classList) document.body.classList.remove('panning');
}
document.addEventListener('pointerup', endCanvasPan);
document.addEventListener('pointercancel', endCanvasPan);

// 滚轮缩放 —— `passive:false` 才拦得住页面滚动。
// ⚠️ 缩放**锚在指针上**：算"指针所指的那个点"平移前后分别落在哪，再平移回去。
document.addEventListener('wheel', (ev) => {
  const box = ev.target.closest ? ev.target.closest('.canvas') : null;
  if (!box) return;
  ev.preventDefault();
  const r = box.getBoundingClientRect();
  // 指针相对窗中心的偏移（缩放的锚点）
  const ax = ev.clientX - (r.left + r.width / 2);
  const ay = ev.clientY - (r.top + r.height / 2);
  const prev = cvView.scale;
  // deltaY 每一格约 100，取 0.0016/px ⇒ 滚一格约 1.16 倍
  let next = prev * (1 - ev.deltaY * 0.0016);
  next = Math.max(CANVAS_ZOOM_MIN, Math.min(CANVAS_ZOOM_MAX, next));
  if (next === prev) return;
  const k = next / prev;
  // ── 锚点不动的推导（照抄这一行，别"顺手简化"）────────────────────────────
  //   台面上一点的屏幕位置：`p' = p*k + t`（p 是它在**未缩放**坐标系里的位置，t 是平移量）。
  //   缩放前后它都在指针 a 处：`a = p*k + t_new` 且 `a = p*prev + t_old`
  //   ⇒ `p = (a - t_old) / prev`，代回得
  //   ⇒ `t_new = a - ((a - t_old)/prev) * next = a - (a - t_old) * k`
  // ⚠️ 这个式子里**旧平移量 `t_old` 必须在算之前就读出来** —— 一边算一边改 `cvView`
  //   会用到新值，得到"缩放时地图往反方向窜"的结果（第一版写错，滚轮一动就跳）。
  const tx = cvView.x, ty = cvView.y;
  cvView.x = ax - (ax - tx) * k;
  cvView.y = ay - (ay - ty) * k;
  cvView.scale = next;
  clampCanvasView(r.width, r.height);
  // 连滚时要跟手 ⇒ 临时关掉 transition
  const pan = document.querySelector('.canvas-pan');
  if (pan) {
    pan.classList.add('noanim');
    if (cvNoAnimT) clearTimeout(cvNoAnimT);
    cvNoAnimT = setTimeout(() => { pan.classList.remove('noanim'); cvNoAnimT = null; }, 260);
  }
  applyCanvasView();
}, { passive: false });

// ── 拖拽（C 轮）─────────────────────────────────────────────────
// 三步：按下 → 位移超过阈值才"起拖" → 松手看落在哪一格。
// ⚠️ 判据全部与点选共用（见文件顶上那一段声明），这里**不新增任何规则**。
/**
 * 按 id 找出**这条事件**（`canDropOn` 要读它的 `dispatchable`）。
 * ⚠️ 事件散在两池里（`todo` 待处理 / `waiting` 处理中），而三格 `data-ev` 两种都可能出现 ——
 *    只查 `todo` 的话，一张「在办」的卡展开后拖东西进去会一律判 false（静默失灵）。
 * ⚠️ 找不到就返回 `null`（调用方拒），**不猜**：一条 id 对不上的事件不该被当成"两者皆可"。
 */
function eventOf(id){
  return arr(S && S.view && S.view.todo).concat(arr(S && S.view && S.view.waiting))
    .find((e) => e.id === id) || null;
}

/** 这一格接不接这件东西 —— 答「**放不放得进**」；`who` 那一格与点选共用 `canDispatchTo` */
/** 手上金币（`S.view` 可能为空 —— 标题屏与刚开局的瞬间） */
/** 人 id → 名字（取回时要说"取回了他"，不能报一串 id） */
function nameOfId(id){
  if (id === (S.view && S.view.me && S.view.me.id)) return '我';
  const f = arr(S && S.view && S.view.people).find((x) => x.id === id);
  return f ? f.name : id;
}

// ⚠️⚠️ 2026-10-07（用户裁定）：**金币计算永远是串行的** —— 事件台上垫了多少，
// 手牌（与顶栏）立马扣多少；点 × / 拖回 ⇒ 原额立刻回来。真正的扣账在 arrange
// 提交那一刻由服务端做，所以**成功回调里必须把那件事的 picks 清掉**（见 arrange
// 分支的注释）—— 否则"已扣过的账"再被 `placedGold()` 减一次 = 凭空少钱。
function placedGold(){
  let n = 0;
  for (const id in picks) n += Math.max(0, (picks[id] && picks[id].gold) || 0);
  return n;
}
function haveGold(){ return S && S.view ? Math.max(0, (S.view.gold || 0) - placedGold()) : 0; }

/**
 * 在某个卡槽上**闪一句话**（2026-10-05 · 金币拖拽的第 ① 档用）。
 *
 * ⚠️ 为什么不弹 toast：toast 是**全局**的，而这件事是**这一格**的 ——
 *    玩家此刻的眼睛盯着钱格，不盯着屏幕顶上一条飘过去的字。
 * ⚠️ 用完即清（1200ms）：它是一次性反馈，不该在槽上留疤。
 */
function flashSlot(slot, text){
  if (!slot) return;
  let f = slot.querySelector('.slotflash');
  if (!f) {
    f = document.createElement('div');
    f.className = 'slotflash';
    slot.appendChild(f);
  }
  f.textContent = text;
  setTimeout(function () { if (f && f.parentNode) f.parentNode.removeChild(f); }, 1200);
}

// ⚠️ 2026-10-07 用户裁定：「删掉这个奇怪的携带特效」——
//    旧的 markCarried（22px 小方块从源卡缩着飞到目标人卡）整函数已删，
//    连带 `.carryfly` / `@keyframes carryFly` / `.hcard.carried-in` 三段 CSS。
//    交出去之后 `api()` 里的 `render()` 重画一遍就是全部反馈：卡带少一张、
//    `@n` 变一个数、详情页绿槽挪位 —— 事实本身就够清楚。

/**
 * 这件东西能不能交给（或从）那个人（2026-10-06）。
 *
 * ⚠️ **判据全部来自 view**，与服务端 `/api/give` 里那道闸门⑤ **同一份数据**
 *    （`view` 每人 `items` 与 `holder` 都是账本的投影）⇒ UI 置灰与服务端拒绝一致。
 *    ⚠️ 这里**不重算 `CARRY_CAP`**：服务端会用 `who.items.length` 再判一次，
 *    两处各写一份上限就会漂（我上一轮就是这么凭空造了一个字段）。
 *
 * @param itemId 物品 id
 * @param toWhom 目标人 id（`npc000` = 玩家自己 ＝ 收回）
 */
function canGiveTo(itemId, toWhom){
  const v = S && S.view;
  if (!v || !toWhom) return false;
  const who = toWhom === v.me.id ? v.me : arr(v.people).find((p) => p.id === toWhom);
  if (!who) return false;
  // ⚠️⚠️ 2026-10-06 补一个**漏掉的判据**：**未入队的人不收东西**。
  //    改前这里只判"他有没有满"，于是东西能拖给一个尚未入队的人 ——
  //    那是 `handCard` 的 `{noDrag}`（不给 `data-kind`）之外的**另一条漏洞**：
  //    他的卡不能当拖拽**源**，但**还能当落点**。
  //    ⚠️ 口径与 `卡槽与LLM分工.md` §1.2 那一行同源：
  //    「未入队的人**不给你东西**」—— 人没在你这边，装备就不进他的账。
  if (toWhom !== v.me.id && !who.affiliated) return false;
  // 物品必须**存在且没被消耗**
  const all = arr(v.me.items).concat(arr(v.people).flatMap((p) => arr(p.items)));
  const it = all.find((x) => x.id === itemId);
  if (!it) return false;
  // 他已经拿着 ⇒ 这次点的是**取回**（收回自己）或**转移**（给第三个人），都合法
  const already = arr(who.items).some((x) => x.id === itemId);
  if (already) return true;
  // ⚠️ 上限：4 位（闸门 ⑤ 的 `CARRY_CAP`）—— 只在**加东西**时才算；
  //    收回／转移都**不会让他变满**，所以上面那一支已经 return 了。
  return arr(who.items).length < 4;
}

/** 这个人**此刻正站在**某个事件台/功能单的槽里吗？（页面态：`picks` / `fixPicks`） */
function personPlacedInDesk(pid){
  for (const id in picks) {
    const op = picks[id];
    if (op && arr(op.participants).indexOf(pid) >= 0) return true;
  }
  for (const fp in fixPicks) if (fixPicks[fp] === pid) return true;
  return false;
}

/** 有任何一件事**已垫了金币**吗？（事件台 `picks[*].gold` ＋ 功能单 `fixGold`） */
function goldPlacedAnywhere(){
  for (const id in picks) if (picks[id] && picks[id].gold > 0) return true;
  for (const fp in fixGold) if (fixGold[fp]) return true;
  return false;
}

function canDropOn(slot, src){
  if (!slot || !src) return false;
  const d = slot.dataset.drop;
  // ⚠️⚠️ 2026-10-06 修用户问题 10：人卡 / 物卡**没有 `data-drop`**
  //   （那是事件卡里的槽才有的）⇒ `d` 是 `undefined` ⇒ 改前**掉出所有分支**返回 false
  //   ⇒ 物卡拖到人卡上**永远不成立**（用户原话：「装备还是不能正常的通过拖拽
  //   在人物身上装备和卸下」）。
  //   ⇒ 这里显式认下**「这张卡的主人是它」**那条路（`data-to-whom`）：
  //     · 物卡 → 交给那个人（`canGiveTo` 判容量与归属）
  //     · 人卡 → 拖到别人身上是"让他去办"？⚠️ **不成立**（那要拖事件卡的「人」格），
  //       所以人卡只认**拖到自己的卡上＝收回归属**那一支，其余一律拒。
  if (d === undefined && slot.dataset.toWhom !== undefined) {
    return src.kind === 'item' ? canGiveTo(src.id, slot.dataset.toWhom) : false;
  }
  // ⚠️⚠️ 2026-10-07：固定功能卡（医馆疗伤 / 神殿净化）—— 只收**一个人**，
  //    判据与 `/api/restore` 服务端那道闸同源：已满（≥3）的不用去、剩余行动力
  //    不够点数的去不了、没入队/没了的不收。
  // ⚠️⚠️ 2026-10-07（用户裁定）：**整条手牌带都是「收回」的落点** ——
  //    卡槽里的物品要能拖回手牌区。此前只有「拖到某张卡的身上」一条路
  //    （`data-to-whom`），拖到带子空处 `dropHit` 为 null ⇒ 毫无反应，
  //    玩家以为"拖不回来"（用户原话：「上面的物品无法正常拖拽到手牌区」）。
  if (d === 'hand') {
    // ⚠️⚠️ 2026-10-07（用户第 1 条）：手牌带现在收**三种**「拿回来」——
    //   · 物卡：别人的东西收回自己（原有判据不动）；
    //   · 人卡：**事件台槽里已放的人** —— 拖回带子 ＝ 从那件事里取回（页面态）；
    //   · 金币：**金币槽里已垫的钱** —— 拖回带子 ＝ 取回垫金（页面态）。
    //   没被放置的人卡/金币拖回带子是无意义动作 ⇒ 亮"放不进"。
    if (src.kind === 'item') {
      // 已经是我的东西 ⇒ 拖回带子是无意义动作，亮"放不进"（而不是假装收了一次）
      return src.holder !== S.view.me.id && canGiveTo(src.id, S.view.me.id);
    }
    if (src.kind === 'person') {
      if (src.ev) return true;                       // 从事件台槽里抓起来的那位 —— 一定可取回
      // 手牌上抓的人：只有他已经站在某个台/功能单里才"取回"得有意义
      return personPlacedInDesk(src.id);
    }
    if (src.kind === 'gold') return !!src.ev || goldPlacedAnywhere();
    return false;
  }
  if (d === 'fix') {
    if (src.kind !== 'person') return false;
    const v = S.view;
    const per = src.id === v.me.id ? v.me : arr(v.people).find((x) => x.id === src.id);
    if (!per) return false;
    if (isGone(per)) return false;
    if (src.id !== v.me.id && !per.affiliated) return false;
    const place = slot.dataset.fix;
    const field = place === '医馆' ? 'hp' : 'san';
    if ((per[field] ?? 3) >= 3) return false;   // 已满 ⇒ 不需要治疗
    const pts = place === '医馆' ? 3 : 2;       // 医馆 3 点 · 神殿 2 点（与 RESTORE_SPEC 同源）
    const left = src.id === v.me.id ? v.remaining : (per.ap ?? 0);
    return left >= pts;
  }
  // ⚠️⚠️ 2026-10-07（用户裁定·第二批）：功能单的**定额金币槽** ——
  //    拖金币卡进来 = 按定额记下（不是自由垫数：诊金是明码标价）。
  //    ⚠️ 金币是**池**，槽里"垫了"只是页面态（`fixGold`），卡带上的金币卡**不消失**
  //      —— 与事件钱槽同一语义（`picks[ev].gold` 也不从手上收走那张卡）。
  if (d === 'fixgold') {
    if (src.kind !== 'gold') return false;
    return (S.view.gold ?? 0) >= FIX_SPECS[slot.dataset.fix].cost;
  }
  if (d === 'who') {
    // ⚠️ 2026-10-05 补：这一支此前只判 `src.kind === 'person'`、**不判这个人派不派得动**
    //    ⇒ 拖一张**未入队**的人卡进「人」槽，它就进了 `participants`：UI 上看着成功了，
    //    一直挂到点「派人去」才被服务端闸门 ③ 拒（"我拖进去了，怎么提交就报错"）。
    //    点选那一支一直判了 `available`（复选框是 `disabled` 的）⇒ **两条路原本不一致**。
    //    现在两条都走 `canDispatchTo` —— 判据只有一处。
    // ⚠️ 玩家本人**也**能拖进来（他左栏那张「三王子」卡同样带 `data-kind="person"`）⇒
    //    这里不能把 `affiliated` 那一刀砍到他身上：他不是下属，但「我亲自」这一行是合法的。
    //    他能不能上，仍由 `canSelf`（`dispatchable === '仅派遣'` ⇒ 亲自去不了）那一支管。
    const ev = eventOf(slot.dataset.ev);
    if (!ev) return false;
    // ⚠️⚠️ 清单第 1 条（持久化）：**处理中**的事件有一个只读回看台（cardHtml(e,true)）——
    //   它的槽只是**展示**玩家当时的输入，不再收卡（拖过去亮"放不进"，
    //   松手也进不了账）。可操作的只有「待处理」那一份处理台。
    if (ev.status !== '待处理') return false;
    // ⚠️⚠️ 2026-10-05（用户裁定第 3 条）：**物品槽取消** —— 物品改成「**拖到人身上**」。
    //    理由（用户原话）：「物品没有卡槽直接拖到人物卡上」＋「物品卡有个特效
    //    卡片缩小插入到人物卡上」—— 这条路把"谁带什么"变成**看得见的一层关系**，
    //    而"事件卡里一个孤零零的物品下拉框"表达不了"这东西归谁"。
    //    ⇒ **这一格现在只收两种卡：人卡（派他去） ＋ 物卡（给他带上）。**
    //      这两件事在这一格是**同一个动作**：「让这个人带着这个东西去办这件事」。
    if (src.kind === 'item') {
      // ⚠️⚠️ 2026-10-06：**物卡现在拖到「人位」上 ＝ 交给他**（用户裁定：
      //    「物品没有卡槽直接拖到人物卡上」＋「能拖过去就能拖回来」）。
      //    通路是 `/api/give`（`Session.give`），判据走**既有的**闸门 ⑤
      //    （`CARRY_CAP = 4` ＋ 持有者唯一）—— UI 不自己算上限。
      //    ⚠️ 物品**在别人身上**时也允许拖：拖给**另一个人**＝转移；
      //      拖到**自己的卡**上＝收回（`canGiveTo` 那一支把 `npc000` 也算成合法落点）。
      return canGiveTo(src.id, slot.dataset.toWhom || '');
    }
    // ⚠️⚠️ 2026-10-05：**这里刻意不接物卡** —— 见 `canDropOn` 顶上那段。
    //    用户裁定的方向是「物品拖到人身上」（改变**携带关系**），
    //    而携带关系住在 `Person.items`（账本字段），**UI 侧没有写它的通路**：
    //      · `usedItemId` 是「这次用哪件」的**单值**叙事指定，不改携带；
    //      · 闸门 ⑤（`CARRY_CAP = 4`）只**校验**"至多 4 件"，不提供"装填"入口
    //        （`卡槽与LLM分工.md` §1.2 原话：「判据在，但**生产路径无入口**」）。
    //    ⇒ 物品要真能"拖到人身上"，得先在规则侧开一条 `/api/give`（装填/取下）。
    //      那是账本写入（`Person.items` ＋ `Item.holder` 两处），
    //      **本轮不做**（要先定"取下"与"消耗"怎么算）—— 见交付说明。
    if (src.kind !== 'person') return false;
    // ⚠️ 2026-10-05：人形改成四个卡位 ⇒ 这里要拦**两种满**：
    //    ① 槽满（4 个都有人了）—— 用户裁定「统一为 4 个槽」；
    //    ② 超这条事件的上限（`max_people`，LLM 给 · 闸门 ⑦ 判那个数）。
    //    ⚠️ **两条独立算**（已在 `卡槽与LLM分工.md` §2.3 裁定「各自独立算」）：
    //       4 是系统给的槽数，`max_people` 是这条事件的性质 —— 谁更小听谁的。
    //    ⚠️ 已经在这条里的人**可以再点一下取回来** ⇒ 重复放自己不算"超上限"。
    const picked = arr(pickOf(slot.dataset.ev).participants);
    if (picked.indexOf(src.id) >= 0) return true;
    if (picked.length >= 4) return false;
    if (picked.length >= (ev.max_people || 0)) return false;
    if (src.id === S.view.me.id) return ev.dispatchable !== '仅派遣';
    return canDispatchTo(arr(S.view.people).find((x) => x.id === src.id), ev);
  }
  if (d === 'voucher') {
    // ⚠️⚠️ 2026-10-06 清单第 4B.4 条：凭证卡**只能拖进「你的欲望」那一屏的四行卡位**。
    //   三条判据（缺一条就会出现"我明明拖进去了怎么没反应"）：
    //     ① 源必须是 **voucher 卡**（人卡/物卡/金币拖进凭证槽一律拒）；
    //     ② **维度必须与那一行相同**（成果的卡进不了手段那一行）——
    //        与"物品只能拖到人身上"同一条纪律：格子有自己的类别。
    //     ③ 那一行**还没放满、且这一格还空着**。
    if (src.kind !== 'voucher') return false;
    if (src.dim !== slot.dataset.vdim) return false;
    const vi = Number(slot.dataset.vi);
    const st = vPick()[slot.dataset.vdim];
    if (!Array.isArray(st) || vi < 0 || vi >= st.length) return false;
    // ⚠️ 再拖一次**同一张进同一个空位** ＝ 幂等（放进去），不是"再放一遍"
    if (st[vi] === src.id) return true;
    return st[vi] === '';
  }
  if (d === 'gold') {
    // ⚠️ 2026-10-05：钱格**接金币卡了**（用户裁定「金币也统一为卡牌」）。
    //    ⚠️ 它**不查实体表**（金币不是实体，`view.gold` 只是一个数）——
    //       这一点与人物/物品两支根本不同，别照抄它们的形状。
    //    ⚠️ **手上没金币时不可拖**：拖了也是 0（那次拖拽不会有任何效果），
    //       而一次"点了没反应"的拖拽比"这一格不接受它"更让人困惑。
    //    ⚠️ 「处理中」的回看台同样不收（与 who 那一支同一条纪律）。
    if (slot.dataset.ev) {
      const gev = eventOf(slot.dataset.ev);
      if (gev && gev.status !== '待处理') return false;
    }
    return src.kind === 'gold' && (S.view ? (S.view.gold || 0) : 0) > 0;
  }
  return false;
}

/**
 * **金币卡拖到钱格上时，该过去多少枚**（2026-10-05 用户裁定的三条规则）。
 *
 * 规则原文：「默认拖拽出**最小数量的金币**（**0 则无效果，不足则全部拖拽过来**），
 * **再拖拽的话默认 +1**」。
 *
 * ⚠️ 三档的判据：
 *   ① `min_gold === 0`（没标最低投入）⇒ **本次无效果**，钱格不涨。
 *      为什么不是"就 +1"：没要求垫钱时，玩家拖金币是想**看**这件事要多少钱，
 *      不是想**付**钱。自动 +1 会在他想看的时候扣他的钱（下一格就要付了）。
 *   ② `min_gold > 0` 且 `已垫 = 0` ⇒ 过去 `min(min_gold, 手上)`。
 *      **不足则全部**：差额他补不上，让他看见"差多少"比让拖拽静默失败好。
 *   ③ 已垫过 ⇒ **+1**。倍数没有意义（一次只办一件事），而"一枚一枚加"最直白。
 *
 * @returns 本次要过去多少枚（0 = 无效果）
 */
function goldDropAmount(evId){
  const ev = eventOf(evId);
  if (!ev) return 0;
  const sel = pickOf(evId);
  // ⚠️ 2026-10-07（串行金币）：`have` = **手上净额**（总账减掉所有桌上已垫的，
  //   含别的事件）—— 用总账的话，两件事的台面一起开就能垫出超过持有数的钱。
  const have = haveGold();
  const need = Math.max(0, ev.min_gold || 0);
  if (need === 0) return 0;                                  // ① 没标最低 ⇒ 无效果
  if (sel.gold <= 0) return Math.min(need, have);             // ② 第一次 ⇒ 最少（或全部）
  return have > 0 ? 1 : 0;                                    // ③ 之后每次 +1（手上还有才加）
}

/**
 * 造"跟在指针上的那张卡" —— **克隆源卡本身**，不是一条文字标签。
 *
 * ⚠️ 为什么克隆而不是新建一个 div：玩家拖的是**这张卡**，预览就该是这张卡
 *    （2026-09-23 用户：「拖出来的根本不是一个卡牌」）。照抄外形还有个白赚的好处 ——
 *    以后改卡面样式，拖拽预览**自动跟着变**，不必维护第二份样式（本项目最怕的"两处实现"）。
 * ⚠️ 克隆体必须**摘掉 `data-kind` / `data-id` / 所有 `data-act`**：它留在 DOM 里，
 *    带着这些标记就可能被事件处理器当成"真的那张卡"（`pointerdown` 找的正是
 *    `.pcard[data-kind]`）。`pointer-events:none` 是第二道防线 —— 不把"伪卡"的
 *    可识别标记留在页面上，是第一道。
 */
function makeGhost(srcEl){
  const g = srcEl.cloneNode(true);
  g.classList.add('dragghost');
  g.removeAttribute('data-kind');
  g.removeAttribute('data-id');
  const marked = g.querySelectorAll('[data-act]');
  for (let i = 0; i < marked.length; i++) marked[i].removeAttribute('data-act');
  return g;
}

/** 收尾：清高亮 ＋ 摘掉幽灵 ＋ 退出拖拽态。**幂等**（没在拖也能安全调用） */
function dragEnd(){
  if (ghost) { ghost.remove(); ghost = null; }
  const lit = document.querySelectorAll('.slotbox.dropok,.slotbox.dropno');
  for (let i = 0; i < lit.length; i++) lit[i].classList.remove('dropok', 'dropno');
  document.body.classList.remove('dragging');
  // ⚠️ 清单第 1 条：源卡"回到"手牌区（拖放成功时随后而来的 render() 本来就会重画，
  //   它不在了；失败松手时这一行把他还回来）。
  if (dragEl) dragEl.classList.remove('dragsrc');
  dropHit = null;
  dragEl = null;
}

document.addEventListener('pointerdown', (ev) => {
  // ⚠️ 源 ＝ **三种**卡：底部手牌的人卡 / 物卡（`.hcard`，2026-05 布局重构新增），
  //    ＋ 左栏那两种（`.pcard` / `.icard`）。`data-kind` / `data-id` **本来就在卡上**
  //    （点开详情用的）⇒ 没为拖拽加属性。
  // ⚠️ **主角的卡同样在列**（`.hcard.me` 也带 `data-kind`）—— 用户裁定
  //    「主角也应当可以拖拽，待遇其实和其余下属差不多」⇒ 拖拽源**不按身份分**。
  // ⚠️⚠️ 2026-10-07（用户第 1 条）：**事件台槽里已放的那张卡也是源**
  //    （`.scard[data-kind]`，渲染处已补属性）——「拖到事件卡槽里的卡牌，
  //    还是无法直接拖回手牌区」的根因就是它不在源选择器里，抓都抓不起来。
  const card = ev.target.closest('.hcard[data-kind],.pcard[data-kind],.icard[data-kind],.scard[data-kind],.hg[data-kind]');
  if (!card) return;
  if (ev.target.closest('button')) return;                    // 卡里的「医」「祈」不参与拖拽
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;  // 只认左键（触摸上报的是 0）
  // 卡名：手牌用 `.hn`，左栏那两张用 `.nm` —— 幽灵上要印的是**人的名字**。
  const nm = card.querySelector('.hn') || card.querySelector('.nm') || card.querySelector('.sn');
  dragEl = card;
  // ⚠️⚠️ 2026-10-06 清单第 4B.4 条：凭证卡的标识在 **`data-vid`**（不是 `data-id`）——
  //   它是 `v:{dim}:{绑定id}` 这种带前缀的串（`VoucherRecord` 自己没有 id 字段），
  //   而其余卡一律用 `data-id` ⇒ 这里做一次回退，**不新建第二套取 id 的地方**。
  // ⚠️ `dim` 一并带上：`canDropOn` 的 voucher 那一支要判"这一行的类别对不对"。
  const theId = card.dataset.id || card.dataset.vid || '';
  // ⚠️ 2026-10-07：`holder` ＝ 这张物卡**现在在谁身上**（详情页卡槽里的物卡带它，
  //    手牌带上玩家自己的物卡不带 ⇒ 视作 `npc000`）——
  //    槽内换位那一支靠它分"同一个人槽内调顺序"和"交给另一个人"。
  // ⚠️ `ev` ＝ 金币从**哪件事**的金币槽被抓起来的（`data-ev`）——
  //    拖回手牌带时只退这一件事的垫金，不清别家。
  dragSrc = { kind: card.dataset.kind, id: theId, dim: card.dataset.vdim || '',
              holder: card.dataset.holder || 'npc000',
              ev: card.dataset.ev || '',
              name: (nm && nm.textContent) || card.dataset.name || theId || '',
              x: ev.clientX, y: ev.clientY };
  dragMoved = false;
});

document.addEventListener('pointermove', (ev) => {
  if (!dragSrc) return;
  if (!dragMoved) {
    // ⚠️ 阈值：不设它的话，整张卡的**点击**（点开详情）会被拖拽吃掉 —— 手指/鼠标总会抖一两个像素
    if (Math.abs(ev.clientX - dragSrc.x) < DRAG_MIN && Math.abs(ev.clientY - dragSrc.y) < DRAG_MIN) return;
    dragMoved = true;
    document.body.classList.add('dragging');
    // 幽灵 ＝ **源卡的克隆**（外形、当前勾选状态都跟着走）—— 见 `makeGhost`
    if (dragEl) {
      ghost = makeGhost(dragEl);
      document.body.appendChild(ghost);
      // ⚠️ 清单第 1 条：拖起来的那张卡**从手牌区消失**（`visibility` 保布局不跳）——
      //   卡只有一份：要么在手上，要么跟在指针上，不该两张同时在屏幕上。
      //   ⚠️ 类**加在克隆之后**（克隆体不带它），失败松手时由 `dragEnd` 摘掉。
      dragEl.classList.add('dragsrc');
    }
  }
  if (ghost) {
    ghost.style.left = (ev.clientX + 12) + 'px';
    ghost.style.top = (ev.clientY + 14) + 'px';
  }
  // ⚠️ `elementFromPoint` 命中的是**最上面**那个元素 —— 幽灵必须 `pointer-events:none`（见 CSS），
  //    否则它自己会把每一格都盖住，落点**永远是 null**。
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  // ⚠️ 2026-10-05：落点**优先认 `.pslot`（某一个具体的位）**，其次才退到整个 `[data-drop]` 槽。
  //    为什么：人槽里有 4 个位 ＋ 一堆别的内容，落在"人槽的标题上"也算放下会让人以为
  //    "整格都收"，而实际上收的是**某一个空位**。先找 `.pslot` 语义才准。
  //    ⚠️ 退到 `[data-drop]` 那一支**必须留着**：物格/钱格在某些状态下没有 `.pslot`
  //    （物品池为空时画的是提示块，钱格也可能是），那时整格都要能接。
  // ⚠️⚠️⚠️ 2026-10-06 修用户问题 10（「装备还是不能正常的通过拖拽在人物身上装备和卸下」）：
  //   落点候选**少了 `data-to-whom`（人卡/物卡名下那张）** ⇒ 物卡拖到人卡上时
  //   `under.closest('.pslot')` 与 `closest('[data-drop]')` **都返回 null**
  //   ⇒ `dropHit` 恒为 null ⇒ `pointerup` 里 `if (dropHit && …)` 整条不成立
  //   ⇒ **拖到任何人身上都没反应**（而拖到事件卡的「人」格是好的 —— 那个有 `.pslot`）。
  //   ⇒ 把 `data-to-whom` 补进候选（**第三个**）：它是「交给这张卡的主人」那条路。
  //   ⚠️ 顺序有意放在**最后**：`.pslot` 与 `[data-drop]` 语义更具体，优先认它们；
  //     `data-to-whom` 只是兜底（人物卡本身没有别的槽）。
  // ⚠️⚠️ 2026-10-07（用户裁定）：落点候选**第三位是「卡级 data-to-whom」**、
  //   **第四位才是 `[data-drop]`** —— 顺序不能反：
  //   手牌带整条挂了 `data-drop="hand"`（"拖回手牌区＝收回"），而带上的人卡
  //   自己带着 `data-to-whom`（"拖到他身上＝交给他"）。若先认 `[data-drop]`，
  //   `closest` 会先撞上**外层那条带** ⇒ 拖到 B 卡上会变成"收回自己"（实测翻车）。
  //   ⇒ 卡级语义更具体，先认它；带子只接**卡缝里**的落点。
  //   （事件台的 `.dia` 不受影响：它不是 `.hcard/.pcard/.icard`，认不到上一条。）
  //   ⚠️⚠️ 2026-10-07（用户第 1 条补）：**人卡/金币的拖回被卡"吞"了** ——
  //     从事件台槽里抓起的人卡拖回手牌带，落点常砸在带上**某张人物卡**上，
  //     卡级 `data-to-whom` 先被认走 ⇒ 变成"把人交给某人"（无此语义）⇒ 放不进。
  //     ⇒ 「交给某人」是**物卡专属**语义 ⇒ 只有物卡才走卡级那一档；
  //       人卡/金币直接落带子（整条带都是「取回」）。
  const t = under
    ? (under.closest('.pslot')
       || under.closest('.islot')
       || (dragSrc && dragSrc.kind === 'item'
           && under.closest('.hcard[data-to-whom],.pcard[data-to-whom],.icard[data-to-whom]')
           ? under.closest('[data-to-whom]')
           : null)
       || under.closest('[data-drop]'))
    : null;
  if (t !== dropHit) {
    dropHit = t;
    const lit = document.querySelectorAll('.slotbox.dropok,.slotbox.dropno');
    for (let i = 0; i < lit.length; i++) lit[i].classList.remove('dropok', 'dropno');
    if (dropHit) dropHit.classList.add(canDropOn(dropHit, dragSrc) ? 'dropok' : 'dropno');
  }
});

// ⚠️ `async`：2026-10-06 起"放下"要**发请求**了（物卡 ⇒ `/api/give` 交给那个人）。
//    它是**整段唯一的异步落点** —— 后面那个物卡分支里 `await api(...)`，所以这个
//    监听器必须 async。⚠️ 不影响另外两条落点（人/钱只是改页面状态），它们在
//    `await` 之前就改完了，行为与从前一致。
document.addEventListener('pointerup', async () => {
  if (!dragSrc) return;
  const src = dragSrc;
  // ⚠️⚠️ 2026-10-07（真机探针抓到）：收尾原来裸放在函数末尾 —— 而 give / 槽位换位
  //   那些分支 `await api(...)` 之后直接 `return` ⇒ **清尾被跳过**，
  //   幽灵小纸片（`.dragghost`）留在屏幕上 —— 用户截图里"奇怪的物品特效 /
  //   特殊物品好像不消失"的元凶就是它（一次 give 留一张，越拖越多）。
  //   ⇒ 整段包进 try/finally：**任何一条路**松手都收得干干净净。
  try {
  if (dragMoved) {
    justDragged = true;   // 松手之后浏览器还会补一次 click ⇒ 那一下**不算点击**（450ms 时间窗，见点击守卫）
    justDraggedAt = Date.now();
    if (dropHit && canDropOn(dropHit, src)) {
      // 落下来做的事 ＝ **点一下那件事**：同一份状态、同一条提交通路（那颗「派人去」）
      const eid = dropHit.dataset.ev;
      const p = pickOf(eid);
      if (dropHit.dataset.drop === 'who') {
        // ⚠️⚠️ 清单第 1 条：**一个人同一时刻只在一件事里** —— 放进这一件之前，
        //   先把他在**别的**事件处理台里的位子撤掉（语义 ＝"他改去办这件了"）。
        //   没有这一步，同一张卡能同时挂在两个事件里（用户实测复现过的账面错乱）。
        //   ⚠️ 不在 `canDropOn` 里拦：拦了会出现"他被 A 占着、B 又放不进"的死局 ——
        //     换事件应当是**转移**，不是撞墙。
        for (const otherId in picks) {
          if (otherId === eid) continue;
          const op = picks[otherId];
          if (op && arr(op.participants).length) {
            op.participants = op.participants.filter((x) => x !== src.id);
          }
        }
        const set = new Set(p.participants);
        set.add(src.id);
        p.participants = [...set];
      } else if (dropHit.dataset.drop === 'fix') {
        // ⚠️⚠️ 2026-10-07：固定功能卡（医馆疗伤 / 神殿净化）—— 只改**页面态**
        //   （与事件台 `picks` 同一条纪律：拖放是"意向"，点「确定」才是事实）。
        //   ⚠️ 一张卡只放一个人 ⇒ 再拖一个进来 = 换人（不是排队）。
        fixPicks[dropHit.dataset.fix] = src.id;
        render();
      } else if (dropHit.dataset.drop === 'fixgold') {
        // ⚠️⚠️ 2026-10-07（用户裁定·第二批）：功能单的定额金币槽 —— 只记页面态。
        fixGold[dropHit.dataset.fix] = true;
        render();
      } else if (dropHit.dataset.drop === 'hand') {
        // ⚠️⚠️ 2026-10-07（用户第 1 条）：拖回手牌带 ＝ **拿回来**，按卡种分流：
        //   · 物卡 ⇒ 收回自己（`/api/give` to=me，账本动作，原有）；
        //   · 人卡 ⇒ 从事件台/功能单的槽里**取回**（纯页面态：清 `picks` / `fixPicks`）；
        //   · 金币 ⇒ 取回垫金（`src.ev` 指明从哪件事抓的 ⇒ 只退那一件；没指明 ⇒ 全退）。
        if (src.kind === 'item') {
          await api('/api/give', { to: S.view.me.id, items: [src.id] }, '收回来了…');
          return;
        }
        if (src.kind === 'person') {
          let changed = false;
          for (const id in picks) {
            const op = picks[id];
            if (op && arr(op.participants).indexOf(src.id) >= 0) {
              op.participants = op.participants.filter((x) => x !== src.id);
              changed = true;
            }
          }
          for (const fp in fixPicks) {
            if (fixPicks[fp] === src.id) { fixPicks[fp] = ''; changed = true; }
          }
          if (changed) render();
          return;
        }
        if (src.kind === 'gold') {
          let changed = false;
          if (src.ev && picks[src.ev] && picks[src.ev].gold > 0) {
            picks[src.ev].gold = 0; changed = true;        // 只退抓出来的那一件
          } else {
            for (const id in picks) {
              if (picks[id] && picks[id].gold > 0) { picks[id].gold = 0; changed = true; }
            }
            for (const fp in fixGold) {
              if (fixGold[fp]) { fixGold[fp] = false; changed = true; }
            }
          }
          if (changed) render();
          return;
        }
        return;
      } else if (src.kind === 'item' && (dropHit.dataset.toWhom
        || (dropHit.closest && dropHit.closest('[data-to-whom]')))) {
        // ⚠️⚠️ 2026-10-07：**槽内换位**（详情页四个物品卡槽）—— 落点是 `.islot`
        //   且这件东西**本来就在这个人身上** ⇒ 玩家要的是**调顺序**（生效优先级），
        //   不是"给自己"（`/api/give` 只会 push 到尾，调不出"挪到最前"）。
        //   ⚠️ 目标槽**有人** = 两件换位（用户原话：「应当自然的理解为玩家想要调换顺序」）；
        //     目标槽**空** = 挪到那个位。都走 `/api/items/order`（同集重排，服务端校验）。
        const slotWho = dropHit.dataset.slotwho;
        if (slotWho && src.holder === slotWho) {
          const hostP = slotWho === S.view.me.id ? S.view.me
            : arr(S.view.people).find((x) => x.id === slotWho);
          const cur = arr(hostP && hostP.items).map((x) => x.id);
          const from = cur.indexOf(src.id);
          const toIx = Number(dropHit.dataset.slotix);
          if (from >= 0 && toIx !== from) {
            const order = cur.slice();
            if (toIx < order.length) {
              const t = order[from]; order[from] = order[toIx]; order[toIx] = t;   // 换位
            } else {
              order.splice(from, 1); order.push(src.id);                            // 挪到空位（末位）
            }
            await api('/api/items/order', { who: slotWho, order: order }, '调整携带顺序…');
            return;
          }
          // from === toIx（拖回原位）⇒ 什么都不做，落穿到下面也无害，直接收
          dragEnd(); return;
        }
        const host = dropHit.dataset.toWhom
          ? dropHit
          : dropHit.closest('[data-to-whom]');
        const to = host && host.dataset.toWhom;
        if (to) {
          await api('/api/give', { to: to, items: [src.id] }, (to === S.view.me.id ? '收回…' : '交给他…'));
          // ⚠️ 交给他之后卡带上那张物卡要消失 ⇒ `api()` 里的 `render()` 会重画。
          //   ⚠️ 2026-10-07 用户裁定：旧的"缩小插进人卡"演出（markCarried）**已删** ——
          //     「删掉这个奇怪的携带特效」。
          return;
        }
      } else if (dropHit.dataset.drop === 'voucher') {
        // ⚠️⚠️ 2026-10-06 清单第 4B.4 条：凭证卡拖进四行卡位 ⇒ **只改页面态**（`vPicks`）。
        //   ⚠️ **不发请求** —— 放格子在点「确定」那一刻才变成一次真实提交（`/api/finish`）。
        //     这与事件台那个 `picks` 同一条纪律：拖放是"意向"，提交才是"事实"。
        //   ⚠️ **同一张凭证不许占两格** —— 放之前先把别处同一 id 的清掉。
        const dim = dropHit.dataset.vdim, vi = Number(dropHit.dataset.vi);
        const st = vPick();
        for (const k in st) {
          const row = st[k];
          for (let j = 0; j < row.length; j++) if (row[j] === src.id) row[j] = '';
        }
        if (Array.isArray(st[dim]) && vi >= 0 && vi < st[dim].length) st[dim][vi] = src.id;
        vPersistSave();   // ⚠️ 2026-10-07（用户裁定）：放上去就**默认持久化**（刷新不丢）
        render();
      } else if (dropHit.dataset.drop === 'gold') {
        // ⚠️ 2026-10-05：金币卡拖进来 ⇒ 按 `goldDropAmount` 的三条规则加钱。
        //    ⚠️ **加的是 `sel.gold`（"这件事垫多少"），不是动 `view.gold`** ——
        //    真正的扣账在 `arrange` 提交后由规则层做。
        //    这里改的是**玩家的意向**；现在就把 `view.gold` 减掉的话，
        //    玩家还没点「派人去」钱就少了 ⇒ 取消都取消不回来。
        const add = goldDropAmount(eid);
        if (add > 0) { p.gold = Math.min(haveGold(), (p.gold || 0) + add); render(); }
        // ⚠️ `add === 0`（没标最低投入）⇒ **什么都不做，也不报错**：
        //    那一档的语义是"没要求垫钱"，玩家拖它只是想知道要多少。
        //    但**要给一句提示**，否则他会以为卡坏了 —— 槽上写"这件事不用垫钱"。
        else flashSlot(dropHit, '这件事不用垫钱');
      } else {
        // ⚠️⚠️ 2026-10-07：这里原来写的是"落进物格 ⇒ 记下这次用哪件"。
        //   而**物格已撤**（第 5 条：事件台只有 4 个人物槽 ＋ 1 个金币槽）
        //   ⇒ 能走到这儿的落点只剩 who / gold / voucher 三种，**都在上面接掉了**。
        //   ⇒ 什么都不做。留一个"往一个不存在的格子里瞎写状态"的口子，
        //     比留空危险得多（那会让那个字段变成一串人物 id）。
      }
      render();
    }
  }
  } finally {
    dragEnd();
    dragSrc = null;
    dragMoved = false;
  }
});

// 手势被系统抢走（触屏滑动 / 右键菜单 / 切窗口）⇒ 同样收尾，别把幽灵小纸片留在屏幕上
document.addEventListener('pointercancel', () => { dragEnd(); dragSrc = null; dragMoved = false; });

// ── 交互 ────────────────────────────────────────────────────────
document.addEventListener('click', async (ev) => {
  // ⚠️ **必须在最前**（在任何 `return` 之前消费掉）：刚拖完的那一下会补一个 click，
  //    不拦它 ⇒ 松手就顺手把那张卡的详情浮层打开了。
  //    ⚠️⚠️ 2026-10-07（用户实测"✔点不动"的真凶）：这个守卫**只能信一段时间**——
  //      拖放落地后 `render()` 会重画落点下的 DOM，浏览器一看"按下和松开不是同一个元素"
  //      就**不再补发 ghost click** ⇒ 旗子滞留 true ⇒ 下一颗真实按键（✔/简略处理）被白吞。
  //    ⇒ 改成**时间窗**：只在松手后 450ms 内吞（ghost click 都在几十 ms 内补发），
  //      过期的旗子在这里顺手清掉，绝不滞留。
  if (justDragged) {
    if (Date.now() - justDraggedAt < 450) return;
    justDragged = false;
  }
  // ⚠️⚠️ 2026-10-07（用户实测"金币撤不回来"）：点已放上的卡位 ⇒ 取回 ——
  //   这件事**必须走在 data-act 闸门之前**：槽位（.pslot）不带 data-act，
  //   `closest('[data-act]')` 一路找不到就 return ⇒ 原先那个取回分支是**死代码**
  //   （点 ×、点槽都没反应 —— 正是病根）。
  //   三种取回：人（弹 participants 末位）/ 物（清 usedItemId）/ 钱（**清零** =
  //   全撤 —— "拖是垫一点，点是全撤"，与 `goldDropAmount` 的 ① 同一理由）。
  const slotEl = ev.target && ev.target.closest ? ev.target.closest('.pslot.filled') : null;
  if (slotEl) {
    const d = slotEl.dataset.drop, eid2 = slotEl.dataset.ev;
    // 「处理中」的回看台只**展示**当时的输入 —— 点它的卡位不取回（账面不容页面态篡改）
    const evObj = eid2 ? eventOf(eid2) : null;
    if (evObj && evObj.status !== '待处理') return;
    if (d === 'who') {
      const pp = pickOf(eid2);
      if (arr(pp.participants).length) {
        const nm2 = nameOfId(pp.participants[pp.participants.length - 1]);
        pp.participants = pp.participants.slice(0, -1);
        render();
        flashSlot(slotEl, '取回 ' + nm2);
      }
    } else if (d === 'item') { pickOf(eid2).usedItemId = null; render(); }
    else if (d === 'gold') { pickOf(eid2).gold = 0; render(); }
    return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const evId = el.dataset.ev;
  if (act === 'pick') {
    const p = pickOf(evId);
    const set = new Set(p.participants);
    if (el.checked) set.add(el.dataset.who); else set.delete(el.dataset.who);
    p.participants = [...set];
    // ⚠️ 换了随行的人 ⇒ 物格池子跟着变：**原先选好的那件东西可能不在池里了**（比如把"我"取消掉）。
    //    必须当场清掉 —— 否则 `picks` 里留着一个下拉里看不见、也不在场上的 id，
    //    提交时要么被服务端守卫拒，要么静静写进提示词（"他用了一件没带在身上的东西"）。
    if (p.usedItemId && !carrierPoolOf(p).some((x) => x.it.id === p.usedItemId)) p.usedItemId = '';
    render(); return;
  }
  if (act === 'popup') {
    // ⚠️ 2026-10-05：引导①「点开那张牌」在**这一刻**才算玩家学会了 ——
    //    他不是"看到了提示"，是**真的自己点开并处理了**。
    //    ⚠️ 刻意挂在 `popup`（点选）而不是 `popupOpen`（打开浮层）：
    //    打开浮层可能只是好奇点一下、看完就关；处理完才说明他会用了。
    markHint('openPopup');
    // ⚠️ 结果文案**不再在这里单独入队**：它同时也被推给了 `S.feed`（`kind:'弹窗'`）
    //    ⇒ 统一由 `collectResults()` 收。两处都收 = 同一段话弹两遍。
    // ⚠️ **点选之前先抓一张快照**（2026-09-23）：那一条马上就被结算掉、从 `popups` 里消失，
    //    而玩家要的"保留事件页面 ＋ 玩家处理方式"只能靠这份快照（见 `handled` 的说明）。
    //    ⚠️ 必须在 `await` **之前**抓 —— `api()` 回来会 `render()`，那时 `S` 已经换新了。
    const cur = arr(S && S.view && S.view.popups).find((x) => x.id === evId);
    const i = Number(el.dataset.i);
    const snap = cur ? { id: cur.id, title: cur.title, stage: cur.stage, content: cur.content,
                         options: arr(cur.options).map((o) => o.text), chosen: i, result: '' } : null;
    handled = snap;
    // ⚠️ 2026-10-05：把那层「你当场就得拿主意」**收掉** —— 点完之后它就该让位给
    //    `handled`（事件页面 ＋ 处理方式 ＋ 结算结果）。不收的话两条会叠着渲染。
    popupOpenId = '';
    const r = await api('/api/popup', { eventId: evId, optionIndex: i }, '正在结算这一步…');
    // 判"这一下到底落没落账"：看**新信封里那一条还在不在 `popups`**。
    // 还在 ⇒ 没落（被闸门拦下 / 陈旧页面 / 结果被拒）⇒ 快照作废
    // （否则会弹出一张"你做了这一步"、其实什么都没发生的卡）。
    // 不在了 ⇒ 落了 ⇒ 留着给玩家看下半场（**哪怕 `ok:false`** —— 比如点选成功、
    // 但紧随其后的翻牌失败：那一半也是这一下的结果，正该让玩家看见）。
    if (!snap || arr(r && r.view && r.view.popups).some((x) => x.id === evId)) handled = null;
    return;
  }
  // ⚠️⚠️ 2026-10-06 清单第 5.6 条：**选处理方式**（互斥单选，零网络）
  //   「简略处理」／「亲自去且仔细处理」—— 用户原话「**两个按钮必须点且只能点一个**」。
  // ⚠️ **再点一次＝取消选择**（回到"还没选"）—— 那是玩家的后悔药，不做就得重开这个浮层。
  if (act === 'how') {
    const p = pickOf(evId);
    p.handling = p.handling === el.dataset.how ? '' : el.dataset.how;
    render(); return;
  }
  // ⚠️ 5.4 的「×」＝退出当前事件。⚠️ **连本地暂存一起清掉** ——
  //   留着它的话，下次点开同一件事会看到上一次的选择（像是"我没选过"）。
  if (act === 'closeDetail') {
    if (evId) delete picks[evId];
    detailOpen = null;
    render(); return;
  }
  // ⚠️ 5.4 的「✔」＝确定以当前方式处理。**判据与按钮的置灰是同一份**（`okAll`），
  //   而**服务端还会再拒一次**（闸门 ③/⑨）—— 两处同源，不是两处各判一遍。
  if (act === 'commit') {
    const p = pickOf(evId);
    // ⚠️ 按钮灰着时点不到（`disabled`），但**键盘/脚本仍能触发** ⇒ 这里补一道，与 UI 同一个判据。
    if (!p.participants.length || !p.handling) { render(); return; }
    // ⚠️⚠️ 2026-10-07（用户裁定）：点 ✔ ⇒ **先退场** —— 事件台立刻收起，
    //   玩家马上去点开下一个事件；结算请求在后台排队跑（见 `api()` 的队列），
    //   结果回来时照常走揭晓 / 变化演出 / 结算弹窗那一条链。
    //   ⚠️ `picks[evId]` **不清**：排队期间他若再点开同一件事，看到的还是他摆的样子；
    //     结算落地后它转「处理中」，回看态读的是账本，这条页面态自然没人读。
    detailOpen = null;
    render();
    // ⚠️ **场景那路**：先开场景（`/api/scene/open`），不进 `/api/arrange` ——
    //   多轮场景是另一条链（`turn/scene.ts`），"亲自去且仔细处理"＝进那条。
    if (p.handling === 'scene') {
      if (!p.participants.includes(S.view.me.id)) { render(); return; }
      noteDispatched([S.view.me.id]);
      await api('/api/scene/open', {
        eventId: evId, participants: p.participants, goldInput: p.gold, usedItemId: p.usedItemId || null,
      }, '正在开场景…');
      return;
    }
    // 「简略处理」：一次了结 ⇒ 与旧的 arrange / self **同一条**（服务端那条也是一次提交）。
    // ⚠️ 玩家自己**不必亲自在槽里**（第 21 条：「简略处理也包括自己处理但不进多轮」）⇒
    //    玩家不在槽里时，`participants` 就是他的人（若有别人就派别人）。
    const parts = p.participants.length ? p.participants : [S.view.me.id];
    noteDispatched(parts);
    const r = await api('/api/arrange', {
